<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCP 能力注册</title>
<style>
  :root{
    --bg:#fbfbfa;--surface:#fff;--surface-2:#f4f3f1;--surface-3:#eceae7;
    --text:#1a1a19;--text-2:#6b6b68;--text-3:#9a9a96;
    --line:rgba(0,0,0,.09);--line-2:rgba(0,0,0,.18);
    --warn:#a55a22;--danger:#a83226;--ok:#35713f;--radius:10px;
  }
  /* 深色有两处来源：系统偏好，以及宿主页面显式指定。
     嵌入到设置页时应用主题可能与操作系统不一致，iframe 里读不到宿主的 html.dark，
     所以宿主用 data-theme 传进来。:not([data-theme="light"]) 让显式的浅色压过系统偏好。 */
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){--bg:#131312;--surface:#1b1b1a;--surface-2:#232322;--surface-3:#2c2c2a;
      --text:#efeeea;--text-2:#a2a19c;--text-3:#73726e;
      --line:rgba(255,255,255,.10);--line-2:rgba(255,255,255,.22);
      --warn:#dda06c;--danger:#e88a80;--ok:#8cc49b;}
  }
  :root[data-theme="dark"]{--bg:#131312;--surface:#1b1b1a;--surface-2:#232322;--surface-3:#2c2c2a;
    --text:#efeeea;--text-2:#a2a19c;--text-3:#73726e;
    --line:rgba(255,255,255,.10);--line-2:rgba(255,255,255,.22);
    --warn:#dda06c;--danger:#e88a80;--ok:#8cc49b;}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);overflow-x:hidden;
    font:13px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;
    -webkit-font-smoothing:antialiased;padding:24px 28px 56px}
  .wrap{max-width:1180px;margin:0 auto}
  /* 嵌入模式（?embed=1）：整页由宿主的设置页承载，标题行重复一遍没有意义，
     页边距与最大宽度也要放开，否则 iframe 里会出现双重留白。
     画布由自己上色而不是设成透明 —— 即使 html 与 body 都写 transparent，
     浏览器仍按默认底色绘制 iframe 画布，深色下卡片下方就是一整片白。 */
  html.embed,body.embed{height:100%;background:var(--bg)}
  html.embed{color-scheme:light dark}
  :root[data-theme="light"]{color-scheme:light}
  :root[data-theme="dark"]{color-scheme:dark}
  body.embed{padding:0}
  body.embed .wrap{max-width:none;height:100%;min-height:0;padding:12px 0 24px}
  body.embed .title-row{display:none}
  body.embed .foot{display:none}
  /* 标签栏与卡片各自留出内边距：body 的外边距归零后，卡片会直接贴住宿主容器的边框。 */
  body.embed header{padding:0 16px}
  body.embed nav{padding:0 16px;margin-bottom:14px}
  body.embed .panel{padding:0 16px}
  body.embed .err{margin:0 16px 10px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  h1{font-size:17px;font-weight:500;margin:0 0 3px;letter-spacing:-.01em}
  /* apiduo 新增功能的界面标识：与 web/src/styles/apiduo-marks.css 同构，
     这里是独立 HTML，引不到那份样式表，所以内联等价实现。
     不用 background-clip: text —— 独立页没有 @supports 兜底，降级会变成一条实色块。 */
  .title-row{display:flex;align-items:center;gap:8px;margin-bottom:3px}
  .title-row h1{margin:0}
  .apiduo-mark{position:relative;font-size:10px;line-height:1.5;padding:1px 7px 1px 15px;
    border:.5px solid var(--line-2);border-radius:999px;color:var(--text-2);white-space:nowrap}
  .apiduo-mark::before{content:'';position:absolute;left:6px;top:50%;width:5px;height:5px;
    margin-top:-3px;border-radius:50%;background:currentColor}
  @media (prefers-contrast:more){.apiduo-mark{border-color:var(--text-2);color:var(--text)}}
  .sub{font-size:12px;color:var(--text-2)}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  button{font:inherit;font-size:12px;color:var(--text);background:var(--surface);
    border:.5px solid var(--line-2);border-radius:7px;padding:5px 12px;cursor:pointer}
  button:hover{background:var(--surface-2)}
  button.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
  button.tiny{font-size:11px;padding:3px 9px}
  button:disabled{opacity:.45;cursor:not-allowed}
  input,select,textarea{font:inherit;font-size:12px;color:var(--text);background:var(--surface);
    border:.5px solid var(--line-2);border-radius:7px;padding:5px 9px;width:100%}
  textarea{resize:vertical;min-height:64px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--line-2);outline-offset:1px}
  nav{display:flex;gap:2px;border-bottom:.5px solid var(--line);margin-bottom:18px}
  nav button{background:none;border:none;border-bottom:2px solid transparent;border-radius:0;
    padding:8px 14px;color:var(--text-2);font-size:12.5px}
  nav button:hover{background:none;color:var(--text)}
  nav button.on{color:var(--text);font-weight:500;border-bottom-color:var(--text)}
  .panel{display:none}.panel.on{display:block}
  .card{background:var(--surface);border:.5px solid var(--line);border-radius:var(--radius);padding:14px 16px}
  .card+.card{margin-top:10px}
  .card-title{display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin-bottom:10px;flex-wrap:wrap}
  .card-title>*{min-width:0}
  .card-title h2{font-size:12.5px;font-weight:500;margin:0}
  .hint{font-size:11px;color:var(--text-3);overflow-wrap:anywhere}
  .two-col{display:grid;grid-template-columns:196px minmax(0,1fr);gap:14px;align-items:start}
  @media(max-width:820px){.two-col{grid-template-columns:1fr}}
  .list{display:flex;flex-direction:column;gap:1px;max-height:520px;overflow:auto}
  .item{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:7px 9px;border-radius:7px;cursor:pointer}
  .item:hover{background:var(--surface-2)}
  .item.on{background:var(--surface-3)}
  .item-main{min-width:0}
  .item-name{font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item.on .item-name{font-weight:500}
  .item-meta{font-size:10px;color:var(--text-2)}
  .badge{flex:none;font-size:10px;padding:0 5px;border-radius:4px;background:var(--surface-2);
    color:var(--text-2);border:.5px solid var(--line)}
  .grid-3{display:grid;grid-template-columns:1.5fr .8fr 1fr;gap:8px}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(max-width:640px){.grid-3,.grid-2{grid-template-columns:1fr}}
  .field label{display:block;font-size:10.5px;color:var(--text-2);margin-bottom:3px}
  .mini{border:.5px solid var(--line);border-radius:8px;padding:7px 9px}
  .mini .k{font-size:10px;color:var(--text-2)}
  .mini .v{font-size:11.5px;margin-top:1px}
  .obs{border-left:2px solid var(--line-2);padding-left:11px;margin-top:10px}
  .obs.strong{border-left-color:var(--text)}
  .obs-title{font-size:11.5px;font-weight:500}
  .obs-desc{font-size:10.5px;color:var(--text-2);margin:2px 0 7px}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:10.5px;font-weight:400;color:var(--text-2);
    padding:6px 9px;background:var(--surface-2);white-space:nowrap}
  th:first-child{border-radius:7px 0 0 7px}
  th:last-child{border-radius:0 7px 7px 0}
  td{padding:7px 9px;border-bottom:.5px solid var(--line);font-size:11.5px;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .mono{font-variant-numeric:tabular-nums}
  .chip{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;
    border:.5px solid var(--line-2);color:var(--text-2);white-space:nowrap}
  .chip.ok{color:var(--ok);border-color:var(--ok)}
  .chip.warn{color:var(--warn);border-color:var(--warn)}
  .chip.bad{color:var(--danger);border-color:var(--danger)}
  .chip.mute{color:var(--text-3);border-color:var(--line)}
  .dist{display:grid;grid-template-columns:62px 1fr 88px;gap:10px;align-items:center;margin-top:7px;font-size:11px}
  .track{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;display:flex}
  .fill-ok{background:var(--text);height:100%}
  .fill-bad{background:var(--danger);height:100%}
  .dist-v{color:var(--text-2);font-size:10.5px;font-variant-numeric:tabular-nums}
  .check-row{display:grid;grid-template-columns:1fr 1fr 92px;gap:10px;align-items:center;
    padding:9px 0;border-bottom:.5px solid var(--line)}
  .check-row:last-child{border-bottom:none}
  .check-name{font-size:11.5px}.check-obj{font-size:10.5px;color:var(--text-2)}
  .check-res{text-align:right}
  @media(max-width:640px){.check-row{grid-template-columns:1fr;gap:4px}.check-res{text-align:left}}
  .empty{padding:24px;text-align:center;font-size:12px;color:var(--text-3)}
  .err{margin-bottom:12px;padding:9px 12px;border-radius:8px;font-size:12px;
    border:.5px solid var(--danger);color:var(--danger);display:none}
  .err.on{display:block}
  .foot{margin-top:24px;font-size:11px;color:var(--text-3)}
</style>
</head>
<body>
<div class="wrap">

<div class="err" id="err"></div>

<header>
  <div>
    <div class="title-row">
      <h1>MCP 能力注册</h1>
      <span class="apiduo-mark" data-apiduo="source" title="apiduo 扩展功能，非 new-api 上游能力">apiduo 扩展</span>
    </div>
    <div class="sub" id="summary">加载中…</div>
  </div>
  <div class="actions">
    <button id="btn-refresh">刷新</button>
    <button class="primary" id="btn-new">新建模型</button>
  </div>
</header>

<nav>
  <button class="on" data-tab="models">模型</button>
  <button data-tab="errors">错误规则</button>
  <button data-tab="obs">观察记录</button>
  <button data-tab="audit">巡检</button>
</nav>

<section class="panel on" id="models">
  <div class="two-col">
    <div class="card" style="padding:10px">
      <input id="search" placeholder="搜索模型" style="margin-bottom:8px">
      <div class="list" id="plist"><div class="empty">加载中…</div></div>
    </div>
    <div id="detail"><div class="card"><div class="empty">从左侧选一个模型，或点「新建模型」</div></div></div>
  </div>
</section>

<section class="panel" id="errors">
  <div class="card">
    <div class="card-title">
      <h2>全局默认规则</h2>
      <span class="hint">未匹配到的错误一律按不可重试处理；重试的代价是计费</span>
    </div>
    <div id="rules-global"><div class="empty">加载中…</div></div>
  </div>
  <div class="card">
    <div class="card-title">
      <h2>模型级覆盖</h2>
      <span class="hint">只写例外，不重复全局</span>
    </div>
    <div id="rules-model"><div class="empty">选择模型后显示</div></div>
  </div>
</section>

<section class="panel" id="obs">
  <div class="card">
    <div class="card-title">
      <h2>参数取值分布</h2>
      <span class="hint" id="obs-hint">选择模型后显示</span>
    </div>
    <div id="obs-body"><div class="empty">选择模型后显示</div></div>
  </div>
</section>

<section class="panel" id="audit">
  <div class="card">
    <div class="card-title">
      <h2>声明与观察的一致性</h2>
      <button class="tiny" id="btn-audit">重新运行</button>
    </div>
    <div id="audit-body"><div class="empty">选择模型后显示</div></div>
  </div>
</section>

<div class="foot">数据来源：mcp_model_profiles + 日志库的 param_snapshot · 只读日志，不改日志</div>
</div>

<script>
const $ = id => document.getElementById(id);
let current = null;      // 当前选中的 profile
let profiles = [];
let dirty = false;
let authToken = '';      // apiduo 的 access token（JWT）

// 嵌入到设置页时（?embed=1）由宿主用 postMessage 递 token 与主题进来。
// 宿主（React）已经持有 access token，这里就不必再调 /api/user/auth/refresh ——
// 那个接口与登录共用 CriticalRateLimit（30 次 / 1800s），
// 每打开一次设置页烧掉一格额度是不可接受的。
const PANEL_QUERY = new URLSearchParams(location.search);
const EMBED = PANEL_QUERY.get('embed') === '1';
const QUERY_THEME = PANEL_QUERY.get('theme');
if(QUERY_THEME === 'dark' || QUERY_THEME === 'light'){
  document.documentElement.dataset.theme = QUERY_THEME;
}
if(EMBED){
  document.documentElement.classList.add('embed');
  document.body.classList.add('embed');
}

let hostTokenResolve = null;
window.addEventListener('message', e => {
  if(e.origin !== location.origin) return;
  const d = e.data;
  if(!d) return;
  if(d.type === 'apiduo:mcp-theme' && (d.theme === 'dark' || d.theme === 'light')){
    document.documentElement.dataset.theme = d.theme;
  }
  if(d.type === 'apiduo:mcp-token' && typeof d.token === 'string' && hostTokenResolve){
    hostTokenResolve(d.token);
  }
});
// 等宿主递 token；超时就退回自己换（独立打开本页时走这条路）。
function hostToken(timeoutMs){
  if(window.parent === window) return Promise.resolve('');
  return new Promise(resolve => {
    hostTokenResolve = resolve;
    setTimeout(() => {
      if(hostTokenResolve === resolve) hostTokenResolve = null;
      resolve('');
    }, timeoutMs);
  });
}

function showErr(msg){
  const el = $('err');
  if(!msg){ el.classList.remove('on'); el.textContent=''; return; }
  el.textContent = msg; el.classList.add('on');
  clearTimeout(showErr._t);
  showErr._t = setTimeout(()=>el.classList.remove('on'), 6000);
}

// 面板复用 apiduo 的登录态：用 refresh cookie 换 access token。
//
// 为什么不直接靠 cookie：apiduo 的管理 API 要的是 Authorization: Bearer <JWT>，
// cookie 只在 /api/user/auth 路径上有效。浏览器同源访问本页时 refresh cookie 会自动带上，
// 换一次 token 后所有请求显式带 Bearer —— 这样面板不需要知道前端把 token 存在哪。

// 同一时刻只允许一个刷新在飞。
//
// api() 在每个 401 上都会调这里，而 selectProfile() 一次并发发
// observations / audit / rules 三个请求：access token（实测 20 分钟）一过期
// 就是 3 个 401 同时打 refresh。refresh 与登录、agent 握手共用同一个
// CriticalRateLimit 计数器（30 次 / 1800s），并发刷新会顺带烧掉用户自己的
// 登录额度，症状是「面板开久了，重新登录被 429」。
let authInFlight = null;
// 刷新失败的原因要留给人看：限流（429）和「真的没登录」是两回事，
// 前者让用户去重新登录只会撞上同一个计数器，越试越久。
let authFailure = '';
function bootstrapAuth(){
  if(!authInFlight){
    authInFlight = (async () => {
      try{
        const r = await fetch('/api/user/auth/refresh', {method:'POST', credentials:'same-origin'});
        if(r.status === 429){
          authFailure = '操作过于频繁，登录态刷新被限流；请等几分钟再试，别立刻重新登录（会撞同一个计数器）。';
          return false;
        }
        const j = await r.json();
        if(j && j.success && j.data && j.data.access_token){
          authToken = j.data.access_token;
          return true;
        }
      }catch(e){ /* 落到下面统一提示 */ }
      return false;
    })().finally(() => { authInFlight = null; });
  }
  return authInFlight;
}

async function api(path, opt){
  const headers = {'Content-Type':'application/json'};
  if(authToken) headers['Authorization'] = 'Bearer ' + authToken;
  const res = await fetch(path, Object.assign({
    headers: headers,
    credentials: 'same-origin',
  }, opt || {}));
  if(res.status === 429){
    throw new Error('操作过于频繁（已触发限流），请等几分钟再重试');
  }
  if(res.status === 401){
    // token 过期就再换一次，避免面板开久了所有操作都失败
    if(await bootstrapAuth()){
      headers['Authorization'] = 'Bearer ' + authToken;
      const retry = await fetch(path, Object.assign({headers: headers, credentials: 'same-origin'}, opt || {}));
      const body = await retry.json();
      if(!body.success) throw new Error(body.message || '请求失败');
      return body.data;
    }
    throw new Error('登录已过期，请先在 apiduo 重新登录');
  }
  let body;
  try { body = await res.json(); } catch(e){ throw new Error('响应不是 JSON（HTTP '+res.status+'）'); }
  if(!body.success) throw new Error(body.message || ('请求失败 HTTP '+res.status));
  return body.data;
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ── 概览与列表 ─────────────────────────────── */

async function loadOverview(){
  try{
    const d = await api('/api/mcp/overview');
    const kinds = Object.entries(d.kinds || {}).map(([k,v])=>k+' '+v).join(' · ');
    // 没有声明时 kinds 为空串，直接拼会得到「已启用 0 ·  · 日志库」这种空段。
    const parts = [`${d.profiles} 个模型`, `已启用 ${d.enabled}`];
    if(kinds) parts.push(kinds);
    parts.push(`日志库 ${d.log_db}`);
    $('summary').textContent = parts.join(' · ');
  }catch(e){ $('summary').textContent = '概览读取失败'; }
}

async function loadProfiles(keep){
  try{
    const d = await api('/api/mcp/profiles');
    profiles = d.items || [];
    renderList();
    if(keep && current){
      const again = profiles.find(p => p.id === current.id);
      if(again) selectProfile(again.id, true);
    }
  }catch(e){
    $('plist').innerHTML = '<div class="empty">读取失败</div>';
    showErr(e.message);
  }
}

function renderList(){
  const kw = ($('search').value || '').trim().toLowerCase();
  const rows = profiles.filter(p => !kw || p.model_id.toLowerCase().includes(kw));
  if(!rows.length){
    $('plist').innerHTML = '<div class="empty">没有匹配的模型</div>';
    return;
  }
  $('plist').innerHTML = rows.map(p => `
    <div class="item ${current && current.id===p.id?'on':''}" data-id="${p.id}">
      <div class="item-main">
        <div class="item-name">${esc(p.model_id)}</div>
        <div class="item-meta">${esc(p.kind)} · ${p.async?'异步':'同步'} · ${esc(p.source||'manual')}</div>
      </div>
      ${p.enabled?'':'<div class="badge">停用</div>'}
    </div>`).join('');
  $('plist').querySelectorAll('.item').forEach(el=>{
    el.onclick = ()=> selectProfile(Number(el.dataset.id));
  });
}

/* ── 详情 ───────────────────────────────────── */

async function selectProfile(id, silent){
  if(dirty && !silent && !confirm('当前修改未保存，确定切换？')) return;
  try{
    const p = await api('/api/mcp/profiles/'+id);
    current = p; dirty = false;
    renderList();
    renderDetail(p);
    loadObservations(id);
    loadAudit(id);
    loadRules(p.model_id);
  }catch(e){ showErr(e.message); }
}

function triState(name, val){
  const mode = val === null || val === undefined ? 'unset' : (val === 0 ? 'zero' : 'n');
  return `<div class="grid-2" style="gap:6px">
    <select onchange="onTri('${name}',this.value)">
      <option value="unset" ${mode==='unset'?'selected':''}>未声明</option>
      <option value="zero" ${mode==='zero'?'selected':''}>不支持</option>
      <option value="n" ${mode==='n'?'selected':''}>上限</option>
    </select>
    <input type="number" min="1" id="f-${name}-n" value="${mode==='n'?val:''}"
      ${mode==='n'?'':'disabled'} oninput="markDirty()">
  </div>`;
}

window.onTri = function(name, mode){
  const inp = $('f-'+name+'-n');
  inp.disabled = mode !== 'n';
  if(mode === 'n' && !inp.value) inp.value = 1;
  markDirty();
};
window.markDirty = function(){ dirty = true; };

function renderDetail(p){
  const isNew = !p.id;
  $('detail').innerHTML = `
  <div class="card">
    <div class="card-title">
      <h2>${isNew?'新建模型':esc(p.model_id)}</h2>
      <div class="actions">
        ${isNew?'':'<button class="tiny" onclick="toggleProfile()">'+(p.enabled?'停用':'启用')+'</button>'}
        ${isNew?'':'<button class="tiny" onclick="delProfile()">删除</button>'}
        <button class="tiny primary" onclick="saveProfile()">保存</button>
      </div>
    </div>

    <div class="hint" style="margin-bottom:7px">基础 · 3 项必填，其余留空即不拦截</div>
    <div class="grid-3">
      <div class="field"><label>模型 ID</label>
        <input id="f-model_id" value="${esc(p.model_id)}" ${isNew?'':'readonly'} oninput="markDirty()">
      </div>
      <div class="field"><label>产物类型</label>
        <select id="f-kind" onchange="onKind()">
          <option value="image" ${p.kind==='image'?'selected':''}>图片</option>
          <option value="video" ${p.kind==='video'?'selected':''}>视频</option>
          <option value="search" ${p.kind==='search'?'selected':''}>搜索</option>
        </select>
      </div>
      <div class="field"><label>协议</label>
        <select id="f-protocol">
          <option value="openai_image" ${p.protocol==='openai_image'?'selected':''}>openai_image</option>
          <option value="openai_video" ${p.protocol==='openai_video'?'selected':''}>openai_video</option>
        </select>
      </div>
    </div>
    <div class="grid-2" style="margin-top:8px">
      <div class="field"><label>执行方式</label>
        <select id="f-async">
          <option value="false" ${!p.async?'selected':''}>同步直返</option>
          <option value="true" ${p.async?'selected':''}>异步任务 · task.get</option>
        </select>
      </div>
      <div class="field"><label>显示名（可选）</label>
        <input id="f-display_name" value="${esc(p.display_name)}" oninput="markDirty()">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title"><h2>输入限制</h2><span class="hint">未声明 ≠ 0，别把图生图模型锁死</span></div>
    <div class="grid-3">
      <div class="field"><label>参考图上限</label>${triState('max_ref_images', p.max_ref_images)}</div>
      <div class="field"><label>参考视频上限</label>${triState('max_ref_videos', p.max_ref_videos)}</div>
      <div class="field"><label>提示词上限</label>
        <input type="number" min="1" id="f-max_prompt_chars" value="${p.max_prompt_chars ?? ''}" oninput="markDirty()">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title"><h2>参数约束</h2><span class="hint">JSON：{"size":{"enum":["1K","2K"],"default":"2K"}}</span></div>
    <textarea id="f-parameters" oninput="markDirty()">${esc(p.parameters)}</textarea>
  </div>

  <div class="card">
    <div class="card-title"><h2>能力描述</h2><span class="hint">进 tools/list 与 models.list</span></div>
    <div class="grid-2">
      <div class="field"><label>一句话</label>
        <input id="f-summary" value="${esc(p.summary)}" oninput="markDirty()">
      </div>
      <div class="field"><label>标签（逗号分隔）</label>
        <input id="f-tags" value="${esc(p.tags)}" oninput="markDirty()">
      </div>
    </div>
  </div>`;
}

window.onKind = function(){
  const kind = $('f-kind').value;
  $('f-protocol').value = kind === 'video' ? 'openai_video' : 'openai_image';
  markDirty();
};

function collect(){
  function tri(name){
    const mode = document.querySelector(`select[onchange="onTri('${name}',this.value)"]`).value;
    if(mode === 'unset') return null;
    if(mode === 'zero') return 0;
    const n = Number($('f-'+name+'-n').value);
    return Number.isFinite(n) && n > 0 ? n : null;
  }
  return {
    model_id: $('f-model_id').value.trim(),
    display_name: $('f-display_name').value.trim(),
    kind: $('f-kind').value,
    protocol: $('f-protocol').value,
    async: $('f-async').value === 'true',
    // enabled 不是这个表单的字段，但 PUT 是全量语义：漏了它，后端会按零值处理，
    // 保存一次显示名就把模型停用了 —— 界面上还显示「保存成功」。
    enabled: current && typeof current.enabled === 'boolean' ? current.enabled : true,
    max_ref_images: tri('max_ref_images'),
    max_ref_videos: tri('max_ref_videos'),
    max_prompt_chars: $('f-max_prompt_chars').value ? Number($('f-max_prompt_chars').value) : null,
    parameters: $('f-parameters').value.trim(),
    summary: $('f-summary').value.trim(),
    tags: $('f-tags').value.trim(),
  };
}

window.saveProfile = async function(){
  const body = collect();
  if(!body.model_id){ showErr('模型 ID 不能为空'); return; }
  if(body.parameters){
    try{ JSON.parse(body.parameters); }
    catch(e){ showErr('参数约束不是合法 JSON: '+e.message); return; }
  }
  try{
    const isNew = !current || !current.id;
    const d = isNew
      ? await api('/api/mcp/profiles', {method:'POST', body: JSON.stringify(body)})
      : await api('/api/mcp/profiles/'+current.id, {method:'PUT', body: JSON.stringify(body)});
    current = d; dirty = false;
    await loadProfiles();
    await selectProfile(d.id, true);
    loadOverview();
    showErr('');
  }catch(e){ showErr(e.message); }
};

window.toggleProfile = async function(){
  try{
    const d = await api('/api/mcp/profiles/'+current.id+'/toggle',
      {method:'POST', body: JSON.stringify({enabled: !current.enabled})});
    current = d; await loadProfiles(); await selectProfile(d.id, true); loadOverview();
  }catch(e){ showErr(e.message); }
};

window.delProfile = async function(){
  if(!confirm('删除后该模型的能力声明会消失，agent 将失去参数约束。确定删除？')) return;
  try{
    await api('/api/mcp/profiles/'+current.id, {method:'DELETE'});
    current = null; dirty = false;
    $('detail').innerHTML = '<div class="card"><div class="empty">已删除。从左侧选一个模型，或点「新建模型」</div></div>';
    await loadProfiles(); loadOverview();
  }catch(e){ showErr(e.message); }
};

/* ── 错误规则 ───────────────────────────────── */

async function loadRules(modelId){
  try{
    const d = await api('/api/mcp/error-rules' + (modelId ? '?model_id='+encodeURIComponent(modelId) : ''));
    const all = d.items || [];
    const g = all.filter(r => r.scope === 'global');
    const m = all.filter(r => r.scope === 'model');
    $('rules-global').innerHTML = ruleTable(g);
    $('rules-model').innerHTML = m.length ? ruleTable(m) : '<div class="empty">该模型没有覆盖规则，使用全局默认</div>';
    bindRules();
  }catch(e){
    $('rules-global').innerHTML = '<div class="empty">读取失败</div>';
  }
}

function ruleTable(rows){
  if(!rows.length) return '<div class="empty">暂无规则</div>';
  return `<table><thead><tr>
    <th style="width:190px">匹配</th><th style="width:70px">可重试</th>
    <th style="width:92px">动作</th><th>给 agent 的话</th><th style="width:52px"></th>
  </tr></thead><tbody>${rows.map(r=>`
    <tr data-rid="${r.id}">
      <td class="mono">${esc(r.match)}</td>
      <td><select data-f="retryable" style="font-size:11px">
        <option value="1" ${r.retryable?'selected':''}>是</option>
        <option value="0" ${!r.retryable?'selected':''}>否</option>
      </select></td>
      <td><select data-f="retry_action" style="font-size:11px">
        ${[['change_param','改参数'],['change_prompt','改提示词'],['wait','等待'],['none','停止']].map(([v,label])=>
          `<option value="${v}" ${r.retry_action===v?'selected':''}>${label}</option>`).join('')}
      </select></td>
      <td><input data-f="hint" value="${esc(r.hint)}" style="font-size:11px"></td>
      <td><button class="tiny" data-save="${r.id}">存</button></td>
    </tr>`).join('')}</tbody></table>`;
}

function bindRules(){
  document.querySelectorAll('button[data-save]').forEach(btn=>{
    btn.onclick = async ()=>{
      const tr = btn.closest('tr');
      const id = Number(btn.dataset.save);
      const body = {
        retryable: tr.querySelector('[data-f=retryable]').value === '1',
        retry_action: tr.querySelector('[data-f=retry_action]').value,
        retry_after_ms: 0,
        hint: tr.querySelector('[data-f=hint]').value,
        enabled: true,
      };
      try{
        await api('/api/mcp/error-rules/'+id, {method:'PUT', body: JSON.stringify(body)});
        btn.textContent = '已存'; setTimeout(()=>btn.textContent='存', 1200);
      }catch(e){ showErr(e.message); }
    };
  });
}

/* ── 观察 ───────────────────────────────────── */

async function loadObservations(id){
  $('obs-body').innerHTML = '<div class="empty">查询中…</div>';
  try{
    const d = await api('/api/mcp/profiles/'+id+'/observations?days=7');
    $('obs-hint').textContent = `${d.model_id} · 近 ${d.days} 天 ${d.total} 次样本`;
    if(!d.stats.length){
      $('obs-body').innerHTML = '<div class="empty">还没有样本。参数快照写入日志后这里会出现分布。</div>';
      return;
    }
    const byParam = {};
    d.stats.forEach(s => (byParam[s.param] = byParam[s.param] || []).push(s));
    $('obs-body').innerHTML = Object.entries(byParam).map(([param, rows])=>{
      const max = Math.max(...rows.map(r=>r.ok + r.fail), 1);
      return `<div style="margin-bottom:14px">
        <div style="font-size:11.5px;font-weight:500;margin-bottom:4px">${esc(param)}</div>
        ${rows.map(r=>{
          const okW = r.ok / max * 100, badW = r.fail / max * 100;
          return `<div class="dist">
            <div class="mono">${esc(r.value)}</div>
            <div class="track">
              <div class="fill-ok" style="width:${okW}%"></div>
              <div class="fill-bad" style="width:${badW}%"></div>
            </div>
            <div class="dist-v">${r.ok} 成功${r.fail?' · '+r.fail+' 被拒':''}</div>
          </div>`;
        }).join('')}
      </div>`;
    }).join('');
  }catch(e){
    $('obs-body').innerHTML = '<div class="empty">查询失败：'+esc(e.message)+'</div>';
  }
}

/* ── 巡检 ───────────────────────────────────── */

async function loadAudit(id){
  $('audit-body').innerHTML = '<div class="empty">运行中…</div>';
  try{
    const d = await api('/api/mcp/profiles/'+id+'/audit?days=7');
    if(!d.issues.length){
      $('audit-body').innerHTML = '<div class="empty">没有发现需要处理的不一致</div>';
      return;
    }
    const order = {conflict:0, pending:1, unprobed:2, ok:3};
    const rows = d.issues.sort((a,b)=>(order[a.level]??9)-(order[b.level]??9));
    const chip = lv => lv==='conflict' ? '<span class="chip bad">冲突</span>'
      : lv==='pending' ? '<span class="chip warn">待确认</span>'
      : lv==='unprobed' ? '<span class="chip warn">待验证</span>'
      : '<span class="chip ok">一致</span>';
    $('audit-body').innerHTML = rows.map(i=>`
      <div class="check-row">
        <div><div class="check-name">${esc(i.title)}</div>
          <div class="check-obj">${esc(i.object)}</div></div>
        <div class="sub" style="font-size:10.5px;color:var(--text-2)">${esc(i.detail)}</div>
        <div class="check-res">${chip(i.level)}</div>
      </div>`).join('');
  }catch(e){
    $('audit-body').innerHTML = '<div class="empty">巡检失败：'+esc(e.message)+'</div>';
  }
}

/* ── 事件绑定 ───────────────────────────────── */

document.querySelectorAll('nav button').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b===btn));
    document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on', p.id===btn.dataset.tab));
  };
});

$('search').oninput = renderList;
$('btn-refresh').onclick = ()=>{ loadOverview(); loadProfiles(true); if(current) loadObservations(current.id); };
$('btn-audit').onclick = ()=>{ if(current) loadAudit(current.id); };
$('btn-new').onclick = ()=>{
  if(dirty && !confirm('当前修改未保存，确定新建？')) return;
  current = {id:0, model_id:'', display_name:'', kind:'image', protocol:'openai_image',
    async:false, enabled:true, max_ref_images:null, max_ref_videos:null,
    max_prompt_chars:null, parameters:'', summary:'', tags:'', source:'manual'};
  dirty = false;
  renderList();
  renderDetail(current);
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on', p.id==='models'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.tab==='models'));
  $('f-model_id').focus();
};

window.addEventListener('beforeunload', e=>{
  if(dirty){ e.preventDefault(); e.returnValue=''; }
});

(async function boot(){
  if(EMBED){
    const host = await hostToken(1500);
    if(host){
      authToken = host;
      loadOverview();
      loadProfiles();
      loadRules('');
      return;
    }
  }
  const ok = await bootstrapAuth();
  if(!ok){
    $('summary').textContent = '未登录';
    showErr(authFailure || '未登录：请先在 apiduo 登录，再打开这个页面');
    return;
  }
  loadOverview();
  loadProfiles();
  loadRules('');
})();
</script>
