# langfuse.apiduo.cn —— Langfuse 4.80.0 反向代理
# 上游：127.0.0.1:3100（langfuse-web 容器）
# 注意：不要加 default_server —— core-1 的 443 隐式兜底是 aapi.cn.conf
#
# 2026-11-14 优化：上游 keepalive、静态资源长缓存、代理响应 gzip、HSTS

upstream langfuse_upstream {
    server 127.0.0.1:3100;
    keepalive 32;
    keepalive_timeout 30s;
    keepalive_requests 1000;
}

# 只有真正的 WebSocket 才发 Connection: upgrade，其余发空串以复用上游连接
map $http_upgrade $lf_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name langfuse.apiduo.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/langfuse;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name langfuse.apiduo.cn;

    ssl_certificate     /www/server/panel/vhost/cert/langfuse.apiduo.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/langfuse.apiduo.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:langfuse_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /www/wwwlogs/langfuse.apiduo.cn.log;
    error_log  /www/wwwlogs/langfuse.apiduo.cn.error.log;

    client_max_body_size 100m;

    # Next.js 产物是内容哈希命名的，可以长缓存
    location ^~ /_next/static/ {
        proxy_pass http://langfuse_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Connection        "";
        proxy_buffering on;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # OTLP 摄入：大 body、保持不缓冲
    location ^~ /api/public/otel/ {
        proxy_pass http://langfuse_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering    off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass http://langfuse_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $lf_connection_upgrade;

        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }
}
