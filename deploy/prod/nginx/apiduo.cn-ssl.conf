# apiduo.cn HTTPS 入口（裸域单域：控制台与 /api /v1 同源）
# 证书：acme.sh（Let's Encrypt），HTTP-01 webroot，自动续期并 reload nginx。
#
# ⚠️ 本文件被 nginx 在 http 块内 include ⇒ limit_req_zone 可写在 server 之外。
#    zone 名 / ssl_session_cache 名都必须带 _cn 后缀：nginx 的共享内存区名是全局的，
#    与旧站 apiduo.1task.cn 的 apiduo_api / APIDUO_TLS 重名会直接 nginx -t 失败。
limit_req_zone $binary_remote_addr zone=apiduo_cn_api:10m rate=600r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name apiduo.cn;

    ssl_certificate     /www/server/panel/vhost/cert/apiduo.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/apiduo.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_session_cache   shared:APIDUO_CN_TLS:10m;
    ssl_session_timeout 10m;

    access_log /www/wwwlogs/apiduo.cn.log;
    error_log  /www/wwwlogs/apiduo.cn.error.log;

    auth_basic off;                   # 鉴权交给服务自己（会话 + API Key）

    include /www/server/panel/vhost/nginx/apiduo-cn-headers.inc;

    # 私有实例默认禁抓。若将来要对客 SEO，删掉本段与 headers 里的 X-Robots-Tag。
    location = /robots.txt {
        access_log off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # 文件名带内容 hash ⇒ 一年 immutable；单独开 location 也让静态资源保持缓冲
    # （下面 location / 为 SSE 关了 proxy_buffering）。
    location /static/ {
        include /www/server/panel/vhost/nginx/apiduo-cn-proxy.inc;
        proxy_buffering on;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # add_header 一出现就脱离父块，安全头必须在这里重来一遍。
        include /www/server/panel/vhost/nginx/apiduo-cn-headers.inc;
    }

    location / {
        limit_req zone=apiduo_cn_api burst=120 nodelay;
        limit_req_status 429;
        include /www/server/panel/vhost/nginx/apiduo-cn-proxy.inc;
        # SSE / 长轮询不能缓冲，否则前端收不到增量。
        proxy_buffering off;
    }
}
