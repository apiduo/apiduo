<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>商品管理 · 商家后台</title>
<link rel="stylesheet" href="assets/app.css">
<style>
.filters{display:flex;gap:9px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filters .input{width:220px;height:34px}
.filters .select{height:34px}
.filters .sp{margin-left:auto}
.margin-pos{color:oklch(0.45 0.12 163);font-weight:500}
.margin-neg{color:var(--destructive);font-weight:500}
.acts{display:flex;gap:6px;justify-content:flex-end}
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="index.html"><span class="brand-mark">A</span>apiduo</a>
  <nav class="switcher">
    <a href="api-platform.html">API 平台</a>
    <a href="index.html" class="on">卡密商城</a>
  </nav>
  <div class="topright">
    <span class="badge info">商家后台</span>
    <div class="avatar">帅</div>
  </div>
</div>

<div class="shell">
  <aside class="side">
    <div>
      <div class="side-title">商城管理</div>
      <a class="side-item" href="admin-goods.html"><span>概览</span></a>
      <div class="side-item on"><span>商品</span></div>
      <a class="side-item" href="admin-stock.html"><span>卡密库存</span></a>
      <a class="side-item" href="admin-orders.html"><span>订单</span></a>
      <div class="side-item"><span>供应商</span></div>
      <div class="side-item"><span>售后工单</span></div>
    </div>
    <div>
      <div class="side-title">返回</div>
      <a class="side-item" href="index.html"><span>回到商城前台</span></a>
    </div>
  </aside>

  <main class="main">
    <div class="page-head-row">
      <div>
        <h1>商品管理</h1>
        <p>成本价与毛利率仅后台可见，任何对前台的接口都不会返回这两个字段</p>
      </div>
      <button class="btn blue" onclick="alert('新建商品（原型未实现）')">新建商品</button>
    </div>

    <div class="stats">
      <div class="stat"><div class="k">在售商品</div><div class="v">7 <small>个</small></div></div>
      <div class="stat"><div class="k">可用库存</div><div class="v">419 <small>张</small></div></div>
      <div class="stat"><div class="k">今日订单</div><div class="v">38 <small>单</small></div></div>
      <div class="stat"><div class="k">今日毛利</div><div class="v">¥1,846</div></div>
    </div>

    <div class="filters">
      <input class="input" placeholder="搜索商品名称…">
      <select class="select">
        <option>全部分类</option><option>AI 会员</option><option>AI 工具</option><option>成品号</option><option>算力额度</option>
      </select>
      <select class="select">
        <option>全部状态</option><option>已上架</option><option>已下架</option>
      </select>
      <span class="sp"></span>
      <span style="font-size:12.5px;color:var(--muted-fg)">共 8 条</span>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>商品</th><th>分类</th><th class="ta-r">售价</th><th class="ta-r">成本</th><th class="ta-r">毛利率</th>
            <th class="ta-r">可用库存</th><th>交付</th><th>状态</th><th class="ta-r">操作</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="assets/data.js"></script>
<script>
const deliveryMap = { auto: '自动发卡', manual: '人工发货', fixed: '固定内容' };
const deliveryCls = { auto: 'ok', manual: 'warn', fixed: 'info' };

document.getElementById('tbody').innerHTML = GOODS.map(g => {
  const margin = (g.price - g.cost) / g.price * 100;
  const on = g.stockNum > 0;
  return `
  <tr>
    <td><div style="font-weight:500">${g.name}</div><div class="sub">${g.spec}</div></td>
    <td>${g.cat}</td>
    <td class="ta-r num">¥${g.price}</td>
    <td class="ta-r num" style="color:var(--muted-fg)">¥${g.cost}</td>
    <td class="ta-r num ${margin >= 25 ? 'margin-pos' : 'margin-neg'}">${margin.toFixed(1)}%</td>
    <td class="ta-r num">${g.stockNum === 0 ? '<span class="badge err">0</span>' : (g.stockNum <= 5 ? `<span class="badge warn">${g.stockNum}</span>` : g.stockNum)}</td>
    <td><span class="badge ${deliveryCls[g.delivery]}">${deliveryMap[g.delivery]}</span></td>
    <td><span class="badge ${on ? 'ok' : 'gray'}">${on ? '已上架' : '已下架'}</span></td>
    <td>
      <div class="acts">
        <a class="btn sm" href="admin-stock.html">库存</a>
        <button class="btn sm" onclick="alert('编辑商品（原型未实现）')">编辑</button>
      </div>
    </td>
  </tr>`;
}).join('');
</script>
</body>
</html>
