<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>确认订单 · 卡密商城</title>
<link rel="stylesheet" href="assets/app.css">
<style>
.pay-wrap{max-width:520px;margin:0 auto;padding:8px 0 40px}
.pay-card{border:1px solid var(--border);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow)}
.pay-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
.pay-head h3{margin:0;font-size:17px;font-weight:500}
.pay-head .sub{font-size:12.5px;color:var(--muted-fg);margin-top:3px}
.timer{text-align:right}
.timer b{display:block;font-size:19px;font-weight:500;color:var(--warning);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.timer span{font-size:11.5px;color:var(--muted-fg)}
.pay-line{display:flex;justify-content:space-between;gap:16px;padding:9px 0;font-size:13.5px;border-bottom:1px solid var(--border)}
.pay-line:last-of-type{border-bottom:none}
.pay-line .k{color:var(--muted-fg);flex:none}
.pay-total{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 20px;margin-top:6px;border-top:1px solid var(--border)}
.pay-total .k{font-size:13.5px;color:var(--muted-fg)}
.pay-total .v{font-size:26px;font-weight:500;letter-spacing:-.02em}
.pay-total .v i{font-style:normal;font-size:15px;font-weight:400;margin-right:2px}
.pays{display:grid;gap:9px;margin-bottom:16px}
.paybtn{display:flex;align-items:center;gap:11px;height:46px;padding:0 15px;border:1px solid var(--border);border-radius:11px;font-size:13.5px;background:#fff;text-align:left;width:100%;transition:all .15s}
.paybtn:hover{border-color:var(--border-strong);background:var(--muted-2)}
.paybtn .dot{width:16px;height:16px;border-radius:4px;flex:none}
.paybtn .arrow{margin-left:auto;color:var(--muted-fg);font-size:15px}
.pay-note{margin:16px 0 0;text-align:center;font-size:12px;color:var(--muted-fg);line-height:1.7}
.lock-hint{display:flex;align-items:center;gap:7px;justify-content:center;margin-top:14px;font-size:12px;color:oklch(0.42 0.1 163);background:oklch(0.975 0.022 163);padding:8px 12px;border-radius:9px}
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="index.html"><span class="brand-mark">A</span>apiduo</a>
  <nav class="switcher">
    <a href="api-platform.html">API 平台</a>
    <a href="index.html" class="on">卡密商城</a>
  </nav>
  <div class="topright">
    <span class="num">¥ 128.40</span>
    <div class="avatar">帅</div>
  </div>
</div>

<div class="shell">
  <aside class="side">
    <div>
      <div class="side-title">商品分类</div>
      <div class="side-item on"><span>全部商品</span></div>
      <div class="side-item"><span>AI 会员</span></div>
      <div class="side-item"><span>AI 工具</span></div>
      <div class="side-item"><span>成品号</span></div>
      <div class="side-item"><span>算力额度</span></div>
      <div class="side-item"><span>资料</span></div>
    </div>
    <div>
      <div class="side-title">我的</div>
      <a class="side-item" href="my-cards.html"><span>我的卡密</span></a>
      <a class="side-item" href="my-cards.html"><span>我的订单</span></a>
      <a class="side-item" href="my-cards.html"><span>售后工单</span></a>
    </div>
    <div>
      <div class="side-title">管理</div>
      <a class="side-item" href="admin-goods.html"><span>商家后台</span></a>
    </div>
  </aside>

  <main class="main">
    <div class="pay-wrap">
      <a class="btn sm" href="javascript:history.back()" style="margin-bottom:16px">← 返回商品</a>

      <div class="pay-card">
        <div class="pay-head">
          <div>
            <h3>确认订单</h3>
            <div class="sub" id="orderno">订单号 —</div>
          </div>
          <div class="timer">
            <b id="timer">15:00</b>
            <span>支付剩余时间</span>
          </div>
        </div>

        <div class="pay-line"><span class="k">商品</span><span id="pname" style="text-align:right">—</span></div>
        <div class="pay-line"><span class="k">单价 × 数量</span><span class="num" id="punit">—</span></div>
        <div class="pay-line"><span class="k">质保</span><span id="pwarranty">—</span></div>
        <div class="pay-line"><span class="k">发货方式</span><span id="pdeliver">—</span></div>

        <div class="pay-total">
          <span class="k">应付金额</span>
          <span class="v"><i>¥</i><span id="ptotal">0.00</span></span>
        </div>

        <div class="pays">
          <button class="paybtn" onclick="paid('支付宝')">
            <span class="dot" style="background:#1677ff"></span>支付宝
            <span class="arrow">›</span>
          </button>
          <button class="paybtn" onclick="paid('微信支付')">
            <span class="dot" style="background:#07c160"></span>微信支付
            <span class="arrow">›</span>
          </button>
        </div>

        <div class="lock-hint">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
            <rect x="3.2" y="7" width="9.6" height="6.4" rx="1.6" stroke="currentColor" stroke-width="1.2"/>
            <path d="M5.6 7V5.4a2.4 2.4 0 0 1 4.8 0V7" stroke="currentColor" stroke-width="1.2"/>
          </svg>
          <span id="locktext">库存已为你保留 15:00</span>
        </div>

        <p class="pay-note">本 Demo 点击支付即视为成功，不产生真实交易。<br>订单关闭后所占库存将自动释放。</p>
      </div>
    </div>
  </main>
</div>

<script src="assets/data.js"></script>
<script>
const qs = new URLSearchParams(location.search);
const g = GOODS.find(x => x.id === Number(qs.get('id') || 1)) || GOODS[0];
const qty = Math.min(3, Math.max(1, Number(qs.get('qty') || 1)));
const total = g.price * qty;

const no = 'CARD1001NO' + Date.now().toString().slice(-10) + Math.floor(Math.random() * 90 + 10);
const warrantyText = g.warranty >= 168 ? '7 天' : (g.warranty >= 72 ? '3 天' : (g.warranty >= 24 ? '24 小时' : '不保'));

document.getElementById('orderno').textContent = '订单号 ' + no;
document.getElementById('pname').textContent = g.name + ' · ' + g.spec.split(' · ')[0];
document.getElementById('punit').textContent = `¥${g.price} × ${qty}`;
document.getElementById('pwarranty').textContent = warrantyText;
document.getElementById('pdeliver').textContent = g.delivery === 'auto' ? '自动发卡' : (g.delivery === 'manual' ? '人工发货（需审核）' : '固定内容');
document.getElementById('ptotal').textContent = total.toFixed(2);

let left = 15 * 60;
const tEl = document.getElementById('timer');
const lEl = document.getElementById('locktext');
const tick = () => {
  const m = String(Math.floor(left / 60)).padStart(2, '0');
  const s = String(left % 60).padStart(2, '0');
  tEl.textContent = `${m}:${s}`;
  lEl.textContent = `库存已为你保留 ${m}:${s}`;
  if (left <= 0) {
    clearInterval(timerId);
    tEl.textContent = '已关闭';
    tEl.style.color = 'var(--muted-fg)';
    lEl.textContent = '订单已关闭，库存已释放';
    document.querySelectorAll('.paybtn').forEach(b => b.disabled = true);
    return;
  }
  left--;
};
tick();
const timerId = setInterval(tick, 1000);

function paid(method){
  sessionStorage.setItem('card_order', JSON.stringify({
    no, goodsId: g.id, qty, total, method, warranty: warrantyText, name: g.name, spec: g.spec
  }));
  location.href = 'deliver.html';
}
</script>
</body>
</html>
