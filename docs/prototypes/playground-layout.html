        </radialGradient>
        <linearGradient id="shine${g}" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity=".92"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <filter id="soft${g}"><feGaussianBlur stdDeviation="10"/></filter>
      </defs>
      <rect width="400" height="400" fill="url(#bg${g})"/>
      <rect x="0" y="252" width="400" height="148" fill="#d9cbb4"/>
      <ellipse cx="200" cy="300" rx="104" ry="20" fill="#0f172a" opacity=".18" filter="url(#soft${g})"/>
      <circle cx="200" cy="196" r="96" fill="url(#glass${g})"/>
      <ellipse cx="168" cy="156" rx="34" ry="24" fill="url(#shine${g})" transform="rotate(-24 168 156)"/>
      <path d="M200 100 a96 96 0 0 1 0 192" fill="#fde68a" opacity=".22"/>
      <circle cx="246" cy="238" r="13" fill="#fbbf24" opacity=".38" filter="url(#soft${g})"/>
      <path d="M296 92 l14 14 M303 92 l-14 14" stroke="#c9b998" stroke-width="1.6" opacity=".7"/>
    </svg>`;
  }

  function artMap(seed){
    const g = 'map' + seed;
    return `<svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="bg${g}" x1="0" y1="0" x2=".6" y2="1">
          <stop offset="0" stop-color="#f5ecd8"/><stop offset="1" stop-color="#e9dcc0"/>
        </linearGradient>
      </defs>
      <rect width="400" height="400" fill="url(#bg${g})"/>
      <g stroke="#b9a684" stroke-width=".8" opacity=".5">
        <path d="M0 96h400M0 196h400M0 296h400"/>
        <path d="M96 0v400M196 0v400M296 0v400"/>
      </g>
      <path d="M-10 268 C 70 250, 96 210, 150 214 S 228 258, 282 232 352 176, 412 186"
            fill="none" stroke="#a98f63" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M-10 274 C 70 256, 96 216, 150 220 S 228 264, 282 238 352 182, 412 192"
            fill="none" stroke="#cbb894" stroke-width="1" stroke-linecap="round" opacity=".8"/>
      <path d="M132 -10 C 148 66, 122 118, 168 158 S 268 176, 276 240 248 330, 262 410"
            fill="none" stroke="#8fb3c9" stroke-width="1.8" stroke-linecap="round" opacity=".9"/>
      <g fill="none" stroke="#8b7550" stroke-width="1.3" stroke-linecap="round" opacity=".85">
        <path d="M60 128 l16-9 16 9v17l-16 9-16-9z"/>
        <path d="M232 302 l14-8 14 8v15l-14 8-14-8z"/>
        <path d="M300 96 l12-7 12 7v13l-12 7-12-7z"/>
      </g>
      <g fill="#a1462f">
        <circle cx="196" cy="188" r="4.2"/>
        <circle cx="196" cy="188" r="10" fill="none" stroke="#a1462f" stroke-width="1.1" opacity=".55"/>
        <circle cx="268" cy="252" r="3"/>
        <circle cx="104" cy="146" r="3"/>
      </g>
      <text x="204" y="180" font-family="Georgia,serif" font-size="13" fill="#7a4b33" opacity=".9">Port</text>
      <text x="118" y="140" font-family="Georgia,serif" font-size="11" fill="#7a4b33" opacity=".7">Inn</text>
      <g stroke="#b9a684" stroke-width="1" opacity=".7">
        <path d="M316 336 h44M338 314 v44"/>
      </g>
      <text x="306" y="372" font-family="Georgia,serif" font-size="10" fill="#8b7550" opacity=".75">N</text>
      <rect x="14" y="14" width="372" height="372" fill="none" stroke="#a98f63" stroke-width="1.4" opacity=".5"/>
    </svg>`;
  }

  const ART = [artIso, artOrb, artMap];
  let artSeed = 0;
  function makeArt(i){ return ART[i % ART.length](++artSeed); }

  /* ───────── rendering ───────── */

  function frameStyle(el, ar){ el.style.setProperty('--arn', ar); }

  function chatEmpty(){
    const div = document.createElement('div');
    div.className = 'chat-empty';
    div.innerHTML = `
      <div class="canvas-icon">${ICON.chat}</div>
      <div class="canvas-title">开始一段对话</div>
      <div class="canvas-sub">模型和参数就在下方，跟着这条消息一起走</div>`;
    return div;
  }

  function emptyCanvas(){
    const r = RATIOS[state.ratio];
    // The canvas is the second place the derived request kind shows up: with a
    // file attached, "描述你想要的画面" is the wrong instruction entirely.
    const has = state.refs.length > 0;
    const copy = {
      image: has
        ? { title:'说说要怎么改', sub:`${state.refs.length} 张参考已就位，写下你想要的改动`, icon:ICON.image }
        : { title:'描述你想要的画面', sub:'选好比例，写下画面，按 <kbd>⏎</kbd> 生成', icon:ICON.image },
      chat: has
        ? { title:'就这张图提问', sub:'图已附上；换模型时能收下的会跟着走', icon:ICON.chat }
        : { title:'开始一段对话', sub:'模型和分组就在下方，跟着这条消息一起走', icon:ICON.chat },
      video: has
        ? { title:'描述镜头怎么动', sub:'参考已就位，写下运镜与动作', icon:ICON.video }
        : { title:'描述你想要的镜头', sub:'选好时长，写下镜头，按 <kbd>⏎</kbd> 生成', icon:ICON.video }
    }[state.mode];

    const div = document.createElement('div');
    div.className = 'frame canvas-empty';
    frameStyle(div, r.ar);
    div.innerHTML = `
      <div class="canvas-icon">${copy.icon}</div>
      <div class="canvas-title">${copy.title}</div>
      <div class="canvas-sub">${copy.sub}</div>
    `;
    return div;
  }

  /* ───────── jobs: concurrency ───────── */

  /* Concurrency is a property of the engine, not of the canvas. A submit
     becomes a job with its own lifecycle, and the stage is an append-only list
     keyed by job id. Two rules follow, and together they are the whole of
     "no jitter":
       1. a job reserves its final box at submit time — finishing swaps pixels
          inside a rectangle that never changed size;
       2. a job never moves in the list — a fast one finishing early does not
          shove the slow one it was queued behind. */
  const CONCURRENCY = { chat:1, image:3, video:2 };
  const QUEUE_MAX = 3;

  const jobsOf    = (m) => state.tasks.filter(t => t.mode === m);
  const runningOf = (m) => state.tasks.filter(t => t.mode === m && t.status === 'running');
  const queuedOf  = (m) => state.tasks.filter(t => t.mode === m && t.status === 'queued');
  const arOf = (key) => (RATIOS[key] || RATIOS['1:1']).ar;

  function jobMs(t){
    // Deterministic on purpose: the same request must produce the same
    // timeline, otherwise no screenshot of "3 running" is reproducible.
    let h = 7;
    const s = t.id + t.model + t.prompt;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 99991;
    const base = t.mode === 'video' ? 5200 : 1900;
    const span = t.mode === 'video' ? 2600 : 1600;
    return Math.round((base + h % span) * (t.count > 1 ? 1.3 : 1));
  }

  function startJob(t){
    t.status = 'running';
    t.startedAt = performance.now();
    ensureTick();
  }

  /* One pump, one clock. Per-job timers drift apart and each one wants its own
     render; that is how a page ends up rebuilding itself four times a second.
     A single 120ms tick is only allowed to touch numbers. */
  function pump(){
    ['image','video'].forEach(m => {
      let free = CONCURRENCY[m] - runningOf(m).length;
      queuedOf(m).forEach(t => { if (free-- > 0) startJob(t); });
    });
  }

  let tickTimer = 0;
  function ensureTick(){
    if (!tickTimer) tickTimer = setInterval(tick, 120);
  }
  function stopTick(){
    clearInterval(tickTimer);
    tickTimer = 0;
  }

  function tick(){
    let alive = false;
    state.tasks.forEach(t => {
      if (t.status !== 'running' || t.frozen) return;
      alive = true;
      t.prog = Math.min(1, (performance.now() - t.startedAt) / t.ms);
      if (t.el && t.el.isConnected) paintProgress(t);
      if (t.prog >= 1) finishJob(t);
    });
    if (!alive) stopTick();
  }

  /* The bar is a transform and the percentage sits in a tabular, fixed-width
     slot: a number that changes every 120ms must not change the width of the
     thing it lives in. */
  function paintProgress(t){
    const bar = t.el.querySelector('[data-bar]');
    if (bar) bar.style.transform = `scaleX(${t.prog.toFixed(3)})`;
    const pct = t.el.querySelector('[data-pct]');
    if (pct) pct.textContent = Math.round(t.prog * 100) + '%';
  }

  function finishJob(t){
    t.status = 'done';
    t.prog = 1;
    // Charged on arrival, not on submit: a queued or cancelled job that never
    // ran must not show up on the receipt.
    state.spend += t.cost;
    state.spendCount += 1;
    pump();          // the freed slot belongs to the queue immediately
    syncJobs();      // repaint the one card that changed, and nothing else
    setAmbient();    // the room takes the colour of the picture that just landed
    renderSpend();
  }

  function syncJobs(){
    state.tasks.forEach(t => {
      if (!t.el || !t.el.isConnected) return;
      paintJob(t.el, t);
      const ahead = t.el.querySelector('[data-ahead]');
      if (ahead) ahead.textContent = String(aheadCount(t));
    });
    updateConc();
  }

  function aheadCount(t){
    return runningOf(t.mode).length + Math.max(0, queuedOf(t.mode).indexOf(t));
  }

  /* Same three families the artwork generator uses, in the order it picks them. */
  const GLOW = ['oklch(0.70 0.120 192)', 'oklch(0.80 0.105 76)', 'oklch(0.70 0.065 58)'];

  function jobCard(t){
    const el = document.createElement('div');
    el.className = 'round';
    el.style.setProperty('--arn', arOf(t.ratio));
    el.style.setProperty('--glow', GLOW[jobSeed(t) % GLOW.length]);
    el.dataset.job = t.id;
    return el;
  }

  /* Repainting is keyed on status, not on time: while a job runs, the card is
     touched only by paintProgress. Re-rendering it would restart the shimmer
     and reload the artwork that had already landed. */
  function paintJob(el, t){
    if (el.dataset.paint === t.status) return;
    el.dataset.paint = t.status;
    el.innerHTML = jobMeta(t) + jobBody(t);
    t.el = el;
    el.querySelectorAll('[data-cancel]').forEach(b => { b.onclick = () => cancelJob(t); });
    el.querySelectorAll('[data-tool]').forEach(b => {
      b.onclick = () => runTool(t, +b.dataset.cell, b.dataset.tool);
    });
    el.querySelectorAll('[data-retry]').forEach(b => { b.onclick = () => retryJob(t); });
  }

  function jobMeta(t){
    const word = { queued:'排队中', running:'生成中', failed:'生成失败' }[t.status] || '';
    const px = t.mode === 'video' ? (t.vres || '1080p') : pxFor(t.ratio, t.res);
    const unit = t.mode === 'video' ? '条' : '张';
    const tail = (t.status === 'queued' || t.status === 'running')
      ? '<button class="meta-link" type="button" data-cancel>取消</button>'
      : t.status === 'failed'
        ? '<button class="meta-link danger" type="button" data-retry>重试</button>'
        : '<button class="meta-link" type="button">查看请求</button>';
    return `<div class="round-meta">
      <span class="mid">
        <span class="mono">${t.at}</span><span class="dot">·</span>
        ${word ? `<span class="st ${t.status}">${word}</span><span class="dot">·</span>` : ''}
        <span class="op">${t.op}</span><span class="dot">·</span>
        <span class="mono">${px}</span><span class="dot">·</span>
        <span>${t.count} ${unit}</span>
      </span>
      <span class="right">
        <span class="cost">${t.status === 'failed' ? '未计费' : money(t.cost)}</span>
        ${tail}
      </span>
    </div>`;
  }

  /* The inputs belong on the receipt: after a handful of turns nobody
     remembers which reference produced which frame. */
  function inputsHTML(t){
    if (!t.refs || !t.refs.length) return '';
    return `<div class="round-in">${t.refs.map(r =>
      `<div class="ref mini" title="${r.kind && r.kind !== 'image' ? '参考' + KIND_WORD[r.kind] : '参考图'}">${
        r.url ? `<img src="${r.url}" alt="">` : (r.art || makeArt(0))}</div>`).join('')}</div>`;
  }

  function jobBody(t){
    if (t.status === 'failed'){
      return `${inputsHTML(t)}<div class="failed" style="--arn:${arOf(t.ratio)}">
        <div class="failed-title">生成失败</div>
        <div class="failed-msg">上游返回 429，当前分组并发已满。这次不计费，重试会重新排队。</div>
        <button class="retry" type="button" data-retry>${ICON.retry}重试这一张</button>
      </div>`;
    }
    if (t.status === 'queued' || t.status === 'running') return inputsHTML(t) + placeholderHTML(t);
    return inputsHTML(t) + resultHTML(t);
  }

  function placeholderHTML(t){
    const queued = t.status === 'queued';
    // A frozen preset has no clock behind it, so its first paint has to carry
    // the progress it was seeded with instead of starting at zero.
    const prog = t.prog || 0;
    const cells = Array.from({ length: t.count }, () =>
      `<div class="ph-cell${queued ? ' queued' : ''}"><div class="shimmer"></div></div>`).join('');
    return `<div class="ph${t.count > 1 ? ' wide' : ''}">
      <div class="ph-cells ${t.count > 1 ? 'two' : 'one'}">${cells}</div>
      <div class="ph-float">
        <span class="ph-state">${queued
          ? `<span class="dot-q"></span>排队中 · 前面 <b data-ahead>${aheadCount(t)}</b> 个`
          : `<span class="ring"></span>生成中<b data-pct>${Math.round(prog * 100)}%</b>`}</span>
        ${queued ? '' : `<span class="pbar"><i data-bar style="transform:scaleX(${prog.toFixed(3)})"></i></span>`}
      </div>
    </div>`;
  }

  /* makeArt() is not a pure function — every call advances a global seed, so
     asking for "cell 2 of job t" twice returns two different pictures. That is
     fine while a card is painted once, and wrong the moment the same picture
     has to reappear somewhere else (a reference thumbnail, or the card being
     rebuilt after a mode switch). Memoise per job. */
  function jobSeed(t){ return parseInt(t.id.replace(/\D/g, ''), 10) || 0; }
  function jobArt(t, i){
    if (!t.art) t.art = [];
    return t.art[i] || (t.art[i] = makeArt(jobSeed(t) + i));
  }

  /* A finished picture is the input to the next one, so the card carries a
     shelf of tools rather than two corner buttons fighting for the same 32px.
     This table is the whole surface area of the shelf: `id` doubles as the icon
     key, `only` says which modes get it, `run` says what it does today. Adding
     去水印 / 变高清 / 抠图 / 扩图 later means flipping `run` on a row that is
     already placed, labelled and reachable — not redesigning the corner. */
  const TOOLS = [
    { id:'reuse',    label:'引用',     only:['image'], run:'reuse' },
    { id:'hd',       label:'变高清',   run:'soon' },
    { id:'water',    label:'去水印',   only:['image'], run:'soon' },
    { id:'cut',      label:'抠图',     only:['image'], run:'soon' },
    { id:'outpaint', label:'扩图',     only:['image'], run:'soon' },
    { id:'inpaint',  label:'局部重绘', only:['image'], run:'soon' },
    { id:'save',     label:'下载',     run:'save', end:1 }
  ];

  function toolsHTML(t, i){
    const list = TOOLS.filter(x => !x.only || x.only.includes(t.mode));
    const label = t.mode === 'video' ? '视频工具' : '图片工具';
    return `<div class="tools" role="toolbar" aria-label="${label}">${list.map((x, ti) => {
      // 引用 keeps its own class: its pressed state is read from outside the card
      // by syncReuse, and that lookup should not depend on the tool's position.
      const cls = 'tool' + (x.run === 'reuse' ? ' reuse' : '') + (x.end ? ' end' : '');
      const press = x.run === 'reuse'
        ? ` data-reuse="${i}" data-from="${t.id}:${i}" aria-pressed="false"` : '';
      return `<button class="${cls}" type="button" data-tool="${x.id}" data-cell="${i}"`
        + ` style="--ti:${ti}"`
        + ` data-label="${x.label}${x.run === 'soon' ? ' · 即将支持' : ''}"`
        + ` aria-label="${x.label}"${press}>${ICON[x.id]}</button>`;
    }).join('')}</div>`;
  }

  function resultHTML(t){
    const ar = arOf(t.ratio);
    const video = t.mode === 'video';
    const one = (i) => `<div class="art" style="--arn:${ar}">
      <div class="veil"></div>
      <div class="develop">${jobArt(t, i)}</div>
      <i class="land"></i>
      ${video ? `<div class="play">${ICON.play}</div><span class="len">${t.dur || '5s'}</span>` : ''}
      ${toolsHTML(t, i)}
    </div>`;
    if (t.count === 1) return one(0);
    return `<div class="grid-2">${Array.from({ length: t.count }, (_, i) => one(i)).join('')}</div>`;
  }

  /* A finished picture is not the end of the round. The next move is usually
     "same picture, one thing different", and it has to be one click on the
     picture itself — saving the file and picking it back from the file dialog
     is where people give up. Same entry as paste and drop (state.refs), so the
     capacity rules cannot fork. */
  function reuseArt(t, i){
    const c = cap();
    if (!c || !c.kinds.includes('image')){ refuseRefs(); renderAll(); return; }
    const from = `${t.id}:${i}`;
    const at = state.refs.findIndex(r => r.from === from);
    // The button is a toggle: pressing it twice takes the picture back out.
    if (at >= 0){
      state.refs.splice(at, 1);
      state.refNote = '';
      renderAll();
      return;
    }
    if (state.refs.length >= c.max){
      state.refNote = `${refWord()}已满 ${c.max} ${refUnit()}，先移除一张`;
      renderAll();
      return;
    }
    // Same memo as the card, so the thumbnail *is* the picture that was clicked.
    state.refs.push({ kind:'image', art:jobArt(t, i), from, fresh:true });
    state.refNote = '';
    renderAll();
  }

  /* Pressed state is derived from the strip rather than stored on the button:
     removing the tile with its own × has to flip the picture back to unpressed. */
  function syncReuse(){
    document.querySelectorAll('[data-from]').forEach(b => {
      const on = state.refs.some(r => r.from === b.dataset.from);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      // The label is the tooltip now, so it has to say what the *next* press does.
      b.setAttribute('aria-label', on ? '取消引用' : '引用');
      b.dataset.label = on ? '取消引用' : '引用';
    });
  }

  /* One entry point for the whole shelf. `run` is the only thing that decides
     whether a row is wired or merely declared, which is what makes the table
     double as the roadmap. */
  function runTool(t, i, id){
    const tool = TOOLS.find(x => x.id === id);
    if (!tool) return;
    if (tool.run === 'reuse') return reuseArt(t, i);
    if (tool.run === 'save') return saveArt(t, i);
    // Declared, placed, reachable — but not built yet. Saying so where the click
    // happened beats a disabled button that never explains itself.
    toolNote(t, i, `${tool.label} · 即将支持`);
  }

  /* 下载 used to be a decorative square: the prototype had no file behind it.
     It does now — every card is an SVG string, so hand over that string. */
  function saveArt(t, i){
    const svg = jobArt(t, i).replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ');
    const url = URL.createObjectURL(new Blob([svg], { type:'image/svg+xml' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = `apiduo-${t.mode}-${t.id}-${i + 1}.svg`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toolNote(t, i, '已开始下载');
  }

  /* The note lives inside the pill, not on the card: a wrapped shelf is two
     rows tall on a small card, and a note pinned 44px from the floor would
     land in the middle of the icons. */
  function toolNote(t, i, text){
    const bar = t.el && t.el.querySelectorAll('.tools')[i];
    if (!bar) return;
    bar.querySelectorAll('.tool-note').forEach(n => n.remove());
    const n = document.createElement('div');
    n.className = 'tool-note';
    n.textContent = text;
    bar.appendChild(n);
    setTimeout(() => {
      n.classList.add('out');
      setTimeout(() => n.remove(), 240);
    }, 1400);
  }

  function cancelJob(t){
    state.tasks = state.tasks.filter(x => x !== t);
    // A freed slot is usable at once; the queue behind it does not wait for
    // the next submit to move.
    pump();
    withView(() => renderAll());
  }

  function retryJob(t){
    t.art = null;          // a retry asks the model again; it is not the same picture
    t.status = 'queued';
    t.prog = 0;
    t.at = now();
    t.ms = jobMs(t);
    pump();
    syncJobs();
  }

  function concPill(){
    const cap = CONCURRENCY[state.mode];
    const run = runningOf(state.mode).length;
    const pill = document.createElement('span');
    pill.className = 'conc' + (run ? ' live' : '');
    pill.id = 'concPill';
    pill.setAttribute('role', 'status');
    pill.title = `${run} 个生成中 · 这个模式最多同时跑 ${cap} 个`;
    pill.innerHTML = `<i class="d"></i><b data-run>${run}/${cap}</b>`;
    return pill;
  }

  function updateConc(){
    const pill = document.getElementById('concPill');
    if (!pill) return;
    const cap = CONCURRENCY[state.mode];
    const run = runningOf(state.mode).length;
    pill.classList.toggle('live', run > 0);
    const b = pill.querySelector('[data-run]');
    if (b) b.textContent = `${run}/${cap}`;
    pill.title = `${run} 个生成中 · 这个模式最多同时跑 ${cap} 个`;
  }

  /* Appending at the bottom follows the bottom only if the reader is already
     there. Snapping unconditionally steals the page from someone reading an
     older result while a job lands. */
  function withView(fn){
    const st = $('#stage');
    const atBottom = st.scrollHeight - st.scrollTop - st.clientHeight < 28;
    const y = st.scrollTop;
    fn();
    st.scrollTop = atBottom ? st.scrollHeight : y;
  }

  /* Which family of artwork a job belongs to. makeArt picks ART[seed % 3], so
     the ambient can read the same index without looking at the pixels. */
  function ambientOf(){
    const done = jobsOf(state.mode).filter(t => t.status === 'done');
    const last = done[done.length - 1];
    return last ? 'g' + (jobSeed(last) % 3) : 'g3';
  }

  function setAmbient(){
    const host = $('#ambient');
    if (!host) return;
    const cls = ambientOf();
    host.querySelectorAll('i').forEach(i => i.classList.toggle('on', i.classList.contains(cls)));
  }

  function now(){
    const d = new Date();
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }

  function renderStream(){
    suggestions.innerHTML = '';
    const list = state.mode === 'chat' ? [] : jobsOf(state.mode);

    const want = [];
    if (state.mode === 'chat') want.push(['chat', chatEmpty]);
    else if (list.length) list.forEach(t => want.push([t.id, () => jobCard(t)]));
    // On a first run the examples *are* the content; a dashed "nothing here
    // yet" box above them only restated the obvious. With a picture already
    // attached the stage does have something to say, so the box comes back.
    else if (state.refs.length) want.push(['empty', emptyCanvas]);

    // Keyed reconcile. Rebuilding the column on every render is the most
    // common source of "why did my images flash": a node that survives keeps
    // its decoded artwork, its shimmer phase, and the scroll it sits in.
    [...stream.children].forEach(el => {
      if (!want.some(([k]) => el.dataset.key === k)) el.remove();
    });
    want.forEach(([k, make], i) => {
      let el = [...stream.children].find(x => x.dataset.key === k);
      if (!el){ el = make(); el.dataset.key = k; }
      if (stream.children[i] !== el) stream.insertBefore(el, stream.children[i] || null);
      const job = list.find(t => t.id === k);
      if (job) paintJob(el, job);
    });

    if (state.mode === 'chat' || !list.length) renderSuggestions();
  }

  function renderSuggestions(){
    suggestions.innerHTML = '';
    if (state.mode === 'chat'){
      SUGGESTIONS.chat.forEach((s, i) => {
        const b = document.createElement('button');
        b.className = 'sug';
        b.type = 'button';
        b.style.setProperty('--i', i);
        b.textContent = s;
        b.onclick = () => { promptEl.value = s; promptEl.focus(); };
        suggestions.appendChild(b);
      });
      return;
    }
    // With a picture already on the bench the next sentence is about *it*;
    // offering three fresh starting points would compete with that.
    if (state.refs.length) return;

    // Three cards is all a row can carry before the picture stops being the
    // argument, so a shelf of six needs a way to turn the page.
    const PER = 3;
    const pool = EXAMPLES[state.mode];
    const pages = Math.ceil(pool.length / PER);

    const wrap = document.createElement('div');
    wrap.className = 'ex-wrap';
    wrap.innerHTML = `
      <div class="ex-head">
        <div class="ex-title">灵感推荐</div>
        ${pages > 1 ? `<button class="ex-more" type="button">${ICON.shuffle}换一批</button>` : ''}
      </div>
      <div class="ex-sub">最新模型的一张样子 · 点开照着它改</div>`;
    const row = document.createElement('div');
    row.className = 'ex-row';
    wrap.appendChild(row);

    // One picture per card, chosen by the model's own contract: the badge, the
    // frame and the prompt all describe the same model, so a card can never
    // teach a combination the model would refuse.
    function paintPage(){
      const page = (state.exPage || 0) % pages;
      row.innerHTML = '';
      pool.slice(page * PER, page * PER + PER).forEach((e, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'ex';
        b.style.setProperty('--i', i);
        b.innerHTML = `
        <span class="ex-art">${e.art || (e.art = makeArt(e.seed))}<i class="ex-sheen"></i><span class="ex-model">${byMark(e.model)}${e.model}</span><span class="ex-ratio">${e.ratio}</span></span>
        <span class="ex-name-row"><b class="ex-name">${e.name}</b><em class="ex-go">试一试</em></span>
        <span class="ex-p">${e.p}</span>`;
        b.onclick = () => {
          promptEl.value = e.p;
          // The card is a claim about one model, so it switches to that model —
          // and adoptModel settles res/refs before the ratio is applied on top.
          const m = MODELS[state.mode].find(x => x.id === e.model);
          if (m) adoptModel(m);
          state.ratio = e.ratio;
          renderAll();
          promptEl.focus();
        };
        row.appendChild(b);
      });
    }
    paintPage();

    const more = wrap.querySelector('.ex-more');
    if (more) more.onclick = () => {
      state.exPage = ((state.exPage || 0) + 1) % pages;
      // Replaying the turn is the only feedback that the deck moved rather than
      // the pictures being swapped in place; the icon spins with it.
      more.classList.remove('turn');
      void more.offsetWidth;
      more.classList.add('turn');
      paintPage();
    };

    wrap.appendChild(row);
    suggestions.appendChild(wrap);
  }

  /* ───────── toolbar ───────── */

  /* A segmented control is one object with a moving selection, not N buttons
     that light up. The thumb is measured from the selected item, so it keeps
     working when a label changes width or a language gets longer — nothing here
     hard-codes a position. */
  function slideThumb(host, itemSel, onAttr){
    if (!host) return;
    const on = host.querySelector(`${itemSel}[${onAttr}="true"]`);
    let th = null;
    for (const c of host.children) if (c.classList && c.classList.contains('seg-thumb')) th = c;
    if (!on){ if (th) th.remove(); return; }
    if (!th){
      th = document.createElement('i');
      th.className = 'seg-thumb';
      th.setAttribute('aria-hidden', 'true');
      host.insertBefore(th, host.firstChild);
    }
    const inset = parseFloat(getComputedStyle(host).paddingLeft) || 0;
    th.style.top = inset + 'px';
    th.style.height = (host.clientHeight - inset * 2) + 'px';
    th.style.width = on.offsetWidth + 'px';
    th.style.transform = `translateX(${on.offsetLeft - inset}px)`;
  }

  function popFoot(left, right){
    const d = document.createElement('div');
    d.className = 'pop-foot';
    d.innerHTML = `<span>${left}</span>${right ? `<span class="r">${right}</span>` : ''}`;
    return d;
  }

  /* The ratio was a four-segment strip because four was all any model offered.
     A model may now declare fourteen, and a strip that long would eat the row
     the next choice has to be made in. The chip shows the current shape; the
     popover shows every shape, grouped by orientation. */
  function ratioChip(){
    const r = RATIOS[state.ratio] || RATIOS['1:1'];
    const b = document.createElement('button');
    b.className = 'chip param-chip';
    b.type = 'button';
    b.id = 'ratioChip';
    b.title = '画面比例';
    b.innerHTML = `<span class="lead-shape">${shapeBox(r.ar, 15, r.auto)}</span>
      <span class="name">${r.label}</span>${ICON.chev}`;
    b.onclick = (e) => { e.stopPropagation(); openRatioPop(b); };
    return b;
  }

  function ratioTile(key, supported){
    const r = RATIOS[key];
    const b = document.createElement('button');
    b.className = 'tile' + (r.auto ? ' auto' : '');
    b.type = 'button';
    b.setAttribute('role','menuitemradio');
    b.setAttribute('aria-checked', String(state.ratio === key));
    b.setAttribute('aria-disabled', String(!supported));
    // "auto" is still a choice, so it still needs a thing to click: a dashed
    // frame reads as "shape decided later" instead of as a section heading.
    b.innerHTML = `<span class="bx">${shapeBox(r.ar, r.auto ? 18 : 20, r.auto)}</span>
      <span>${r.label}</span>${r.auto ? '<span class="sub">跟随提示词</span>' : ''}`;
    if (!supported) b.title = `${state.model} 不支持 ${r.label}`;
    b.onclick = () => {
      if (!supported) return;
      // Changing the shape affects the *next* request; wiping the results
      // above is the kind of surprise that makes people stop touching it.
      state.ratio = key;
      closePop();
      renderAll();
    };
    return b;
  }

  function openRatioPop(anchor){
    closePop();
    const sup = model().ratios || [];
    const pop = document.createElement('div');
    pop.className = 'pop';
    pop.appendChild(popLabel(`画面比例 · ${sup.length} 个`));

    // "auto" answers a different question than the rest, so it gets a row of
    // its own instead of a cell in the shape grid.
    if (sup.includes('auto')) pop.appendChild(ratioTile('auto', true));

    RATIO_SECS.forEach(([sec, label]) => {
      const keys = Object.keys(RATIOS).filter(k => RATIOS[k].sec === sec);
      const sec_ = document.createElement('div');
      sec_.className = 'enum-sec';
      const title = document.createElement('div');
      title.className = 'enum-title';
      title.textContent = label;
      sec_.appendChild(title);
      const grid = document.createElement('div');
      grid.className = 'enum-grid';
      keys.forEach(k => grid.appendChild(ratioTile(k, sup.includes(k))));
      sec_.appendChild(grid);
      pop.appendChild(sec_);
    });

    const off = Object.keys(RATIOS).filter(k => !sup.includes(k)).length;
    pop.appendChild(popFoot(`输出 ${pxFor(state.ratio)}`, off ? `灰显 ${off} 档不支持` : ''));
    popEl = pop;
    placePop(anchor, 306);
  }

  function resChip(){
    const b = document.createElement('button');
    b.className = 'chip param-chip';
    b.type = 'button';
    b.id = 'resChip';
    b.title = '输出分辨率';
    b.innerHTML = `<span class="name">${resMeta().label}</span>${ICON.chev}`;
    b.onclick = (e) => { e.stopPropagation(); openResPop(b); };
    return b;
  }

  function openResPop(anchor){
    closePop();
    const sup = model().resOptions || RES.map(r => r.id);
    const pop = document.createElement('div');
    pop.className = 'pop';
    pop.appendChild(popLabel('输出分辨率'));

    const grid = document.createElement('div');
    grid.className = 'enum-grid cols-2';
    RES.forEach(r => {
      const ok = sup.includes(r.id);
      const b = document.createElement('button');
      b.className = 'tile';
      b.type = 'button';
      b.style.height = '52px';
      b.setAttribute('role','menuitemradio');
      b.setAttribute('aria-checked', String(state.res === r.id));
      b.setAttribute('aria-disabled', String(!ok));
      b.innerHTML = `<span>${r.label}</span>
        <span class="sub">${r.note} · ${Math.round(Math.sqrt(r.area))}px</span>`;
      if (!ok) b.title = `${state.model} 不支持 ${r.label}`;
      b.onclick = () => {
        if (!ok) return;
        state.res = r.id;
        closePop();
        renderAll();
      };
      grid.appendChild(b);
    });
    pop.appendChild(grid);
    pop.appendChild(popFoot(`输出 ${pxFor(state.ratio)}`, `${money(unitPrice())} / 张`));
    popEl = pop;
    placePop(anchor, 232);
  }

  /* Four always-visible segments cost 127px to express one number that is 1
     almost every time. The ratio is worth its width; the count is not. */
  /* Values that do not explain themselves ("0.2 0.7 1.0") get a name in the
     chip. The label costs 30px and removes the question. */
  function enumChip(id, label, value, items, onPick){
    const b = document.createElement('button');
    b.className = 'chip param-chip';
    b.type = 'button';
    b.id = id;
    b.title = label;
    b.innerHTML = `<span class="dim">${label}</span><span class="name">${value}</span>${ICON.chev}`;
    b.onclick = (e) => { e.stopPropagation(); openEnumPop(b, label, items, value, onPick); };
    return b;
  }

  function openEnumPop(anchor, label, items, value, onPick){
    closePop();
    const pop = document.createElement('div');
    pop.className = 'pop';
    pop.appendChild(popLabel(label));
    const grid = document.createElement('div');
    grid.className = 'pick-grid';
    items.forEach(v => {
      const b = document.createElement('button');
      b.className = 'pick';
      b.type = 'button';
      b.setAttribute('role','menuitemradio');
      b.setAttribute('aria-checked', String(value === v));
      b.textContent = v;
      b.onclick = () => { onPick(v); closePop(); renderToolbar(); };
      grid.appendChild(b);
    });
    pop.appendChild(grid);
    popEl = pop;
    placePop(anchor, 214);
  }

  function countChip(){
    const b = document.createElement('button');
    b.className = 'chip count-chip';
    b.type = 'button';
    b.id = 'countChip';
    b.title = '生成数量';
    b.innerHTML = `<span class="name">×${state.count}</span>${ICON.chev}`;
    b.onclick = (e) => { e.stopPropagation(); openCountPop(b); };
    return b;
  }

  function openCountPop(anchor){
    closePop();
    const pop = document.createElement('div');
    pop.className = 'pop';
    pop.appendChild(popLabel('生成数量'));
    const max = model().maxN || 4;
    const grid = document.createElement('div');
    grid.className = 'pick-grid';
    for (let n = 1; n <= max; n++){
      const b = document.createElement('button');
      b.className = 'pick';
      b.type = 'button';
      b.setAttribute('role','menuitemradio');
      b.setAttribute('aria-checked', String(state.count === n));
      b.textContent = '×' + n;
      b.onclick = () => { state.count = n; closePop(); renderToolbar(); };
      grid.appendChild(b);
    }
    pop.appendChild(grid);
    // The chip now quotes the unit price, so the popover is where the total is
    // spelled out — this is the one place a multiplier is allowed to disappear.
    pop.appendChild(popFoot(`${state.count} ${state.mode === 'video' ? '条' : '张'}`,
      `合计 ${money(unitPrice() * state.count)}`));
    popEl = pop;
    placePop(anchor, 214);
  }

  function durationGroup(values, current, onPick){
    const wrap = document.createElement('div');
    wrap.className = 'segment';
    values.forEach(v => {
      const b = document.createElement('button');
      b.className = 'seg';
      b.type = 'button';
      b.setAttribute('aria-pressed', String(current === v));
      b.textContent = v;
      b.onclick = () => { onPick(v); renderToolbar(); };
      wrap.appendChild(b);
    });
    return wrap;
  }

  /* Type and model used to be two chips that opened the same decision twice:
     the popover has always had the type tabs sitting directly on the model
     list. They are one chip now — the leading glyph is the type, the name is
     the model — and clicking it lands on the tabs if the type is what you came
     to change. */
  function modelChip(){
    const b = document.createElement('button');
    const meta = MODES.find(m => m.id === state.mode);
    b.className = 'chip';
    b.type = 'button';
    b.id = 'modelChip';
    b.title = `${meta.label}模型 · 点击切换类型或模型`;
    // The leading slot used to hold the mode icon, which repeated what the name
    // already implied. Whose model it is, on the other hand, is nowhere in
    // "flux-3-lage" — so the provenance takes the slot. The mode still shows on
    // the popover's tab and in the composer's placeholder.
    b.innerHTML = (byMark(state.model, 'lead')
        || ICON[state.mode].replace('<svg ', '<svg class="lead" '))
      + `<span class="name">${state.model}</span>${ICON.chev}`;
    b.onclick = (e) => { e.stopPropagation(); openModelPop(b); };
    return b;
  }

  /* The price is the only place the billing group becomes visible, so the
     group selector opens from here instead of occupying its own chip. */
  function priceChip(unitWord){
    const b = document.createElement('button');
    b.className = 'price-chip';
    b.type = 'button';
    b.id = 'priceChip';
    // Unit price, always. The chip used to quote the total but keep the
    // "/张" suffix, so choosing 3 images printed "≈¥0.36 /3 张" — a number that
    // is neither the price of one nor the price of three. The count chip sits
    // immediately to the left now, so the multiplication is on screen.
    const word = unitWord || '张';
    b.innerHTML = `≈ <b>${money(unitPrice())}</b><span>/${word}</span>`
      + `<span class="grp">· ${state.group}</span>${ICON.chev}`;
    b.title = `每${word}的单价 · 更换计费分组`;
    b.onclick = (e) => { e.stopPropagation(); openGroupPop(b); };
    return b;
  }

  /* ───────── reference inputs ───────── */

  /* Whether the composer can take files is a property of the model, not a mode
     switch. A text-only model shows no attach control at all: a disabled or
     dead button would still promise something the model cannot do. */
  const KIND_WORD = { image:'图', video:'视频', audio:'音频' };
  const KIND_FULL = { image:'图片', video:'视频', audio:'音频' };
  const fileEl = $('#fileInput');

  const cap = () => model().refs || null;

  /* One word for the thing being attached, derived from the mode, because the
     same bytes are a different object in each one. In 图片 / 视频 the file is a
     参考 — it steers what gets drawn. In a chat it is 图片 — it is the thing
     being asked about. Calling it 参考图 in chat is generation vocabulary
     leaking into a text box: it reads like the LLM will paint something. */
  const refWord = () => state.mode === 'chat' ? '图片'
    : (cap() && cap().all) ? '参考' : '参考图';
  /* Chinese counts pictures in 张 and everything else in 个. A mixed bag
     (全能参考) has no single correct unit, so it takes the neutral one. */
  const refUnit = () => (cap() && cap().kinds.length === 1 && cap().kinds[0] === 'image') ? '张' : '个';

  /* The four things the composer can be doing are not four modes. They are the
     same two axes — mode × has-references — read out loud, so the user never
     has to find a "图生图" entry: dropping a file into 图片 mode *is* it. */
  function opLabel(){
    const c = cap();
    const n = state.refs.length;
    if (state.mode === 'chat')  return n ? '图片问答' : '文本问答';
    if (state.mode === 'image') return n ? '图生图' : '文生图';
    if (c && c.all)   return n ? '全能参考' : '文生视频';
    if (c && c.slots) return n >= 2 ? '首尾帧' : n === 1 ? '图生视频' : '文生视频';
    return n ? '参考生视频' : '文生视频';
  }

  function renderRefs(){
    const box = $('#refs'), row = $('#refRow'), c = cap();
    // An empty row is scaffolding: it teaches the slot in 图片 / 视频 and is
    // dead weight in a chat, where the attach button below is the only door.
    box.hidden = !c || (state.mode === 'chat' && !state.refs.length);
    if (c) box.setAttribute('aria-label', refWord());
    row.innerHTML = '';
    if (!c) return;
    if (c.slots){
      c.slots.forEach((label, i) => {
        const r = state.refs.find(x => x.slot === i);
        row.appendChild(r ? refTile(r, label) : slotTile(label, i));
      });
    } else {
      state.refs.forEach(r => row.appendChild(refTile(r)));
      // Chat adds through the composer button, so an inline "+" tile here would
      // be a second door to the same room, at a different height.
      if (state.mode !== 'chat' && state.refs.length < c.max) row.appendChild(bagTile(c));
    }
    const n = state.refs.length;
    const capEl = $('#refCap');
    const limit = c.slots ? c.slots.length : c.max;
    // "0/10" is a number nobody needs; in that slot a first-time user needs to
    // know there are two ways in that leave no trace on screen.
    capEl.textContent = !c.slots && n >= c.max ? `已满 ${c.max} ${refUnit()}`
      : n ? `${n}/${limit}` : '粘贴或拖入';
    capEl.classList.toggle('full', !c.slots && n >= c.max);
    capEl.title = c.slots
      ? `可以只填${c.slots[0]}，也可以都填`
      : `可添加 ${c.kinds.map(k => KIND_WORD[k]).join(' / ')}，最多 ${c.max} ${refUnit()}`;
  }

  function refTile(r, label){
    const d = document.createElement('div');
    d.className = 'ref' + (r.fresh ? ' fresh' : '');
    delete r.fresh;   // one entrance, not one per repaint
    d.innerHTML = (r.url ? `<img src="${r.url}" alt="">` : (r.art || makeArt(0)))
      + (r.kind && (r.kind !== 'image' || (cap() && cap().all)) ? `<span class="kind">${KIND_WORD[r.kind]}</span>` : '')
      + (label ? `<span class="slot">${label}</span>` : '');
    const x = document.createElement('button');
    x.className = 'x';
    x.type = 'button';
    x.title = '移除';
    x.innerHTML = ICON.close;
    x.onclick = (e) => {
      e.stopPropagation();
      state.refs = state.refs.filter(o => o !== r);
      state.refNote = '';
      renderAll();
    };
    d.appendChild(x);
    if (r.slot !== undefined){
      d.classList.add('swap');
      d.title = `点击替换${label || ''}`;
      d.onclick = () => pickFiles(r.slot);
    }
    return d;
  }

  function slotTile(label, i){
    const b = document.createElement('button');
    b.className = 'ref-add';
    b.type = 'button';
    b.innerHTML = `${ICON.plus}<span>${label}</span>`;
    b.title = `选择${label}图片，也可以直接粘贴`;
    b.onclick = () => pickFiles(i);
    return b;
  }

  function bagTile(c){
    const b = document.createElement('button');
    b.className = 'ref-add';
    b.type = 'button';
    b.innerHTML = `${ICON.plus}<span>${refWord()}</span>`;
    b.title = `添加${c.kinds.map(k => KIND_FULL[k]).join(' / ')}，最多 ${c.max} ${refUnit()}；也可以直接粘贴或拖入`;
    b.setAttribute('aria-label', `添加${refWord()}`);
    b.onclick = () => pickFiles();
    return b;
  }

  /* Chat's only attach entry, and it stays exactly where it is whether or not
     a picture is attached — a control that moves when you use it is the kind of
     thing people stop trusting. */
  function attachBtn(c){
    const n = state.refs.length, full = n >= c.max;
    const b = document.createElement('button');
    b.className = 'attach' + (n ? ' on' : '');
    b.type = 'button';
    b.dataset.full = String(full);
    const why = `最多 ${c.max} ${refUnit()}，先移除一张`;
    const what = `添加${c.kinds.map(k => KIND_FULL[k]).join(' / ')}，也可以直接粘贴或拖入`;
    b.title = full ? why : what;
    b.setAttribute('aria-label', full ? why : `添加${refWord()}`);
    b.innerHTML = ICON.clip;
    b.onclick = () => {
      // A full bag gets an explanation, not a greyed-out button: dead reads as
      // "this model cannot" when the truth is "this model already has four".
      if (state.refs.length >= c.max){ state.refNote = `已满 ${c.max} ${refUnit()}，先移除一张`; renderAll(); return; }
      pickFiles();
    };
    return b;
  }

  function pickFiles(slot){
    const c = cap();
    if (!c) return;
    fileEl.accept = c.kinds.map(k => k + '/*').join(',');
    fileEl.dataset.slot = slot === undefined ? '' : String(slot);
    fileEl.multiple = !c.slots;
    fileEl.value = '';
    fileEl.click();
  }

  function kindOf(f){
    const k = (f.type || '').split('/')[0];
    return k === 'video' || k === 'audio' ? k : 'image';
  }

  /* Every route a file can take — picker, clipboard, drag — lands here. The
     capacity rules must not fork per gesture: a paste that ignored 尾帧, or a
     drop that overflowed the bag silently, would be a second feature wearing
     the same name. */
  function attachFiles(files, slot){
    const c = cap();
    if (!c || !files.length){
      if (!c && files.length) refuseRefs();
      return;
    }
    const all = [...files];
    const fits = all.filter(f => c.kinds.includes(kindOf(f)));
    const why = [];
    if (fits.length < all.length) why.push(`只收${c.kinds.map(k => KIND_FULL[k]).join(' / ')}`);

    if (c.slots){
      if (slot !== undefined){
        const f = fits[0];
        if (!f){ state.refNote = why.join(' · '); renderAll(); return; }
        state.refs = state.refs.filter(r => r.slot !== slot);
        state.refs.push({ slot, kind: kindOf(f), url: URL.createObjectURL(f) });
        state.refNote = '';
        renderAll();
        return;
      }
      // A paste names no slot, so it fills the empty ones left to right —
      // which is also the order the tiles are read in.
      const empty = c.slots.map((_, i) => i).filter(i => !state.refs.some(r => r.slot === i));
      const take = fits.slice(0, empty.length);
      take.forEach((f, k) => state.refs.push({ slot:empty[k], kind:kindOf(f), url:URL.createObjectURL(f) }));
      if (fits.length > take.length){
        why.push(`已忽略 ${fits.length - take.length} 个（${c.slots.join(' / ')}各一个）`);
      }
    } else {
      const room = Math.max(0, c.max - state.refs.length);
      const take = fits.slice(0, room);
      take.forEach(f => state.refs.push({ kind:kindOf(f), url:URL.createObjectURL(f) }));
      if (fits.length > take.length) why.push(`已忽略 ${fits.length - take.length} 个（最多 ${c.max} 个）`);
    }
    state.refNote = why.join(' · ');
    renderAll();
  }

  /* Refusing in silence is how someone pastes a screenshot five times and
     decides the composer is broken. Name the model that would have taken it. */
  function refuseRefs(){
    const alt = MODELS[state.mode].find(m => m.refs);
    const cant = state.mode === 'chat' ? '读不了图片' : '不支持参考';
    state.refNote = alt
      ? `${model().id} ${cant}，换成 ${alt.id} 再试`
      : `当前模型${cant}`;
    renderAll();
  }

  fileEl.addEventListener('change', () => {
    const files = [...fileEl.files];
    const slot = fileEl.dataset.slot === '' ? undefined : Number(fileEl.dataset.slot);
    fileEl.value = '';
    if (files.length) attachFiles(files, slot);
  });

  /* ───────── clipboard & drop ───────── */

  const composerEl = document.querySelector('.composer-inner');
  const dropHintEl = $('#dropHint');

  const IMG_URL = /^https?:\/\/[^\s]+\.(png|jpe?g|webp|gif|avif|bmp)(\?[^\s]*)?$/i;

  function filesFrom(dt){
    if (!dt) return [];
    const out = [];
    [...(dt.items || [])].forEach(it => {
      if (it.kind !== 'file') return;
      const f = it.getAsFile();
      if (f) out.push(f);
    });
    if (!out.length && dt.files) out.push(...dt.files);
    return out;
  }

  // A copied image and a copied image *address* are the same intent; the
  // clipboard just delivers the second one as text. Probe the link first — a
  // tile that renders broken is worse than a paste that was refused.
  function attachUrl(url){
    const probe = new Image();
    probe.onload = () => {
      const c = cap();
      if (!c || !c.kinds.includes('image')){ refuseRefs(); return; }
      if (c.slots){
        const i = c.slots.findIndex((_, k) => !state.refs.some(r => r.slot === k));
        if (i < 0){ state.refNote = `${c.slots.join(' / ')}都有图了，先移除一张`; renderAll(); return; }
        state.refs.push({ slot:i, kind:'image', url });
      } else {
        if (state.refs.length >= c.max){ state.refNote = `已满 ${c.max} 个`; renderAll(); return; }
        state.refs.push({ kind:'image', url });
      }
      state.refNote = '';
      renderAll();
    };
    probe.onerror = () => { state.refNote = '这个链接不是能直接读取的图片'; renderAll(); };
    probe.src = url;
  }

  function insertIntoPrompt(text){
    const had = document.activeElement === promptEl;
    const start = had ? (promptEl.selectionStart ?? promptEl.value.length) : promptEl.value.length;
    const end = had ? (promptEl.selectionEnd ?? start) : promptEl.value.length;
    // Landing after a half-written sentence without a space glues two words
    // together, which then reads as a typo the user did not make.
    const pad = !had && promptEl.value && !/\s$/.test(promptEl.value) ? ' ' : '';
    promptEl.focus();
    promptEl.setRangeText(pad + text, start, end, 'end');
    promptEl.dispatchEvent(new Event('input'));
  }

  document.addEventListener('paste', (e) => {
    const dt = e.clipboardData;
    if (!dt) return;
    const files = filesFrom(dt);
    if (files.length){
      e.preventDefault();
      attachFiles(files);
      return;
    }
    const text = dt.getData('text/plain');
    if (!text) return;
    if (IMG_URL.test(text.trim())){ e.preventDefault(); attachUrl(text.trim()); return; }
    // Ctrl+V belongs to the field it is aimed at. Anywhere else — a chip, a
    // popover, the canvas — the browser would drop the text on the floor.
    const el = e.target;
    if (el instanceof Element && el.closest('input, textarea, [contenteditable=""], [contenteditable="true"]')) return;
    e.preventDefault();
    insertIntoPrompt(text);
  });

  const isFileDrag = (dt) => !!dt && [...(dt.types || [])].includes('Files');
  let dragDepth = 0;

  document.addEventListener('dragenter', (e) => {
    if (!isFileDrag(e.dataTransfer)) return;
    e.preventDefault();
    dragDepth += 1;
    if (dragDepth > 1) return;
    dropHintEl.textContent = cap() ? `松手加入${refWord()}`
      : state.mode === 'chat' ? '当前模型读不了图片' : '当前模型不支持参考图';
    composerEl.classList.add('dropping');
  });

  document.addEventListener('dragover', (e) => {
    if (!isFileDrag(e.dataTransfer)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
  });

  document.addEventListener('dragleave', () => {
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) composerEl.classList.remove('dropping');
  });

  document.addEventListener('drop', (e) => {
    if (!isFileDrag(e.dataTransfer)) return;
    e.preventDefault();
    dragDepth = 0;
    composerEl.classList.remove('dropping');
    attachFiles([...e.dataTransfer.files]);
  });

  /* A model can hold fewer references than the one it replaces, so the
     selection has to shrink with it — and say so. Dropping a file the user
     picked, silently, is the kind of bug they only notice after paying. */
  function adoptModel(m){
    state.model = m.id;
    if (m.res) state.res = m.res;
    if (m.resOptions && !m.resOptions.includes(state.res)) state.res = m.res;
    // The old ratio may not exist on the new model. Silently rounding to a
    // different shape would return an image nobody asked for.
    if (m.ratios && !m.ratios.includes(state.ratio)) state.ratio = m.ratios[0];

    const c = m.refs;
    const limit = c ? (c.slots ? c.slots.length : c.max) : 0;
    const dropped = state.refs.length - limit;
    if (dropped > 0){
      state.refs = state.refs.slice(0, limit);
      state.refNote = limit
        ? `${m.id} 最多 ${limit} ${refUnit()}，已移除 ${dropped} 个`
        : `${m.id} ${state.mode === 'chat' ? '读不了图片' : '不支持参考'}，已移除 ${dropped} 个`;
    } else {
      state.refNote = '';
    }
    if (c && c.slots){
      // A bag carried over from another mode has no slot index yet; assign by
      // position so the first image lands in 首帧 and the second in 尾帧.
      state.refs.forEach((r, i) => { if (r.slot === undefined) r.slot = i; });
    } else {
      // Coming back to a bag, a leftover index would make a plain thumbnail
      // behave like a slot and overwrite a neighbour instead of appending.
      state.refs.forEach(r => { delete r.slot; });
    }
  }

  function renderToolbar(){
    toolbar.innerHTML = '';

    toolbar.appendChild(modelChip());

    const right = document.createElement('div');
    right.className = 'right';

    if (state.mode === 'image'){
      toolbar.appendChild(ratioChip());
      toolbar.appendChild(resChip());

      // "how many" is a multiplier on "how much", so it belongs on the receipt
      // side of the row — and it stops the price from being the only thing
      // pushed onto a second line at 390px.
      right.appendChild(countChip());
      right.appendChild(priceChip());

      const clear = document.createElement('button');
      clear.className = 'clear';
      clear.type = 'button';
      clear.title = '清空结果';
      clear.innerHTML = ICON.trash;
      clear.onclick = () => {
        state.tasks = state.tasks.filter(t => t.mode !== state.mode);
        withView(() => renderAll());
      };
      right.appendChild(clear);

      right.appendChild(concPill());
      right.appendChild(submitBtn('生成'));
    }

    if (state.mode === 'chat'){
      // Files come before parameters — left of the model chip — because what
      // you attach is part of the request, and the chips to its right only
      // shape the answer.
      if (cap()) toolbar.insertBefore(attachBtn(cap()), toolbar.firstChild);
      toolbar.appendChild(enumChip('tempChip', '温度', state.temp, ['0.2','0.7','1.0'],
        v => { state.temp = v; }));
      toolbar.appendChild(enumChip('ctxChip', '上下文', state.ctx, ['2k','8k','32k'],
        v => { state.ctx = v; }));

      const price = document.createElement('button');
      price.className = 'price-chip';
      price.type = 'button';
      // One currency on one screen: the image chip is in ¥, so tokens are too.
      price.innerHTML = `入 <b>${'¥' + (model().in * group().ratio * 7.2).toFixed(1)}</b>`
        + ` · 出 <b>${'¥' + (model().out * group().ratio * 7.2).toFixed(1)}</b><span>/M</span>`
        + `<span class="grp">· ${state.group}</span>${ICON.chev}`;
      price.title = '更换计费分组';
      price.onclick = (e) => { e.stopPropagation(); openGroupPop(e.currentTarget); };
      right.appendChild(price);

      right.appendChild(submitBtn('发送'));
    }

    if (state.mode === 'video'){
      const dur = durationGroup(['5s','10s'], state.dur, v => { state.dur = v; });
      dur.title = '时长';
      const res = durationGroup(['720p','1080p'], state.vres, v => { state.vres = v; });
      res.title = '分辨率';
      toolbar.appendChild(dur);
      toolbar.appendChild(res);

      right.appendChild(priceChip('条'));

      right.appendChild(concPill());
      right.appendChild(submitBtn('生成'));
    }

    toolbar.appendChild(right);

    // The toolbar is in the document by now, so offsetWidth/offsetLeft are real.
    // Doing this after append is what keeps the thumb from flashing at 0px.
    toolbar.querySelectorAll('.segment').forEach(seg => slideThumb(seg, '.seg', 'aria-pressed'));
  }

  function submitBtn(label){
    // Only a chat turn locks the button. A background image or video job must
    // not: a button that flips to "生成中" and back twice per job changes
    // under the cursor, which is its own kind of jitter.
    const busy = state.mode === 'chat' && state.busy;
    const b = document.createElement('button');
    b.className = 'submit' + (busy ? ' busy' : '');
    b.type = 'button';
    b.disabled = busy;
    b.innerHTML = busy
      ? `${label === '发送' ? '发送中' : '生成中'}<span class="mini-ring"></span>`
      : `${label}${ICON.send}`;
    b.onclick = run;
    return b;
  }

  /* ───────── model popover ───────── */

  let popEl = null;
  let popRO = null;
  function closePop(){
    if (popRO){ popRO.disconnect(); popRO = null; }
    if (popEl){ popEl.remove(); popEl = null; }
  }

  function popLabel(label){
    const d = document.createElement('div');
    d.className = 'pop-label';
    d.textContent = label;
    return d;
  }

  function renderModelList(body){
    body.innerHTML = '';
    const meta = MODES.find(m => m.id === state.mode);
    // The tab above already carries how many there are; the rows below differ
    // only by the number, so the unit is stated once, here, instead of being
    // repeated on every line and crowding the right edge.
    const unitNote = state.mode === 'chat' ? '每百万 token'
      : state.mode === 'image' ? '按张计费' : '按条计费';
    body.appendChild(popLabel(`${meta.label}模型 · ${unitNote}`));

    MODELS[state.mode].forEach(m => {
      // The tail speaks the same language as the price chip: yuan, in the unit
      // this mode bills by. A list quoting dollars next to a chip quoting yuan
      // makes the reader do an exchange rate in their head.
      const ratio = group().ratio;
      const tail = state.mode === 'image'
        ? `${money(m.unit * (RES.find(r => r.id === m.res) || RES[1]).scale * ratio * 7.2)}`
        : state.mode === 'chat'
          ? `入 ¥${(m.in * ratio * 7.2).toFixed(1)} · 出 ¥${(m.out * ratio * 7.2).toFixed(1)}`
          : `${money(m.unit * ratio * 7.2)}`;

      const capTag = m.refs
        ? (m.refs.slots ? (m.refs.slots.length > 1 ? '首尾帧' : '首帧')
          : m.refs.all ? '全能参考'
          : `${refWord()} ${m.refs.max}`)
        : '仅文本';

      const b = document.createElement('button');
      b.className = 'pop-item model';
      b.type = 'button';
      b.setAttribute('role','menuitemradio');
      b.setAttribute('aria-checked', String(m.id === state.model));
      b.innerHTML = `${byAva(m.id)}
        <span class="lines">
          <span class="which"><span class="mono">${m.id}</span>${m.id === 'flux-3-lage' ? '<span class="newtag">NEW</span>' : ''}<span class="cap">${capTag}</span></span>
          <span class="desc">${m.desc}</span>
        </span>
        <span class="tail">${tail}</span>${ICON.check}`;
      b.onclick = () => {
        lastPick[state.mode] = m.id;
        adoptModel(m);
        closePop(); renderAll();
      };
      body.appendChild(b);
    });
  }

  /* Level 1 (what am I making) and level 2 (which model makes it) are one
     decision made twice. Making them separate popovers meant leaving the list
     to change the group above it — so the tab bar lives inside the popover,
     directly over the list it filters, and switching keeps the popover open. */
  function openModelPop(anchor){
    closePop();
    const pop = document.createElement('div');
    pop.className = 'pop pop-model';

    const head = document.createElement('div');
    head.className = 'pop-head';
    const tabs = document.createElement('div');
    tabs.className = 'pop-tabs';
    tabs.setAttribute('role','tablist');
    MODES.forEach(m => {
      const b = document.createElement('button');
      b.className = 'pop-tab';
      b.type = 'button';
      b.setAttribute('role','tab');
      b.dataset.mode = m.id;
      // The type popover was retired into this tab bar; its one-line
      // explanations still earn their keep as tooltips here.
      b.title = m.desc;
      b.setAttribute('aria-selected', String(m.id === state.mode));
      b.innerHTML = `${ICON[m.id]}<span>${m.label}</span><span class="n">${MODELS[m.id].length}</span>`
        + (runningOf(m.id).length ? '<i class="live-dot"></i>' : '');
      b.onclick = (e) => {
        e.stopPropagation();
        if (state.mode === m.id) return;
        setMode(m.id);
        tabs.querySelectorAll('.pop-tab').forEach(t => {
          t.setAttribute('aria-selected', String(t.dataset.mode === state.mode));
        });
        // setMode() re-rendered the toolbar, so the chip this popover points at
        // is a new element. Re-anchor without re-inserting, otherwise popIn
        // replays and an in-place switch looks like a brand new popover.
        renderModelList(pop.querySelector('.pop-body'));
        placePop($('#modelChip'), 332);
      };
      tabs.appendChild(b);
    });
    head.appendChild(tabs);
    pop.appendChild(head);

    const body = document.createElement('div');
    body.className = 'pop-body';
    pop.appendChild(body);

    popEl = pop;
    renderModelList(body);
    placePop(anchor, 332);
  }

  function openGroupPop(anchor){
    closePop();
    const pop = document.createElement('div');
    pop.className = 'pop';
    pop.appendChild(popLabel('计费分组'));
    GROUPS.forEach(g => {
      const b = document.createElement('button');
      b.className = 'pop-item';
      b.type = 'button';
      b.setAttribute('role','menuitemradio');
      b.setAttribute('aria-checked', String(g.id === state.group));
      b.innerHTML = `${ICON.check}<span class="mono">${g.id}</span>
        <span class="tail">${g.ratio === 1 ? '标准价' : '×' + g.ratio.toFixed(2)}</span>`;
      b.onclick = () => { state.group = g.id; closePop(); renderToolbar(); };
      pop.appendChild(b);
    });
    popEl = pop;
    placePop(anchor, 236);
  }

  function placePop(anchor, w){
    if (!popEl) return;
    if (!popEl.isConnected) document.body.appendChild(popEl);
    popEl.style.width = w + 'px';

    const place = () => {
      // offsetHeight, not getBoundingClientRect().height: the pop-in animation
      // is still scaling the element, and a scaled rect reports a wrong number.
      const h = popEl.offsetHeight;
      const r = anchor.getBoundingClientRect();
      const M = 10, GAP = 8;

      // Prefer opening upward (the trigger sits at the bottom of the screen),
      // but always clamp inside the viewport on all four sides.
      let top = r.top - h - GAP;
      if (top < M) top = r.bottom + GAP;
      if (top + h > window.innerHeight - M) top = Math.max(M, window.innerHeight - h - M);

      // Anchors on the right half open right-aligned, so the popup grows inward
      // instead of hanging off the edge it is closest to.
      let left = (r.left + r.width / 2 > window.innerWidth / 2) ? (r.right - w) : r.left;
      if (left + w > window.innerWidth - M) left = window.innerWidth - w - M;
      if (left < M) left = M;

      popEl.style.left = left + 'px';
      popEl.style.top = top + 'px';

      // Which corner does it come out of? A popover pinned under the chip grows
      // downwards from that chip; one that had to flip upwards grows from its
      // own bottom edge. Only written when it changes, so the entrance
      // animation is not re-origined mid-flight.
      const oy = (top + h <= r.top + 1) ? 'bottom' : (top >= r.bottom - 1 ? 'top' : 'center');
      const ox = (left >= r.left - 1) ? 'left' : (left + w <= r.right + 1 ? 'right' : 'center');
      const origin = ox + ' ' + oy;
      if (popEl.style.transformOrigin !== origin) popEl.style.transformOrigin = origin;

      popEl.querySelectorAll('.pop-tabs').forEach(t => slideThumb(t, '.pop-tab', 'aria-selected'));
    };

    place();
    // Second pass: a description only wraps once the width has landed, so the
    // first measurement can be a line short and leave the popup sitting on top
    // of the chip that opened it.
    requestAnimationFrame(place);
    // And a third, for every later change: fonts landing, the list growing when
    // a tab is switched, a description taking one more line. Reposition on
    // resize instead of guessing when the layout has settled.
    if (typeof ResizeObserver !== 'undefined'){
      // Rebuilt every time: the callback closes over this call's place() and
      // anchor. Reusing the previous observer after a re-anchor would keep
      // measuring against the chip that was just replaced.
      if (popRO) popRO.disconnect();
      popRO = new ResizeObserver(() => { if (popEl && popEl.isConnected) place(); });
      popRO.observe(popEl);
    }
  }

  document.addEventListener('click', (e) => {
    if (popEl && !popEl.contains(e.target)) closePop();
  });

  /* ───────── run ───────── */

  function run(){
    const text = promptEl.value.trim();
    if (!text){
      promptEl.focus();
      promptEl.placeholder = '先写下想要的画面…';
      return;
    }

    /* The submit button is never disabled for a running job (see submitBtn),
       so the two guards live here: Enter held down, and a double click on
       生成. Both are one press that arrived twice — 260ms is longer than a key
       repeat interval and shorter than a second thought. */
    const t0 = performance.now();
    if (t0 < state.lockUntil) return;

    // Same words, same params, inside a second: the same wish, not a second one.
    const sig = [state.mode, state.model, state.ratio, state.count, text].join('|');
    if (sig === state.lastSig && t0 - state.lastAt < 900) return;

    state.refNote = '';

    if (state.mode === 'chat'){
      // A conversation turn is single-flight: two Enter presses must not buy
      // two answers to one question.
      if (state.busy) return;
      state.busy = true;
      renderAll();
      setTimeout(() => {
        state.busy = false;
        state.spend += unitPrice() * state.count;
        state.spendCount += 1;
        promptEl.value = '';
        promptEl.style.height = '';
        renderAll();
        renderSpend();
      }, 1200);
      return;
    }

    if (queuedOf(state.mode).length >= QUEUE_MAX){
      state.refNote = `队列已满（${QUEUE_MAX} 个），等前面的跑完再发`;
      renderAll();
      return;
    }

    // Presets are frozen so a screenshot stays reproducible; the first real
    // submit wakes them instead of leaving their slots occupied forever.
    state.tasks.forEach(t => {
      if (t.frozen && t.status === 'running'){
        t.frozen = false;
        t.startedAt = performance.now() - t.prog * t.ms;
      }
    });
    ensureTick();

    const t = {
      id:'t' + (++state.seq),
      mode: state.mode,
      model: state.model,
      prompt: text,
      ratio: state.ratio,
      res: state.res,
      vres: state.vres,
      dur: state.dur,
      count: state.mode === 'image' ? state.count : 1,
      refs: state.refs.slice(),
      op: opLabel(),
      at: now(),
      cost: state.mode === 'image' ? unitPrice() * state.count : unitPrice(),
      status:'queued',
      prog:0,
      frozen:false,
      remote:''
    };
    t.ms = jobMs(t);
    // A short id of the kind an async API hands back, derived from ours so the
    // same link always shows the same string.
    t.remote = ('00000' + (parseInt(t.id.slice(1), 10) * 40503 % 0xfffff).toString(16)).slice(-5);

    // Only an accepted request arms the guard. Arming it on a rejected one
    // would swallow the next, genuinely different, prompt typed a beat later.
    state.lockUntil = t0 + 260;
    state.lastSig = sig;
    state.lastAt = t0;

    state.tasks.push(t);
    state.seed = null;

    // The request left the composer the moment it was accepted: leaving the
    // words behind is how the same generation gets paid for twice.
    promptEl.value = '';
    promptEl.style.height = '';
    state.refs = [];

    pump();
    withView(() => renderAll());
    promptEl.focus();
  }

  function renderSpend(){
    const el = $('#spendVal');
    const txt = money(state.spend);
    if (el.textContent !== txt){
      el.textContent = txt;
      // The number is the only receipt on screen; a change that happens
      // silently is a change the user will later dispute.
      if (state.spend > 0 && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
        el.classList.remove('bump');
        void el.offsetWidth;
        el.classList.add('bump');
      }
    }
    $('#spendCnt').textContent = `· ${state.spendCount} 次`;
  }

  /* ───────── modes ───────── */

  function setMode(id){
    if (state.mode === id) return;
    // A model belongs to exactly one mode: keeping the old one would leave a
    // text model sitting in the image composer. But coming back to a mode
    // should land on the model you were using, not on whatever is first.
    if (MODELS[state.mode].some(m => m.id === state.model)) lastPick[state.mode] = state.model;
    state.mode = id;
    state.busy = false;
    const pick = MODELS[id].find(m => m.id === lastPick[id]) || MODELS[id][0];
    // Video has no ratio control, but its canvas still needs a shape; carrying
    // over the image mode's 1:1 would show a square viewport for a 16:9 clip.
    if (id === 'video') state.ratio = '16:9';
    // References ride along across modes on purpose: the picture you attached
    // to ask about is the same picture you ask to edit. Only the capacity of
    // the new model decides what survives.
    adoptModel(pick);
    renderAll();
  }

  /* ───────── menu: states ───────── */

  const STATES = [
    ['empty','空态'],
    ['loading','生成中'],
    ['single','单图完成'],
    ['quad','多图完成'],
    ['burst','并发 3 路'],
    ['failed','失败态'],
    ['history','多轮历史']
  ];

  /* Presets are jobs too — that is the point of the refactor. A state used to
     be "what the canvas shows"; now it is "what is in the queue", and the
     canvas is just its last pixel. Frozen jobs keep a review screenshot from
     finishing mid-capture. */
  function seedState(key){
    stopTick();
    // These presets are described in image params (ratio × count), so the
    // state menu is an image-mode view by definition.
    state.mode = 'image';
    state.model = MODELS.image[0].id;
    state.tasks = [];
    // seq must not restart: a preset re-using id p1 would be handed the previous
    // preset's DOM node by the keyed reconcile, and paintJob — seeing the same
    // status on it — would keep showing the old picture.
    state.seed = key;
    const mode = 'image';
    const add = (o) => {
      const t = Object.assign({
        id:'p' + (++state.seq),
        mode, model: MODELS[mode][0].id, ratio: mode === 'video' ? '16:9' : '1:1',
        res: state.res, vres:'1080p', dur:'5s',
        count:1, refs:[], op: mode === 'video' ? '文生视频' : '文生图',
        at: now(), cost: mode === 'video' ? 0.86 : 0.115,
        status:'done', prog:1, ms:2000, prompt:'', frozen:false
      }, o);
      state.tasks.push(t);
      return t;
    };
    if (key === 'single') add({});
    if (key === 'quad') add({ count:4, cost:0.461 });
    if (key === 'history'){
      add({ at:'20:07', ratio:'1:1', cost:0.115 });
      add({ at:'20:04', ratio:'16:9', count:4, cost:0.461 });
      add({ at:'19:58', ratio:'9:16', cost:0.122 });
    }
    // The price stays on the job; it is the receipt line, not the job, that
    // says 未计费 while the status is failed.
    if (key === 'failed') add({ status:'failed', op:'图生图', cost:0.115, refs:[{ kind:'image', art: makeArt(3) }] });
    if (key === 'loading') add({ status:'running', frozen:true, prog:0.42, ms:6000, op:'图生图', count:4, cost:0.461 });
    if (key === 'burst'){
      add({ status:'running', frozen:true, prog:0.31, ms:8000, op:'图生图', count:4, cost:0.461 });
      add({ status:'running', frozen:true, prog:0.57, ms:8000, ratio:'16:9', cost:0.13 });
      add({ status:'running', frozen:true, prog:0.78, ms:8000, ratio:'9:16', count:2, cost:0.26 });
      add({ status:'queued', prog:0, ratio:'4:3', count:2, cost:0.26 });
    }
  }

  let menuEl = null;
  $('#stateBtn').onclick = (e) => {
    e.stopPropagation();
    if (menuEl){ menuEl.remove(); menuEl = null; return; }
    const m = document.createElement('div');
    m.className = 'menu';
    STATES.forEach(([key, label]) => {
      const b = document.createElement('button');
      b.className = 'menu-item';
      b.type = 'button';
      b.setAttribute('aria-checked', String(state.seed === key));
      b.innerHTML = `${label}${ICON.check}`;
      b.onclick = () => {
        seedState(key);
        renderAll();
        m.remove(); menuEl = null;
      };
      m.appendChild(b);
    });
    document.body.appendChild(m);
    const r = e.currentTarget.getBoundingClientRect();
    m.style.left = Math.min(r.right - 146, window.innerWidth - 156) + 'px';
    m.style.top = (r.bottom + 6) + 'px';
    menuEl = m;
  };

  document.addEventListener('click', (e) => {
    if (menuEl && !menuEl.contains(e.target) && e.target.id !== 'stateBtn'){ menuEl.remove(); menuEl = null; }
  });

  /* ───────── theme ───────── */

  $('#themeBtn').onclick = () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    const apply = () => { document.documentElement.dataset.theme = next; };
    // White to black in one frame is a flash, not a theme change. Where the
    // browser can snapshot the page it cross-dissolves; where it cannot, the cut
    // stays instant — a wrong transition is worse than none.
    if (document.startViewTransition && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      document.startViewTransition(apply);
    } else apply();
  };

  /* ───────── annotations ───────── */

  const NOTES = [
    { sel:'#modelChip', text:'<b>类型与模型是一颗芯片</b>字首图标即类型；点开先在顶部切类型，列表与参数跟着换。', side:'above' },
    { sel:'.ref-add', text:'<b>参考是输入，不是参数</b>放张图就成了图生图；装不下会明说丢了几张。', side:'above' },
    { sel:'.attach', text:'<b>聊天里的图是问题，不是参考</b>LLM 只有一颗附件按钮，不再占一整行虚线槽；贴图后才在正文上方出现缩略图。', side:'above' },
    { sel:'.frame', text:'<b>画布就是参数的反馈</b>占位按比例铺开，出图不再跳尺寸。', side:'right' },
    { sel:'#ratioChip', text:'<b>枚举按形状铺开</b>横 / 方 / 竖分组，灰显即不支持。', side:'above' },
    { sel:'.price-chip', text:'<b>分组挂在价格上</b>点价格换分组，不塞进模型里。', side:'above' }
  ];

  function clearNotes(){
    document.querySelectorAll('.note,.ring-mark').forEach(n => n.remove());
  }

  function drawNotes(){
    clearNotes();
    // "above" callouts are pinned by their bottom edge, never their top. The
    // measured height of a wrapped bubble is not reliable before its final
    // width is applied, and a top-anchored bubble that comes out shorter than
    // measured lands on the composer it is describing.
    let above = null;   // { topEdge } in bottom-offset space
    NOTES.forEach((n, i) => {
      const target = document.querySelector(n.sel);
      if (!target) return;
      const r = target.getBoundingClientRect();
      if (r.width === 0) return;

      const ring = document.createElement('div');
      ring.className = 'ring-mark ok';
      ring.style.left = (r.left - 5) + 'px';
      ring.style.top = (r.top - 5) + 'px';
      ring.style.width = (r.width + 10) + 'px';
      ring.style.height = (r.height + 10) + 'px';
      document.body.appendChild(ring);

      const note = document.createElement('div');
      note.className = 'note';
      note.innerHTML = n.text;
      document.body.appendChild(note);

      const nw = note.offsetWidth, nh = note.offsetHeight;
      let left, top;
      if (n.side === 'right'){
        left = r.right + 14;
        top = r.top + r.height / 2 - nh / 2;
      } else if (n.side === 'above'){
        // Clear the composer entirely: a bubble sitting on top of the textarea
        // it is explaining hides the thing being reviewed.
        const host = document.querySelector('.composer-inner').getBoundingClientRect();
        left = r.left;
        top = host.top - nh - 10;
        // Two callouts anchored to chips side by side must not share a band.
        let bottom = window.innerHeight - host.top + 10;
        if (above && left < above.right + 8 && left + nw > above.left - 8){
          bottom = above.topEdge + 8;
        }
        above = { left, right: left + nw, topEdge: bottom + nh };
        note.style.left = Math.max(10, Math.min(left, window.innerWidth - nw - 10)) + 'px';
        note.style.bottom = bottom + 'px';
        note.style.top = 'auto';
        return;
      } else {
        left = r.left + r.width / 2 - nw / 2;
        top = r.top - nh - 12;
      }
      if (left + nw > window.innerWidth - 10) left = window.innerWidth - nw - 10;
      if (top < 60) top = r.bottom + 12;
      note.style.left = Math.max(10, left) + 'px';
      note.style.top = Math.max(58, top) + 'px';
      note.style.bottom = 'auto';
    });
  }

  $('#noteBtn').onclick = (e) => {
    state.notes = !state.notes;
    e.currentTarget.setAttribute('aria-pressed', String(state.notes));
    if (state.notes) drawNotes(); else clearNotes();
  };

  /* ───────── boot ───────── */

  /* Deep-linkable states: #loading #single #quad #failed #history #notes
     #dark and #chat #video, comma-separated. Reviewers open a link instead of
     replaying clicks, and the screenshots in the PR point at the same URL. */
  const HASH_PARTS = location.hash.replace(/^#/, '').toLowerCase().split(',').filter(Boolean);
  // One preset per request kind, so a review link can show 图片问答 / 图生图 /
  // 首尾帧 / 全能参考 without a file picker in a headless browser.
  const REF_PRESETS = {
    refs:      { mode:'image', model:'flux-3-lage',      n:2 },
    refsslots: { mode:'video', model:'seedance-1.0-pro', slots:[0] },
    refsomni:  { mode:'video', model:'seedance-2.0',     kinds:['image','video','audio'] }
  };
  (function applyHash(){
    for (const part of HASH_PARTS){
      if (STATES.some(([k]) => k === part)) seedState(part);
      if (part === 'notes'){ state.notes = true; $('#noteBtn').setAttribute('aria-pressed', 'true'); }
      if (part === 'dark') document.documentElement.dataset.theme = 'dark';
      if (part === 'chat' || part === 'image' || part === 'video'){
        state.mode = part;
        state.model = MODELS[part][0].id;
        if (MODELS[part][0].res) state.res = MODELS[part][0].res;
        if (part === 'video') state.ratio = '16:9';
      }
    }
    const preset = HASH_PARTS.find(p => REF_PRESETS[p]);
    if (preset){
      const p = REF_PRESETS[preset];
      // An explicit mode in the same hash wins: #refs,chat has to be 图片问答,
      // not whatever mode the preset happens to carry.
      const explicit = HASH_PARTS.find(x => x === 'chat' || x === 'image' || x === 'video');
      if (!explicit){
        state.mode = p.mode;
        state.model = p.model;
        if (p.mode === 'video') state.ratio = '16:9';
      }
      state.refs = [];
      if (p.n) for (let i = 0; i < p.n; i++) state.refs.push({ kind:'image', art: makeArt(40 + i) });
      if (p.slots) p.slots.forEach(i => state.refs.push({ slot:i, kind:'image', art: makeArt(60 + i) }));
      if (p.kinds) p.kinds.forEach((k, i) => state.refs.push({ kind:k, art: makeArt(70 + i) }));
    }
  })();

  function renderAll(){
    renderStream();
    setAmbient();
    // The overlay is the one piece of composer copy that is not re-rendered:
    // a chat asks a question about the picture, it does not take a 参考图.
    dropHintEl.textContent = state.mode === 'chat' ? '松手把图加进问题' : `松手加入${refWord()}`;
    renderRefs();
    syncReuse();
    renderToolbar();
    renderSpend();
    const hasRefs = state.refs.length > 0;
    promptEl.placeholder = hasRefs
      ? (state.mode === 'image' ? '描述要怎么改…'
        : state.mode === 'video' ? '描述镜头怎么动…' : '就这张图提问…')
      : { chat:'问点什么…', image:'描述你想要的画面…', video:'描述你想要的镜头…' }[state.mode];
    // Keyboard hints on a touch screen are noise: the phone screenshot showed
    // "Shift + Enter 换行" under a toolbar with no keys on it.
    const keys = window.matchMedia('(max-width:760px)').matches ? ''
      : state.mode === 'chat' ? ' · Enter 发送 · Shift + Enter 换行'
      : ' · Enter 生成 · Shift + Enter 换行';
    // The four names people use — 文本问答 / 图片问答 / 图生图 / 全能参考 — are
    // states of one composer, not four entries. The hint is where they are
    // read back, so nobody has to hunt for a mode that does not exist.
    const what = state.mode === 'image' ? `${opLabel()} · 参数只对这一次生成生效`
      : state.mode === 'video' ? `${opLabel()} · 异步出片，完成后进入历史`
      : `${opLabel()} · 模型与分组跟随这条消息`;
    hint.classList.toggle('warn', !!state.refNote);
    hint.textContent = state.refNote || what + keys;
    if (state.notes) requestAnimationFrame(drawNotes);
  }

  // One listener for every card: the highlight only needs the pointer's
  // position inside the card it is currently over.
  stream.addEventListener('pointermove', (e) => {
    const art = e.target && e.target.closest ? e.target.closest('.art') : null;
    if (!art) return;
    const r = art.getBoundingClientRect();
    if (!r.width) return;
    art.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100).toFixed(1) + '%');
    art.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100).toFixed(1) + '%');
  }, { passive: true });

  promptEl.addEventListener('keydown', (e) => {
    // Holding the key down is not a second request.
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !e.repeat){
      e.preventDefault();
      run();
    }
  });

  promptEl.addEventListener('input', () => {
    promptEl.style.height = 'auto';
    promptEl.style.height = Math.min(190, Math.max(78, promptEl.scrollHeight)) + 'px';
  });

  window.addEventListener('resize', () => { if (state.notes) drawNotes(); });
  document.addEventListener('scroll', () => { if (state.notes) requestAnimationFrame(drawNotes); }, true);

  requestAnimationFrame(() => {
    renderAll();
    // #openmode / #openmodel / #openratio / #openres / #opencount exist for
    // review: they open a dropdown without a click, so a screenshot can capture
    // the state that matters without racing the first render. Match whole hash
    // parts — "openmodel" starts with "openmode".
    const OPENERS = {
      openmode:'#modelChip', openmodel:'#modelChip',
      openratio:'#ratioChip', openres:'#resChip', opencount:'#countChip'
    };
    HASH_PARTS.forEach(part => {
      const el = OPENERS[part] && document.querySelector(OPENERS[part]);
      if (el) el.click();
    });
    // A drag cannot be held while the page is captured, so #drop freezes the
    // overlay the way #openratio freezes the popover.
    if (HASH_PARTS.includes('drop')) composerEl.classList.add('dropping');
    // Long stacks are reviewed from the tail far more often than the head.
    if (HASH_PARTS.includes('bottom')){
      const st = $('#stage');
      st.scrollTop = st.scrollHeight;
    }
  });
})();
</script>
</body>
</html>
