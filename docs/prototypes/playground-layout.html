<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>apiduo · Playground 布局原型</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    font-feature-settings:"tnum" 0;
    overflow:hidden;
  }

  :root{
    --bg: oklch(0.986 0.003 255);
    --surface: oklch(1 0 0);
    --surface-2: oklch(0.972 0.004 255);
    --line: oklch(0.910 0.006 255);
    --line-soft: oklch(0.946 0.005 255);
    --ink: oklch(0.215 0.012 258);
    --ink-2: oklch(0.455 0.012 258);
    --ink-3: oklch(0.590 0.012 258);
    --primary: oklch(0.600 0.185 258);
    --primary-ink: oklch(0.450 0.190 258);
    --primary-wash: oklch(0.962 0.024 258);
    --danger: oklch(0.560 0.190 25);
    --danger-wash: oklch(0.965 0.020 25);
    --shadow-sm: 0 1px 2px oklch(0 0 0 / .055);
    --shadow-lg: 0 20px 54px -30px oklch(0.25 0.04 258 / .38), 0 1px 2px oklch(0 0 0 / .05);
    --shadow-focus: 0 24px 64px -32px oklch(0.30 0.08 258 / .45), 0 1px 2px oklch(0 0 0 / .05);
    --r-xl: 18px;
    --r-lg: 14px;
    --r-md: 10px;
    --r-sm: 7px;
    /* ── motion ──
       Springs, not durations. A tween has an end time, so a second press has to
       fight the first one; a spring has only a target and re-aims from wherever
       the object is right now. These curves are sampled from a damped harmonic
       oscillator and handed to CSS as linear(). Damping / response follow
       Apple's own table: 1.0 for movement, ~0.8 for a sheet, and bounce only
       where the gesture itself carried momentum (a press release, a tile
       arriving). Each --d-* is the settle time of the curve it names. */
    --sp-quick: linear(0, .0197, .0685, .1347, .2097, .2877, .3649, .4386, .5074, .5705, .6275, .6784, .7235, .7631, .7977, .8277, .8536, .876, .8951, .9115, .9254, .9373, .9473, .9558, .963, .9691, .9741, .9784, .982, .985, .9875, .9896, .9914, .9928, .9941, .9951, .9959, .9966, .9972, .9977, 1);
    --sp-tap: linear(0, .0155, .0567, .1164, .1884, .2677, .3504, .4331, .5134, .5894, .66, .7242, .7816, .8322, .8759, .9132, .9443, .9699, .9904, 1.0064, 1.0185, 1.0272, 1.0331, 1.0366, 1.0382, 1.0383, 1.0372, 1.0353, 1.0328, 1.0299, 1.0268, 1.0236, 1.0204, 1.0174, 1.0146, 1.012, 1.0096, 1.0075, 1.0057, 1.0041, 1);
    --sp-move: linear(0, .0202, .0702, .1377, .2141, .2932, .3713, .4457, .5149, .5781, .635, .6858, .7305, .7698, .804, .8335, .859, .8809, .8995, .9155, .929, .9404, .9501, .9583, .9652, .971, .9758, .9799, .9833, .9861, .9885, .9904, .9921, .9934, .9946, .9955, .9963, .9969, .9975, .9979, 1);
    --sp-sheet: linear(0, .0176, .0635, .1286, .2057, .2889, .3739, .4573, .5368, .6107, .6781, .7384, .7914, .8374, .8766, .9095, .9368, .9589, .9765, .9903, 1.0007, 1.0083, 1.0136, 1.0171, 1.0191, 1.0199, 1.0198, 1.0191, 1.0179, 1.0164, 1.0148, 1.0131, 1.0115, 1.0098, 1.0083, 1.0069, 1.0057, 1.0045, 1.0036, 1.0027, 1);
    --sp-bounce: linear(0, .0276, .0991, .199, .3146, .4357, .5544, .6652, .7642, .8495, .9201, .9762, 1.0188, 1.0491, 1.0688, 1.0797, 1.0835, 1.0819, 1.0764, 1.0684, 1.0589, 1.0488, 1.0388, 1.0294, 1.021, 1.0136, 1.0075, 1.0027, .9989, .9962, .9945, .9934, .993, .9931, .9935, .9942, .995, .9958, .9966, .9974, 1);
    --d-quick: .2s;
    --d-tap: .3s;
    --d-move: .42s;
    --d-sheet: .38s;
    --d-bounce: .62s;
    /* The two old names survive as aliases: every rule written before the
       spring pass keeps working, it just moves like a spring now. */
    --settle: var(--sp-move);
    --pop: var(--sp-bounce);
    --stage-h: min(50vh, 460px);
    /* The height a result may take. It used to be 400px so that one round plus
       the composer always fit without scrolling — but a job list *is* the
       scroll, and at 400 a square image sat 400px wide in a 700px column with
       150px of nothing on either side. The cap now only bites on tall ratios,
       where a full-width portrait would be taller than the screen. */
    --res-h: min(68vh, 640px);
  }

  [data-theme="dark"]{
    --bg: oklch(0.163 0.008 260);
    --surface: oklch(0.198 0.009 260);
    --surface-2: oklch(0.232 0.010 260);
    --line: oklch(0.292 0.012 260);
    --line-soft: oklch(0.256 0.010 260);
    --ink: oklch(0.952 0.005 260);
    --ink-2: oklch(0.730 0.010 260);
    --ink-3: oklch(0.612 0.010 260);
    --primary: oklch(0.690 0.155 258);
    --primary-ink: oklch(0.790 0.120 258);
    --primary-wash: oklch(0.295 0.055 258);
    --danger: oklch(0.680 0.165 25);
    --danger-wash: oklch(0.290 0.055 25);
    --shadow-sm: 0 1px 2px oklch(0 0 0 / .35);
    --shadow-lg: 0 22px 58px -30px oklch(0 0 0 / .75), 0 1px 2px oklch(0 0 0 / .35);
    --shadow-focus: 0 26px 68px -32px oklch(0 0 0 / .8), 0 1px 2px oklch(0 0 0 / .35);
  }

  /* Older engines (Safari < 17.2, Chrome < 113) cannot parse linear(), and an
     invalid timing function does not degrade to `ease` — it poisons the whole
     `transition` shorthand, which then resolves to its initial `all 0s`. The
     result is not "less springy", it is "nothing moves at all". Re-declaring the
     five curves as the closest cubic-beziers keeps the motion, minus the exact
     settle shape. Detection is on the real property, not on the token name. */
  @supports not (transition-timing-function: linear(0, 1)) {
    :root{
      --sp-quick: cubic-bezier(.4, 0, .2, 1);
      --sp-tap: cubic-bezier(.34, 1.42, .64, 1);
      --sp-move: cubic-bezier(.32, .72, 0, 1);
      --sp-sheet: cubic-bezier(.3, 1.12, .6, 1);
      --sp-bounce: cubic-bezier(.22, 1.35, .36, 1);
    }
  }

  /* ───────── provenance tints ───────── */

  /* One declaration per lab, exposed only as `--tint`: a solid glyph wants the
     colour, a badge wants a wash of it, a hairline wants it at 40%. Consumers
     mix it toward `--ink` at the point of use, which is what makes the same
     single value legible on a white surface and on a near-black one. */
  .by-openai    {--tint: oklch(0.58 0.020 260)}
  .by-anthropic {--tint: oklch(0.64 0.125 48)}
  .by-deepseek  {--tint: oklch(0.58 0.155 262)}
  .by-bfl       {--tint: oklch(0.46 0.030 300)}
  .by-bytedance {--tint: oklch(0.60 0.115 205)}
  .by-google    {--tint: oklch(0.66 0.135 85)}

  /* ───────── shell ───────── */

  .app{
    position:relative;
    display:flex;
    flex-direction:column;
    height:100%;
    isolation:isolate;
  }

  /* One soft wash at the top of the canvas. Without it the middle of the page
     is pure white and any single object in it reads as floating debris. */
  .app::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:-1;
    pointer-events:none;
    background:
      radial-gradient(58% 42% at 50% -6%, color-mix(in oklch, var(--primary) 7%, transparent), transparent 72%),
      radial-gradient(40% 30% at 92% 8%, color-mix(in oklch, var(--primary) 4%, transparent), transparent 70%);
  }

  /* Ambient light: the wash at the top of the page takes its hue from the last
     picture that landed. Not decoration — a result allowed to tint the room it
     sits in reads as an object, not as an embed. Three hues plus the idle blue,
     cross-faded, because a gradient cannot interpolate itself. */
  .ambient{
    position:absolute; inset:0 0 auto 0;
    height:min(82vh, 760px);
    z-index:-1;
    overflow:hidden;
    pointer-events:none;
  }
  .ambient i{
    position:absolute; inset:0;
    opacity:0;
    /* Centre on the top edge, not above it: a bleed of -30% put the brightest
       half of the gradient outside the clip, which is why the first version
       measured as no colour at all. */
    /* Wider than the reading column on purpose: the artwork covers the middle
       of the page, so a narrow wash would hide behind the very thing it is
       supposed to be spilling from. 64% reaches the margins. */
    background:radial-gradient(64% 46% at 50% 0%,
      color-mix(in oklch, var(--amb) 36%, transparent), transparent 76%);
    transition:opacity 1.15s var(--sp-move);
  }
  .ambient i.on{opacity:1}
  .ambient .g0{--amb:oklch(0.64 0.130 196)}
  .ambient .g1{--amb:oklch(0.74 0.145 66)}
  .ambient .g2{--amb:oklch(0.62 0.080 52)}
  .ambient .g3{--amb:oklch(0.64 0.135 258)}
  /* Same light, less of it: on a near-black page 34% of a light hue reads twice
     as loud as it does on white. */
  [data-theme="dark"] .ambient i.on{opacity:.6}

  .topbar{
    display:flex;
    align-items:center;
    gap:10px;
    height:54px;
    flex:0 0 auto;
    padding:0 16px;
    border-bottom:1px solid var(--line-soft);
    background:color-mix(in oklch, var(--bg) 78%, transparent);
    backdrop-filter:saturate(180%) blur(18px);
    -webkit-backdrop-filter:saturate(180%) blur(18px);
  }

  /* The top bar now carries only session-level facts. Mode used to sit here,
     which put the first choice of the composer a full screen away from every
     other choice in it — the user had to travel from the ceiling to the floor
     to change what they were making. */
  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
  }
  .brand-mark{
    width:22px;
    height:22px;
    flex:0 0 auto;
    display:grid;
    place-items:center;
    border-radius:7px;
    background:linear-gradient(150deg,
      color-mix(in oklch, var(--primary) 84%, white),
      color-mix(in oklch, var(--primary) 96%, black));
    color:oklch(1 0 0);
    font-size:11px;
    font-weight:700;
    letter-spacing:-.02em;
    box-shadow:0 1px 2px oklch(0 0 0 / .16);
  }
  .brand-name{
    font-size:12.5px;
    font-weight:600;
    letter-spacing:-.01em;
    color:var(--ink);
  }
  .brand-sub{
    padding-left:9px;
    margin-left:1px;
    border-left:1px solid var(--line);
    font-size:11.5px;
    color:var(--ink-3);
    white-space:nowrap;
  }

  /* Type and model are one decision, so they are one chip: the leading glyph
     is the type (chat / image / video), the name is the model. The type is
     changed on the tab bar inside the popover — the same popover. */
  .chip.count-chip{padding:0 7px}
  .chip.count-chip .name{min-width:15px; text-align:center}

  .topbar-right{
    display:flex;
    align-items:center;
    gap:6px;
    margin-left:auto;
  }

  .spend{
    display:inline-flex;
    align-items:baseline;
    gap:5px;
    height:28px;
    padding:0 9px;
    border-radius:var(--r-sm);
    color:var(--ink-3);
    font-size:11.5px;
    white-space:nowrap;
    transition:background-color .18s ease;
  }
  .spend:hover{background:color-mix(in oklch, var(--ink) 5%, transparent)}
  .spend b{
    display:inline-block;
    transform-origin:left center;
    font-variant-numeric:tabular-nums;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
    letter-spacing:-.01em;
  }

  .spend b.bump{animation:bump .52s var(--sp-bounce)}
  @keyframes bump{
    0%{transform:scale(1)}
    32%{transform:scale(1.16); color:var(--primary-ink)}
    100%{transform:scale(1)}
  }

  .icon-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:28px;
    height:28px;
    border:0;
    border-radius:var(--r-sm);
    background:transparent;
    color:var(--ink-3);
    cursor:pointer;
    transition:background-color .18s ease, color .18s ease, transform .09s ease-out;
  }
  .icon-btn:hover{background:color-mix(in oklch, var(--ink) 6%, transparent); color:var(--ink)}
  .icon-btn:active{transform:scale(.94)}
  .icon-btn[aria-pressed="true"]{background:var(--primary-wash); color:var(--primary-ink)}
  .icon-btn svg{width:15px;height:15px}

  /* ───────── stage ───────── */

  .stage{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:22px 16px 12px;
    scrollbar-width:thin;
  }
  .stage::-webkit-scrollbar{width:9px}
  .stage::-webkit-scrollbar-thumb{
    background:color-mix(in oklch, var(--ink) 16%, transparent);
    border-radius:99px;
    border:3px solid transparent;
    background-clip:content-box;
  }

  /* Canvas + suggestions are one group, so they must share one auto margin.
     Putting it on .stream alone tore the two apart on a tall phone. */
  .stage-inner{
    width:100%;
    max-width:700px;
    display:flex;
    flex-direction:column;
    margin-block:auto;
  }

  /* Content scrolls under the composer. Without a fade the last visible image
     is cut by a hard horizontal edge, which reads as a broken layout rather
     than "there is more below". Sticky + negative margin keeps it out of flow. */
  .stage::after{
    content:"";
    position:sticky;
    bottom:-12px;
    flex:0 0 auto;
    width:100%;
    height:34px;
    margin-top:-34px;
    pointer-events:none;
    background:linear-gradient(to top, var(--bg) 24%, transparent);
  }

  .stream{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  /* ───────── canvas ───────── */

  /* The box is driven by the ratio control, so it is the control's echo.
     Width = min(available, stage-height * ratio) keeps the shape exact at any
     viewport; setting a height instead would let max-width break the ratio. */
  .frame{
    --arn:1;
    /* flex-shrink must be off: as a column flex item, a 16:9 canvas taller than
       the leftover space would be squashed and lose its ratio, which silently
       breaks the one promise this prototype makes — the canvas matches the
       chosen shape. */
    flex:0 0 auto;
    width:min(100%, calc(var(--stage-h) * var(--arn)));
    aspect-ratio:var(--arn);
    margin-inline:auto;
    border-radius:var(--r-xl);
    overflow:hidden;
    position:relative;
    transition:width .46s var(--settle);
  }

  .canvas-empty{
    /* The first screen is about what this thing can do, not about reserving a
       460px hole. Half that is enough to show the chosen shape, and it leaves
       the examples room to be seen without scrolling. */
    --stage-h:min(26vh, 230px);
    display:grid;
    place-content:center;
    justify-items:center;
    gap:9px;
    padding:24px;
    text-align:center;
    border:1px dashed color-mix(in oklch, var(--ink) 15%, transparent);
    background:
      radial-gradient(circle at 1px 1px, color-mix(in oklch, var(--ink) 6%, transparent) 1px, transparent 0) 0 0/18px 18px,
      var(--surface-2);
  }
  .canvas-empty::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(60% 60% at 50% 45%, var(--surface) 42%, transparent 78%);
    pointer-events:none;
  }
  .canvas-empty > *{position:relative; z-index:1}

  .canvas-icon{
    display:grid;
    place-items:center;
    width:40px;
    height:40px;
    border-radius:12px;
    background:var(--surface);
    color:var(--primary-ink);
    box-shadow:var(--shadow-sm), 0 0 0 1px var(--line);
    margin-bottom:2px;
  }
  .canvas-icon svg{width:18px;height:18px}

  .chat-empty{
    display:grid;
    place-content:center;
    justify-items:center;
    gap:9px;
    padding:56px 24px;
    text-align:center;
  }

  .canvas-title{
    font-size:13.5px;
    font-weight:560;
    letter-spacing:-.005em;
    color:var(--ink);
  }
  .canvas-sub{
    font-size:12px;
    line-height:1.6;
    color:var(--ink-3);
    max-width:280px;
  }
  .canvas-sub kbd{
    font:inherit;
    font-size:11px;
    padding:1px 5px;
    border-radius:4px;
    background:color-mix(in oklch, var(--ink) 8%, transparent);
    color:var(--ink-2);
  }

  .suggestions{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:6px;
    margin-top:14px;
    width:100%;
  }

  .sug{
    border:1px solid var(--line);
    background:color-mix(in oklch, var(--surface) 70%, transparent);
    color:var(--ink-2);
    font:inherit;
    font-size:11.5px;
    padding:5px 10px;
    border-radius:99px;
    cursor:pointer;
    transition:background-color .16s ease, border-color .16s ease, color .16s ease, transform .09s ease-out;
    backdrop-filter:blur(8px);
    animation:sugIn var(--d-move) var(--sp-quick) backwards;
    animation-delay:calc(var(--i, 0) * 26ms);
  }
  @keyframes sugIn{
    from{opacity:0; transform:translateY(6px) scale(.96)}
    to{opacity:1; transform:none}
  }
  .sug:hover{background:var(--surface); border-color:color-mix(in oklch, var(--ink) 20%, transparent); color:var(--ink)}
  .sug:active{transform:scale(.97)}

  /* ── examples ── */

  /* An empty screen has to answer "what can this thing do" before it asks for
     a prompt. Three finished pictures do that better than three sentence
     fragments, and a picture is also the only honest way to show a ratio. */
  .ex-wrap{width:100%}
  .ex-head{display:flex; align-items:center; gap:10px; margin:0 2px}
  .ex-title{font-size:14px; font-weight:560; color:var(--ink); letter-spacing:.005em}
  /* The shelf is not a fixed list, so the escape hatch belongs on the shelf's
     own line — next to the claim, not buried under the third card. */
  .ex-more{
    margin-left:auto;
    display:inline-flex; align-items:center; gap:4px;
    padding:3px 8px 3px 7px;
    border:1px solid transparent; border-radius:8px;
    background:transparent;
    color:var(--ink-3);
    font:inherit; font-size:11px;
    cursor:pointer;
    transition:color .16s ease, background-color .16s ease, border-color .16s ease, transform .09s ease-out;
  }
  .ex-more:hover{color:var(--ink); background:var(--surface-2); border-color:var(--line)}
  .ex-more:active{transform:scale(.96)}
  .ex-more svg{width:12px; height:12px; opacity:.85}
  .ex-more.turn svg{animation:exTurn .52s var(--settle)}
  @keyframes exTurn{from{transform:rotate(0)} to{transform:rotate(360deg)}}
  .ex-sub{margin:3px 2px 12px; font-size:11.5px; color:var(--ink-3)}
  .ex-row{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:10px;
  }
  .ex{
    position:relative;
    display:flex; flex-direction:column;
    padding:0; text-align:left;
    border:1px solid var(--line);
    border-radius:14px;
    background:var(--surface);
    overflow:hidden;
    cursor:pointer;
    /* Staggered entrance: three cards arriving at once reads as a jump-cut,
       one after another reads as a shelf being laid out. */
    /* backwards, not both: a filled-in final keyframe keeps applying its
       `transform:none` forever and silently kills the hover lift below. */
    animation:exIn var(--d-move) var(--sp-move) backwards;
    animation-delay:calc(var(--i) * 65ms + 40ms);
    transition:transform var(--d-move) var(--sp-move),
      box-shadow var(--d-move) var(--sp-quick),
      border-color .2s var(--sp-quick);
  }
  @keyframes exIn{from{opacity:0; transform:translateY(9px) scale(.985)} to{opacity:1; transform:none}}
  .ex:hover{
    transform:translateY(-3px) scale(1.006);
    border-color:color-mix(in oklch, var(--primary) 42%, var(--line));
    box-shadow:0 12px 28px -18px oklch(0 0 0 / .55),
               0 0 0 1px color-mix(in oklch, var(--primary) 18%, transparent);
  }
  .ex:active{transform:translateY(0) scale(.994); transition-duration:0s}
  .ex:focus-visible{outline:2px solid color-mix(in oklch, var(--primary) 60%, transparent); outline-offset:2px}
  .ex-art{
    position:relative; display:block;
    aspect-ratio:16/10;
    overflow:hidden;
    background:var(--surface-2);
  }
  .ex-art > svg{display:block; width:100%; height:100%; transition:transform .55s var(--settle)}
  .ex:hover .ex-art > svg{transform:scale(1.055)}
  /* One pass of light across the picture on hover — the cheapest way to make a
     still image feel alive without a video or a canvas. */
  .ex-sheen{
    position:absolute; inset:0;
    background:linear-gradient(104deg,
      transparent 38%,
      color-mix(in oklch, #fff 22%, transparent) 50%,
      transparent 62%);
    transform:translateX(-130%);
    transition:transform .72s ease;
    pointer-events:none;
  }
  .ex:hover .ex-sheen{transform:translateX(130%)}
  .ex-ratio{
    position:absolute; right:7px; bottom:7px;
    padding:1px 6px;
    border-radius:6px;
    background:oklch(0 0 0 / .58);
    color:#fff;
    font-size:10px; letter-spacing:.02em;
    text-shadow:0 1px 1px oklch(0 0 0 / .35);
    font-variant-numeric:tabular-nums;
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
  }
  /* The model is on the card because the card is a claim about the model, not
     just a prompt you could have typed yourself. It rides the picture instead
     of taking a line of its own: a caption row of grey 10px text spends a whole
     line saying what a badge says in the corner. */
  .ex-model{
    position:absolute; left:7px; bottom:7px;
    display:inline-flex; align-items:center; gap:4px;
    max-width:58%;
    padding:1px 6px;
    border-radius:6px;
    background:oklch(0 0 0 / .58);
    color:#fff;
    font-size:10px; letter-spacing:.01em;
    text-shadow:0 1px 1px oklch(0 0 0 / .35);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
  }
  /* White inside the badge whatever the lab's tint is: the badge already sits on
     a dark scrim over an unpredictable picture, and a second colour there is one
     more thing competing with the artwork. */
  .ex-model svg{width:11px; height:11px; flex:0 0 auto; opacity:.92}
  /* Title and the call to action share one line: the eye reads "this one" and
     "take it" as a single decision instead of scanning past a prompt first. */
  .ex-name-row{
    display:flex; align-items:baseline; gap:8px;
    padding:9px 11px 0;
  }
  .ex-name{
    flex:1 1 auto; min-width:0;
    font-size:12.5px; font-weight:560; color:var(--ink); letter-spacing:.005em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .ex-go{
    flex:0 0 auto;
    font-style:normal; font-size:10.5px; font-weight:520;
    color:var(--primary-ink);
    opacity:.68;
    transition:opacity .16s ease;
  }
  .ex:hover .ex-go, .ex:focus-visible .ex-go{opacity:1}
  .ex-p{
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2;
    overflow:hidden;
    padding:3px 11px 11px;
    font-size:11.5px; line-height:1.55;
    color:var(--ink-2);
    text-wrap:pretty;
  }
  /* A phone cannot show three cards side by side without shrinking the picture
     to a postage stamp, so the shelf becomes a swipeable strip. */
  @media (max-width:760px){
    .ex-row{
      display:flex; gap:9px;
      overflow-x:auto;
      scroll-snap-type:x mandatory;
      scroll-padding-inline:12px;
      margin-inline:-12px; padding:0 12px 2px;
      scrollbar-width:none;
    }
    .ex-row::-webkit-scrollbar{display:none}
    .ex{flex:0 0 68%; scroll-snap-align:start}
  }
  @media (prefers-reduced-motion:reduce){
    .ex{animation:none}
    .ex-art > svg, .ex-sheen{transition:none}
    .ex-more.turn svg{animation:none}
  }

  /* generating */

  .canvas-loading{
    display:grid;
    place-items:center;
    background:var(--surface-2);
    isolation:isolate;
  }
  .canvas-loading .fill{
    position:absolute;
    inset:0;
    background:
      radial-gradient(55% 45% at 30% 25%, color-mix(in oklch, var(--primary) 20%, transparent), transparent 70%),
      radial-gradient(45% 50% at 72% 78%, color-mix(in oklch, var(--primary) 12%, transparent), transparent 72%);
    opacity:.9;
  }
  .shimmer{
    position:absolute;
    inset:0;
    background-image:linear-gradient(102deg, transparent 26%, color-mix(in oklch, var(--ink) 7%, transparent) 46%, transparent 66%);
    background-size:230% 100%;
    animation:shimmer 1.9s ease-in-out infinite;
  }
  @keyframes shimmer{from{background-position:-70% 0}to{background-position:170% 0}}

  .loader{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:11px;
  }
  .ring{
    width:26px;height:26px;
    border-radius:99px;
    border:2px solid color-mix(in oklch, var(--primary) 22%, transparent);
    border-top-color:var(--primary);
    animation:spin .78s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .loader-text{
    font-size:11.5px;
    color:var(--ink-3);
    font-variant-numeric:tabular-nums;
    letter-spacing:.01em;
  }
  .loader-text b{color:var(--ink-2); font-weight:550}

  /* result */

  /* A job card is as wide as the column; the artwork inside it is what keeps
     a height budget. Sizing the *card* by ratio was right for one hero image,
     but a list of jobs turned into a ragged stack 700 / 448 / 255 px wide,
     each centred on its own axis — four left edges to scan in one scroll.
     Cards line up; the media centres inside them. */
  .round{
    --arn:1;
    position:relative;
    isolation:isolate;
    display:flex;
    flex-direction:column;
    gap:7px;
    width:100%;
    /* A result arrives from below, where the composer is, because that is where
       it was asked for. Fill-mode is backwards so the finished state does not
       stay pinned over later hover / transform rules. */
    animation:rise var(--d-bounce) var(--sp-bounce) backwards;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(10px)}
    to{opacity:1; transform:none}
  }
  /* The picture lights the surface it sits on, the way a print under a lamp
     does. A blurred ellipse of the artwork's own hue, sized to the frame and
     painted under it — no extra element, no image processing, and it moves with
     the card because it *is* the card's box. */
  .round::before{
    content:'';
    position:absolute;
    z-index:-1;
    left:50%; top:6%;
    width:min(100%, calc(var(--res-h) * var(--arn)));
    aspect-ratio:var(--arn);
    transform:translateX(-50%);
    border-radius:50%;
    background:var(--glow, transparent);
    filter:blur(46px) saturate(1.1);
    opacity:.42;
    pointer-events:none;
  }
  [data-theme="dark"] .round::before{opacity:.34}

  .round-meta{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:11px;
    color:var(--ink-3);
    padding:0 2px;
    /* A fixed height, not a min-height: the row's text changes with the job's
       status, and a line that wraps on one status but not the other makes the
       card grow 7px the moment the result lands. */
    height:18px;
    white-space:nowrap;
  }
  .round-meta .mid{
    display:flex; align-items:center; gap:7px;
    min-width:0; overflow:hidden;
    /* Soft-fade the cut instead of an ellipsis: the last thing to lose is the
       unit price, and a hard clip on a tabular number reads as a bug. */
    -webkit-mask-image:linear-gradient(to right, #000 calc(100% - 16px), transparent);
    mask-image:linear-gradient(to right, #000 calc(100% - 16px), transparent);
  }
  .round-meta .mid > span{flex:0 0 auto}
  .round-meta .dot{opacity:.42}
  .round-meta .mono{font-variant-numeric:tabular-nums}
  .round-meta .cost{
    color:var(--ink-2);
    font-weight:560;
    font-variant-numeric:tabular-nums;
  }
  /* The price and the one action never truncate: the middle gives way first,
     because a half-faded 取消 or ¥0.46 is a broken receipt. */
  .round-meta .right{margin-left:auto; display:flex; align-items:center; gap:8px; flex:0 0 auto}
  .meta-link{
    border:0;background:transparent;font:inherit;font-size:11px;
    color:var(--ink-3);cursor:pointer;padding:2px 0;border-radius:4px;
    transition:color .16s ease;
  }
  .meta-link:hover{color:var(--primary-ink)}
  .meta-link.danger{color:var(--danger)}

  .art{
    --arn:1;
    /* The same budget the reserved box used, so the picture that lands is the
       size of the box that was held for it. */
    width:min(100%, calc(var(--res-h) * var(--arn)));
    margin-inline:auto;
    aspect-ratio:var(--arn);
    border-radius:var(--r-lg);
    overflow:hidden;
    position:relative;
    background:var(--surface-2);
    box-shadow:0 0 0 1px var(--line-soft);
    isolation:isolate;
    /* The shelf sizes itself against the card, not the viewport: a four-up on a
       phone and a four-up on a desktop are the same markup at two very
       different widths. */
    container-type:inline-size;
  }
  .art svg{display:block;width:100%;height:100%}
  .art .veil{
    position:absolute;inset:0;
    background:var(--surface-2);
    animation:veil .62s var(--settle) forwards;
  }
  @keyframes veil{to{opacity:0}}
  .art .develop{
    position:absolute;inset:0;
    animation:develop var(--d-move) var(--sp-move) both;
  }
  /* The last step of a generation is not the pixels appearing, it is the light
     leaving the frame: one specular pass, once, over a picture that is already
     sharp. */
  .art .land{
    position:absolute; inset:0; z-index:2;
    pointer-events:none;
    background:linear-gradient(104deg,
      transparent 34%, oklch(1 0 0 / .34) 48%, transparent 62%);
    transform:translateX(-120%);
    animation:landSweep 1.15s .1s var(--sp-quick) both;
  }
  @keyframes landSweep{to{transform:translateX(120%)}}
  /* A highlight that follows the pointer across the picture. It never touches
     the pixels — only the light on top of them — which is the cheapest honest
     way to say "surface, not printout". */
  @media (hover:hover){
    .art::after{
      content:'';
      position:absolute; inset:0; z-index:2;
      pointer-events:none;
      background:radial-gradient(42% 42% at var(--mx, 50%) var(--my, 50%),
        oklch(1 0 0 / .26), transparent 72%);
      opacity:0;
      mix-blend-mode:soft-light;
      transition:opacity .35s var(--sp-quick);
    }
    .art:hover::after{opacity:1}
  }
  @keyframes develop{
    from{opacity:0; filter:blur(11px) saturate(.82); transform:scale(1.03)}
    to{opacity:1; filter:none; transform:none}
  }
  /* The picture is not the last step; it is the first input of the next one.
     So the two corner buttons become a shelf. The list lives in TOOLS (data),
     and the shelf is laid out from it — adding 去水印 / 抠图 later is a row in
     that table, not another absolutely-positioned square competing for a spot
     that is already taken.

     Centred, never scrolled horizontally: a strip that hides half its tools
     behind a drag gesture on a 180px picture is not a toolbar, it is a rumour.
     Density follows the card rather than the viewport — narrow cards shrink the
     buttons so the seven still fit one row (see the container query below),
     because folding five-and-two orphans the 下载 divider and eats a third of
     the picture. Wrapping stays as the last resort for widths in between. */
  .tools{
    position:absolute; left:50%; bottom:8px;
    transform:translate(-50%, 6px);
    display:flex; flex-wrap:wrap; justify-content:center; gap:2px;
    width:max-content; max-width:calc(100% - 12px);
    padding:3px;
    border-radius:10px;
    background:color-mix(in oklch, var(--surface) 82%, transparent);
    -webkit-backdrop-filter:blur(14px) saturate(1.6);
    backdrop-filter:blur(14px) saturate(1.6);
    box-shadow:var(--shadow-sm), 0 0 0 1px color-mix(in oklch, var(--line) 55%, transparent);
    opacity:0; pointer-events:none;
    z-index:3;
    transition:opacity .16s var(--sp-quick), transform var(--d-sheet) var(--sp-sheet);
  }
  /* A hairline of light along the top edge. Glass catches the room; without it
     the shelf is a flat grey strip pasted on the picture. */
  .tools::before{
    content:'';
    position:absolute; inset:0;
    border-radius:inherit;
    pointer-events:none;
    background:linear-gradient(180deg, oklch(1 0 0 / .55), oklch(1 0 0 / 0) 46%);
    opacity:.3;
    mix-blend-mode:overlay;
  }
  .art:hover .tools, .art:focus-within .tools{
    opacity:1; transform:translate(-50%, 0); pointer-events:auto;
  }
  /* A picture that is already in the reference strip has to keep saying so
     after the pointer leaves the card — otherwise the only way to learn it is
     to press again and watch the tile vanish. */
  .tools:has([aria-pressed="true"]){
    opacity:1; transform:translate(-50%, 0); pointer-events:auto;
  }

  .tool{
    position:relative;
    width:26px; height:26px; display:grid; place-items:center;
    border:0; border-radius:7px;
    background:transparent; color:var(--ink-2);
    cursor:pointer;
    /* Seven buttons arriving in one frame is a snap; fourteen milliseconds
       apart is a row being laid down, left to right — the order they are read
       in. The delay lives on the way in only: leaving together is snappier. */
    opacity:0;
    transform:translateY(4px);
    transition:background .13s var(--sp-quick), color .13s var(--sp-quick),
      opacity .18s var(--sp-quick), transform var(--d-tap) var(--sp-tap);
  }
  .art:hover .tool, .art:focus-within .tool,
  .tools:has([aria-pressed="true"]) .tool{
    opacity:1; transform:none;
    transition-delay:calc(var(--ti, 0) * 14ms);
  }
  .tool svg{width:15px; height:15px}
  .tool:hover{background:color-mix(in oklch, var(--ink) 9%, transparent); color:var(--ink)}
  .tool:focus-visible{outline:2px solid var(--primary); outline-offset:-2px}
  .tool[aria-pressed="true"]{background:var(--primary); color:#fff; animation:toolOn .42s var(--sp-bounce)}
  @keyframes toolOn{from{transform:scale(.8)} to{transform:scale(1)}}
  .tool[aria-pressed="true"]:hover{background:var(--primary)}
  /* One hairline before 下载: everything to its left makes another picture,
     everything to its right takes this one out of the door. */
  .tool.end{
    margin-left:5px;
    box-shadow:inset 1px 0 0 color-mix(in oklch, var(--line) 95%, transparent);
  }

  /* Icons this literal still need names — 抠图 and 去水印 are one glyph apart at
     15px, and 「局部重绘」 cannot be guessed from any mark. The label sits above
     the button and is free to overlap the row above when the shelf wraps: that
     is what a tooltip does. */
  .tool::after{
    content:attr(data-label);
    position:absolute; bottom:calc(100% + 7px); left:50%;
    transform:translate(-50%, 3px);
    padding:3px 7px; border-radius:6px;
    background:var(--ink); color:var(--surface);
    font-size:10.5px; line-height:1.35; letter-spacing:.01em; white-space:nowrap;
    box-shadow:0 2px 8px oklch(0 0 0 / .18);
    opacity:0; pointer-events:none; z-index:2;
    transition:opacity .12s ease, transform .15s var(--settle);
  }
  .tool:hover::after, .tool:focus-visible::after{opacity:1; transform:translate(-50%, 0)}
  /* While a note is up it says the same thing better, and two labels in the
     same twenty pixels read as a rendering fault. */
  .tools:has(.tool-note) .tool::after{opacity:0; transition:none}

  .tool-note{
    position:absolute; left:50%; bottom:calc(100% + 7px);
    transform:translate(-50%, 4px);
    padding:4px 9px; border-radius:7px;
    background:var(--ink); color:var(--surface);
    font-size:11px; line-height:1.35; white-space:nowrap;
    box-shadow:0 3px 12px oklch(0 0 0 / .2);
    opacity:0; pointer-events:none; z-index:3;
    animation:noteIn .18s var(--settle) forwards;
  }
  .tool-note.out{animation:noteOut .2s ease forwards}
  @keyframes noteIn{to{opacity:1; transform:translate(-50%, 0)}}
  @keyframes noteOut{from{opacity:1; transform:translate(-50%, 0)} to{opacity:0; transform:translate(-50%, -4px)}}

  /* There is no hover on a phone, so a shelf that waits for one does not exist
     there — and 引用 is the action most worth having on a phone. */
  @media (hover:none){
    .tools{opacity:1; transform:translate(-50%, 0); pointer-events:auto}
    .tool{opacity:1; transform:none}
  }

  /* A quarter of a four-up on a phone is ~180px wide. The shelf at 26px a
     button wraps five-and-two — two rows over a third of the picture, with the
     下载 divider orphaned at the start of the second one. Shrink the shelf
     instead of folding it: at 20px the seven still fit across, and the picture
     keeps its bottom third. */
  @container (max-width:260px){
    .tools{gap:1px; padding:2px; max-width:calc(100% - 8px)}
    .tool{width:20px; height:20px; border-radius:5px}
    .tool svg{width:12px; height:12px}
    .tool.end{margin-left:3px}
  }

  .grid-2{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    /* Two rows share one image's budget, so a four-up stays the height of the
       single-image box it replaced. */
    width:min(100%, calc(var(--res-h) * var(--arn) + 8px));
    margin-inline:auto;
  }
  .grid-2 .art{width:100%; border-radius:var(--r-md)}

  /* ───────── job: queued / running ───────── */

  /* A job reserves the exact box its result will occupy: same aspect ratio,
     same grid, same gutters. Finishing swaps the pixels inside a rectangle
     that never changed size — the cheapest way to make progress feel calm is
     to leave nothing to reflow. */
  .ph{
    position:relative;
    /* The budget sits on the wrapper, not on the cells: the floating status
       pill is absolute to .ph, and centring it on the column instead of the
       artwork would park it in the gutter. */
    width:min(100%, calc(var(--res-h) * var(--arn)));
    margin-inline:auto;
  }
  /* No 1.1 fudge for a grid any more: it made a four-up 8% taller than the
     stage it has to fit in. Two rows of the same budget, plus the gap. */
  .ph.wide{width:min(100%, calc(var(--res-h) * var(--arn) + 8px))}
  .ph-cells{display:grid; gap:8px}
  .ph-cells.one{grid-template-columns:1fr}
  .ph-cells.two{grid-template-columns:repeat(2,1fr)}
  .ph-cell{
    position:relative;
    aspect-ratio:var(--arn);
    border-radius:var(--r-lg);
    overflow:hidden;
    background:var(--surface-2);
    box-shadow:inset 0 0 0 1px var(--line-soft);
    isolation:isolate;
  }
  .ph-cells.two .ph-cell{border-radius:var(--r-md)}
  .ph-cell .shimmer{opacity:.62}
  /* Queued is not "loading slower" — it has not started, so it must not
     shimmer. A hatch says nothing is happening here yet. */
  .ph-cell.queued{
    background:
      repeating-linear-gradient(135deg,
        transparent 0 7px,
        color-mix(in oklch, var(--ink) 4.5%, transparent) 7px 14px),
      var(--surface-2);
  }
  .ph-cell.queued .shimmer{display:none}
  .ph-float{
    position:absolute; inset:0;
    display:grid; place-content:center; justify-items:center; gap:9px;
    padding:16px;
    text-align:center;
    pointer-events:none;
    /* A scrim under the label only: a four-up has to keep reading as four
       images in flight, not as one big spinner. */
    background:radial-gradient(58% 46% at 50% 50%, color-mix(in oklch, var(--surface) 84%, transparent), transparent 74%);
  }
  .ph-state{
    display:inline-flex; align-items:center; gap:7px;
    padding:6px 11px 6px 9px;
    border-radius:99px;
    background:color-mix(in oklch, var(--surface) 94%, transparent);
    box-shadow:var(--shadow-sm), 0 0 0 1px var(--line-soft);
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    font-size:11.5px; color:var(--ink-2);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .ph-state b{color:var(--ink); font-weight:560}
  /* A percentage ticking 0→100 must not resize the pill it lives in. The
     queued count does not tick, so it keeps its natural width. */
  .ph-state b[data-pct]{display:inline-block; min-width:2.7em; text-align:right}
  .ph-state .ring{width:13px;height:13px;border-width:1.7px}
  .ph-state .dot-q{
    width:6px;height:6px;border-radius:99px;
    background:color-mix(in oklch, var(--ink) 30%, transparent);
  }
  .pbar{
    width:132px;height:3px;border-radius:99px;
    background:color-mix(in oklch, var(--ink) 10%, transparent);
    overflow:hidden;
  }
  .pbar i{
    display:block;height:100%;width:100%;
    border-radius:99px; background:var(--primary);
    transform:scaleX(0); transform-origin:left center;
    transition:transform .16s linear;
  }

  .round-meta .st{font-weight:540}
  .round-meta .st::before{
    content:""; display:inline-block;
    width:5px;height:5px;border-radius:99px;
    background:currentColor; margin-right:4px; vertical-align:middle;
  }
  .round-meta .st.running{color:var(--primary-ink)}
  .round-meta .st.queued{color:var(--ink-3)}
  .round-meta .st.failed{color:var(--danger)}
  .round-meta .st.running::before{animation:pulse 1.5s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.32}}

  /* A video result is a still frame until you play it: without the glyph and
     the length, a clip and an image look identical in the receipt. */
  .art .play{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:38px;height:38px;border-radius:99px;
    display:grid;place-items:center;
    background:oklch(0 0 0 / .44); color:#fff;
    -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
    pointer-events:none;
  }
  .art .play svg{width:13px;height:13px;margin-left:2px}
  .art .len{
    position:absolute; left:8px; bottom:8px;
    padding:1px 5px;border-radius:4px;
    background:oklch(0 0 0 / .52); color:#fff;
    font-size:9.5px; font-variant-numeric:tabular-nums;
  }

  .failed{
    display:grid;
    place-content:center;
    justify-items:center;
    gap:8px;
    padding:26px;
    text-align:center;
    border-radius:var(--r-lg);
    background:var(--danger-wash);
    box-shadow:inset 0 0 0 1px color-mix(in oklch, var(--danger) 22%, transparent);
    width:min(100%, calc(var(--res-h) * var(--arn)));
    margin-inline:auto;
    aspect-ratio:var(--arn);
  }
  .failed-title{font-size:12.5px;font-weight:560;color:var(--danger)}
  .failed-msg{
    font-size:11.5px;line-height:1.6;color:color-mix(in oklch, var(--danger) 78%, var(--ink));
    max-width:300px;
    font-variant-numeric:tabular-nums;
  }
  .retry{
    margin-top:3px;
    display:inline-flex;align-items:center;gap:5px;
    border:1px solid color-mix(in oklch, var(--danger) 30%, transparent);
    background:var(--surface);
    color:var(--danger);
    font:inherit;font-size:11.5px;font-weight:520;
    padding:5px 11px;border-radius:7px;cursor:pointer;
    transition:transform .09s ease-out, box-shadow .16s ease;
  }
  .retry:hover{box-shadow:var(--shadow-sm)}
  .retry:active{transform:scale(.97)}
  .retry svg{width:12px;height:12px}

  /* What went in, at the size of a receipt line: after a few turns nobody
     remembers which reference produced which image. */
  .round-in{display:flex; gap:5px; margin:-3px 0 8px}
  .ref.mini{width:30px; height:30px; border-radius:6px}

  /* ───────── composer ───────── */

  .composer{
    flex:0 0 auto;
    padding:10px 16px 14px;
    background:linear-gradient(to top, var(--bg) 62%, transparent);
  }

  .composer-inner{
    width:100%;
    /* Wider than the canvas on purpose: the canvas is a reading column, the
       composer is a control panel with six controls on one line. At 700px the
       price was pushed to a second row by 9px. */
    position:relative;
    max-width:768px;
    margin-inline:auto;
    border-radius:var(--r-xl);
    background:var(--surface);
    box-shadow:var(--shadow-lg), 0 0 0 1px var(--line);
    transition:box-shadow var(--d-move) var(--sp-move), transform var(--d-move) var(--sp-move);
  }
  /* Not a glow — a rise. The thing you are typing into should feel like it came
     a millimetre toward you, which is also the only feedback that survives a
     keyboard opening under it. */
  .composer-inner:focus-within{
    box-shadow:var(--shadow-focus), 0 0 0 1px color-mix(in oklch, var(--primary) 42%, var(--line));
    transform:translateY(-1px);
  }

  /* Files arrive three ways now — picker, clipboard, drag. The picker has a
     tile to aim at; a dragged screenshot does not, so the whole composer
     turns into the target while a file is over it. */
  .drop-hint{
    position:absolute; inset:4px;
    display:grid; place-items:center;
    opacity:0;
    /* Hidden from the text tree as well as the eye: an invisible overlay that
       still says 参考图 is read out by screen readers and by search. */
    visibility:hidden;
    transform:scale(.988);
    transition:opacity .18s var(--sp-quick), transform var(--d-sheet) var(--sp-sheet),
      visibility 0s .18s;
    border-radius:calc(var(--r-xl) - 4px);
    border:1.5px dashed color-mix(in oklch, var(--primary) 58%, transparent);
    background:color-mix(in oklch, var(--surface) 82%, transparent);
    backdrop-filter:blur(2px);
    -webkit-backdrop-filter:blur(2px);
    color:var(--primary-ink);
    font-size:11.5px; font-weight:520; letter-spacing:.01em;
    pointer-events:none;
    z-index:3;
  }
  .composer-inner.dropping{transform:translateY(-2px)}
  .composer-inner.dropping .drop-hint{opacity:1; visibility:visible; transform:none; transition-delay:0s}

  /* The reference row is part of the request, not part of how it is rendered:
     a file changes what the request *is* (文生图 → 图生图, 文本问答 → 图片问答).
     Every chip below only changes how it is drawn, so the files sit above the
     text they belong to, not in the parameter row. */
  .refs{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px 0;
  }
  .refs[hidden]{display:none}
  .ref-row{display:flex; flex-wrap:wrap; gap:6px; min-width:0; flex:0 1 auto}
  .ref{
    position:relative;
    width:46px; height:46px; flex:0 0 auto;
    border-radius:9px;
    overflow:hidden;
    border:1px solid var(--line);
    background:var(--surface-2);
  }
  .ref svg, .ref img{display:block; width:100%; height:100%}
  .ref img{object-fit:cover}
  /* The strip sits at the bottom of the screen while the picture just clicked
     is somewhere in the middle: without a local cue the new tile is easy to
     miss, and "nothing happened" is the wrong lesson. */
  .ref.fresh{animation:refIn .34s var(--pop)}
  @keyframes refIn{from{opacity:0; transform:scale(.72)} to{opacity:1; transform:none}}
  .ref .x{
    position:absolute; top:2px; right:2px;
    width:15px; height:15px; padding:0;
    display:grid; place-items:center;
    border:0; border-radius:99px;
    background:oklch(0 0 0 / .42);
    color:#fff;
    cursor:pointer;
    opacity:.8;
    transition:opacity .14s ease, background-color .14s ease;
  }
  .ref:hover .x, .ref:focus-within .x{opacity:1; background:oklch(0 0 0 / .62)}
  .ref .x svg{width:9px; height:9px}
  /* A filled slot is also its own replace button: with both 首帧 and 尾帧 in
     place there is no "+" left, so 换图 must start from the picture itself. */
  .ref.swap{cursor:pointer}
  .ref.swap:hover{box-shadow:0 0 0 1px color-mix(in oklch, var(--primary) 55%, transparent)}
  .ref .kind{
    position:absolute; left:3px; bottom:3px;
    padding:0 3px; border-radius:4px;
    background:oklch(0 0 0 / .55); color:#fff;
    font-size:8.5px; line-height:13px; letter-spacing:.02em;
  }
  .ref .slot{
    position:absolute; inset:auto 0 0 0;
    padding:1px 0 2px; text-align:center;
    background:linear-gradient(to top, oklch(0 0 0 / .62), transparent);
    color:#fff; font-size:9px; line-height:1.2;
  }
  .ref-add{
    width:46px; height:46px; flex:0 0 auto;
    display:inline-flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    border:1px dashed color-mix(in oklch, var(--ink) 26%, transparent);
    border-radius:9px;
    padding:0;
    background:transparent;
    color:var(--ink-3);
    font:inherit; font-size:9px; line-height:1.2;
    white-space:nowrap;
    cursor:pointer;
    transition:color .15s ease, border-color .15s ease, background-color .15s ease;
  }
  .ref-add:hover{
    color:var(--primary-ink);
    border-color:color-mix(in oklch, var(--primary) 45%, transparent);
    background:var(--primary-wash);
  }
  .ref-add:active{transform:scale(.97)}
  .ref-add svg{width:13px; height:13px}
  .ref-cap{
    flex:0 0 auto;
    font-size:10.5px;
    color:var(--ink-3);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .ref-cap.full{color:var(--danger)}

  /* Chat has no reference *slot*. In 图片 the empty dashed box is the lesson
     ("drop a picture here and it becomes 图生图"); in a chat the same box is
     56px of scaffolding that promises an image model above a text field. The
     picture attached to a message is part of the question, so chat gets one
     square button in the composer row — the place every chat app puts attach —
     and the thumbnails only appear once there is something to show. */
  .attach{
    width:28px; height:28px; flex:0 0 auto;
    display:inline-grid; place-items:center;
    padding:0;
    border:1px solid var(--line);
    border-radius:8px;
    background:transparent;
    color:var(--ink-2);
    cursor:pointer;
    transition:color .15s ease, border-color .15s ease, background-color .15s ease;
  }
  .attach:hover{
    color:var(--primary-ink);
    border-color:color-mix(in oklch, var(--primary) 45%, transparent);
    background:var(--primary-wash);
  }
  .attach:active{transform:scale(.97)}
  .attach svg{width:14px; height:14px}
  /* Attached already: the button keeps its place, it only changes state. */
  .attach.on{
    color:var(--primary-ink);
    border-color:color-mix(in oklch, var(--primary) 34%, var(--line));
    background:var(--primary-wash);
  }
  .attach[data-full="true"]{border-style:dashed; color:var(--ink-3)}
  .attach[data-full="true"]:hover{color:var(--danger); border-color:color-mix(in oklch, var(--danger) 40%, transparent); background:transparent}

  #prompt{
    display:block;
    width:100%;
    min-height:78px;
    max-height:190px;
    padding:14px 16px 4px;
    border:0;
    background:transparent;
    color:var(--ink);
    font:inherit;
    font-size:13.5px;
    line-height:1.62;
    resize:none;
    outline:none;
  }
  #prompt::placeholder{color:var(--ink-3)}

  .toolbar{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:7px;
    padding:5px 9px 9px;
  }

  /* One chip, one question: which model. The billing group used to ride along
     here as a suffix, which made a click target carry two meanings — pressing
     the model name could change your price. It now lives on the price. */
  .chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    height:28px;
    padding:0 8px 0 9px;
    border:1px solid var(--line);
    border-radius:8px;
    background:transparent;
    color:var(--ink);
    font:inherit;
    font-size:11.5px;
    font-weight:520;
    cursor:pointer;
    transition:background-color .16s ease, border-color .16s ease, transform .09s ease-out;
    max-width:230px;
  }
  .chip:hover{background:color-mix(in oklch, var(--ink) 4%, transparent); border-color:color-mix(in oklch, var(--ink) 22%, transparent)}
  .chip:active{transform:scale(.985)}
  .chip svg.lead{width:13px;height:13px;color:color-mix(in oklch, var(--tint, var(--primary-ink)) 86%, var(--ink));flex:0 0 auto}
  .chip .name{
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .chip .grp{
    color:var(--ink-3);
    font-weight:450;
    flex:0 0 auto;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    max-width:74px;
  }
  .chip .sep{color:var(--ink-3); opacity:.5; flex:0 0 auto}
  .chip svg.chev{width:11px;height:11px;color:var(--ink-3);flex:0 0 auto;margin-left:1px}

  /* The group is not a sibling of the model: it never changes what gets
     generated, only what it costs. So it lives on the price, where its one
     visible consequence already is. Clicking the number is the natural way to
     ask "why this number?". */
  .price-chip{
    display:inline-flex;
    align-items:center;
    gap:5px;
    height:26px;
    padding:0 6px 0 5px;
    border:1px solid transparent;
    border-radius:7px;
    background:transparent;
    color:var(--ink-3);
    font:inherit;
    font-size:11px;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
    cursor:pointer;
    transition:background-color .16s ease, border-color .16s ease;
  }
  .price-chip:hover{background:color-mix(in oklch, var(--ink) 4%, transparent); border-color:var(--line)}
  .price-chip:active{transform:scale(.985)}
  .price-chip b{font-size:12px; font-weight:600; color:var(--ink-2); letter-spacing:-.01em}
  .price-chip .grp{color:var(--ink-3); font-weight:450; max-width:66px; overflow:hidden; text-overflow:ellipsis}
  .price-chip svg.chev{width:10px;height:10px;color:var(--ink-3);flex:0 0 auto}

  /* ───────── parameter chips ───────── */

  /* An enum that can grow does not belong inline. A model declaring fifteen
     ratios would push every other control off the row, and the row is the only
     place the next choice can be made. The chip carries the current value; the
     popover carries the whole set, however long it gets. */
  .param-chip{max-width:160px; padding-right:6px}
  .param-chip .lead-shape{
    width:16px; height:16px; flex:0 0 auto;
    display:inline-flex; align-items:center; justify-content:center;
    color:var(--primary-ink);
  }
  .param-chip .lead-shape i{
    display:block; border:1.5px solid currentColor; border-radius:2px;
  }
  .param-chip .dim{color:var(--ink-3); font-weight:450}

  /* ───────── enum popover ───────── */

  /* The first-level group and the models under it are one decision made twice,
     so they share one surface: the tab bar sits directly above the list it
     filters, and switching never closes the popover or moves the eye. */
  .pop-head{
    margin:-6px -6px 3px;
    padding:6px 6px 4px;
    border-bottom:1px solid var(--line-soft);
  }
  .pop-tabs{
    position:relative;
    --thumb-inset:3px;
    display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:2px;
    padding:3px; border-radius:9px;
    background:color-mix(in oklch, var(--ink) 5%, transparent);
  }
  .pop-tab{
    display:flex; align-items:center; justify-content:center; gap:5px;
    height:26px; padding:0 5px;
    border:0; border-radius:7px; background:transparent;
    color:var(--ink-3); font:inherit; font-size:11.5px; font-weight:520;
    white-space:nowrap; cursor:pointer;
    transition:background-color .18s ease, color .18s ease, box-shadow .18s ease;
  }
  .pop-tab svg{width:12px;height:12px;opacity:.7;flex:0 0 auto}
  .pop-tab .n{font-size:9.5px; font-variant-numeric:tabular-nums; opacity:.55}
  .pop-tab:hover{color:var(--ink)}
  .pop-tab[aria-selected="true"]{
    background:var(--surface); color:var(--ink); font-weight:600;
    box-shadow:var(--shadow-sm);
  }
  .pop-tab[aria-selected="true"] svg{opacity:1; color:var(--primary-ink)}
  .pop-tab[aria-selected="true"] .n{opacity:1; color:var(--primary-ink)}

  .enum-sec + .enum-sec{margin-top:3px}
  .enum-title{
    display:flex; align-items:center; gap:7px;
    padding:5px 7px 4px;
    font-size:9.5px; font-weight:600; letter-spacing:.09em;
    color:var(--ink-3); text-transform:uppercase;
  }
  .enum-title::after{content:''; flex:1; height:1px; background:var(--line-soft)}
  .enum-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:3px; padding:0 2px}
  .enum-grid.cols-2{grid-template-columns:repeat(2, 1fr)}

  .tile{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    height:46px; padding:4px 2px;
    border:1px solid transparent; border-radius:8px;
    background:transparent; color:var(--ink-2);
    font:inherit; font-size:10.5px; font-variant-numeric:tabular-nums;
    cursor:pointer;
    transition:background-color .14s ease, border-color .14s ease, color .14s ease, transform .09s ease-out;
  }
  .tile:hover{background:color-mix(in oklch, var(--ink) 6%, transparent)}
  .tile:active{transform:scale(.97)}
  .tile .bx{height:22px; display:flex; align-items:center; justify-content:center}
  .tile .bx i{display:block; border:1.5px solid currentColor; border-radius:2px; opacity:.7}
  .tile .bx i.dash, .param-chip .lead-shape i.dash{border-style:dashed; border-radius:3px}
  .tile .sub{font-size:9px; color:var(--ink-3); font-weight:450}
  .tile[aria-checked="true"]{
    background:color-mix(in oklch, var(--primary) 9%, transparent);
    border-color:color-mix(in oklch, var(--primary) 32%, transparent);
    color:var(--ink); font-weight:560;
  }
  .tile[aria-checked="true"] .bx i{opacity:1; color:var(--primary-ink)}
  .tile[aria-checked="true"] .sub{color:var(--primary-ink); opacity:.85}
  /* Unsupported is dimmed, never hidden and never silently swapped: the shape
     space stays stable when you change models, so you can see what you lost. */
  .tile[aria-disabled="true"]{opacity:.26; cursor:not-allowed}
  .tile[aria-disabled="true"]:hover{background:transparent}
  .tile.auto{
    grid-column:1 / -1; height:auto; flex-direction:row;
    justify-content:flex-start; gap:8px; padding:8px 9px;
  }
  .tile.auto .sub{margin-left:auto}

  .pick-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:3px; padding:0 2px}
  .pick{
    height:34px; border:1px solid transparent; border-radius:8px;
    background:transparent; color:var(--ink-2);
    font:inherit; font-size:12px; font-weight:520;
    font-variant-numeric:tabular-nums; cursor:pointer;
    transition:background-color .14s ease, border-color .14s ease, color .14s ease;
  }
  .pick:hover{background:color-mix(in oklch, var(--ink) 6%, transparent)}
  .pick[aria-checked="true"]{
    background:color-mix(in oklch, var(--primary) 9%, transparent);
    border-color:color-mix(in oklch, var(--primary) 32%, transparent);
    color:var(--ink);
  }

  /* The footer repeats the two things the grid cannot show at a glance: the
     pixels this combination actually produces, and why some tiles are dim. */
  .pop-foot{
    display:flex; align-items:center; gap:8px;
    margin:6px -6px -6px; padding:8px 10px;
    border-top:1px solid var(--line-soft);
    font-size:9.5px; color:var(--ink-3);
    font-variant-numeric:tabular-nums;
  }
  .pop-foot .r{margin-left:auto; text-align:right}

  .segment{
    position:relative;
    --thumb-inset:2px;
    display:inline-flex;
    align-items:center;
    gap:1px;
    padding:2px;
    border-radius:8px;
    background:color-mix(in oklch, var(--ink) 5%, transparent);
  }
  /* One white pill that slides between segments, instead of two states that
     blink. This is the whole reason a segmented control feels like one object:
     the selection has a position, and position is something you can follow. */
  .seg-thumb{
    position:absolute;
    left:var(--thumb-inset, 2px);
    top:var(--thumb-inset, 2px);
    z-index:0;
    border-radius:6px;
    background:var(--surface);
    box-shadow:var(--shadow-sm);
    pointer-events:none;
    transition:transform var(--d-sheet) var(--sp-sheet), width var(--d-sheet) var(--sp-sheet);
  }
  .pop-tabs .seg-thumb{border-radius:7px}
  .seg, .pop-tab{position:relative; z-index:1}
  /* Only when the thumb exists does the item drop its own fill — without JS the
     old look comes back rather than a permanently unselected control. */
  .segment:has(.seg-thumb) .seg[aria-pressed="true"],
  .pop-tabs:has(.seg-thumb) .pop-tab[aria-selected="true"]{
    background:transparent;
    box-shadow:none;
  }

  .seg{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    height:24px;
    min-width:30px;
    padding:0 7px;
    border:0;
    border-radius:6px;
    background:transparent;
    color:var(--ink-3);
    font:inherit;
    font-size:11px;
    font-weight:520;
    font-variant-numeric:tabular-nums;
    cursor:pointer;
    transition:background-color .18s ease, color .18s ease, box-shadow .18s ease, transform .09s ease-out;
    white-space:nowrap;
  }
  .seg:hover{color:var(--ink)}
  .seg[aria-pressed="true"]{
    background:var(--surface);
    color:var(--ink);
    box-shadow:var(--shadow-sm);
  }
  .seg:active{transform:scale(.95)}

  .toolbar .right{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:8px;
  }

  .clear{
    display:inline-flex;align-items:center;justify-content:center;
    width:28px;height:28px;
    border:0;border-radius:7px;
    background:transparent;color:var(--ink-3);
    cursor:pointer;
    transition:background-color .16s ease, color .16s ease, opacity .16s ease;
  }
  .clear:hover{background:color-mix(in oklch, var(--ink) 6%, transparent); color:var(--ink)}
  .clear svg{width:13px;height:13px}

  /* Concurrency belongs to the engine, so it sits next to 生成 rather than in
     the parameter row. It is always rendered: a chip that appears on submit
     and leaves on finish would reflow the toolbar twice per job. */
  .conc{
    display:inline-flex; align-items:center; gap:5px;
    height:24px; padding:0 7px;
    border-radius:99px;
    font-size:10.5px; color:var(--ink-3);
    font-variant-numeric:tabular-nums;
    box-shadow:inset 0 0 0 1px var(--line-soft);
    white-space:nowrap;
    transition:color .2s ease, background-color .2s ease, box-shadow .2s ease;
  }
  .conc b{font-weight:560; color:var(--ink-2); min-width:26px; text-align:right}
  .conc .d{
    width:5px;height:5px;border-radius:99px;
    background:color-mix(in oklch, var(--ink) 28%, transparent);
  }
  .conc.live{
    color:var(--primary-ink);
    background:var(--primary-wash);
    box-shadow:inset 0 0 0 1px color-mix(in oklch, var(--primary) 24%, transparent);
  }
  .conc.live b{color:var(--primary-ink)}
  .conc.live .d{background:var(--primary); animation:pulse 1.5s ease-in-out infinite}

  /* A mode tab carries a dot while that mode has work running, so switching
     away from a job never hides it silently. */
  .pop-tab .live-dot{width:4px;height:4px;border-radius:99px;background:var(--primary);margin-left:-2px;flex:0 0 auto}

  .submit{
    display:inline-flex;
    align-items:center;
    gap:6px;
    height:30px;
    padding:0 14px;
    border:0;
    border-radius:9px;
    background:var(--primary);
    color:#fff;
    font:inherit;
    font-size:12.5px;
    font-weight:560;
    letter-spacing:.01em;
    cursor:pointer;
    box-shadow:0 1px 2px oklch(0 0 0 / .12), inset 0 1px 0 oklch(1 0 0 / .18);
    transition:background-color .16s ease, transform .09s ease-out, box-shadow .2s ease, filter .16s ease;
  }
  .submit:hover:not(:disabled){filter:brightness(1.06); box-shadow:0 4px 14px -4px color-mix(in oklch, var(--primary) 55%, transparent), inset 0 1px 0 oklch(1 0 0 / .18)}
  .submit:active:not(:disabled){transform:scale(.97)}
  .submit:disabled{opacity:.42; cursor:not-allowed; box-shadow:none}
  /* Busy is not "unavailable": the button stays solid and reports what it is
     doing, otherwise the only feedback for a 20s generation is a spinner in
     the canvas far above the click. */
  .submit.busy{opacity:1; cursor:progress; background:color-mix(in oklch, var(--primary) 82%, var(--ink))}
  .submit svg{width:13px;height:13px}
  .submit .mini-ring{
    width:12px;height:12px;border-radius:99px;
    border:1.7px solid oklch(1 0 0 / .35);
    border-top-color:#fff;
    animation:spin .72s linear infinite;
  }

  .hint.warn{color:var(--danger)}

  .hint{
    max-width:700px;
    margin:7px auto 0;
    font-size:10.5px;
    color:var(--ink-3);
    text-align:center;
    letter-spacing:.005em;
  }

  /* ───────── model popover ───────── */

  .pop{
    /* Fixed, not absolute: the anchor's rect is already in viewport space, and
       a popup that gets clipped by the viewport is worse than one that covers
       its trigger. Absolute positioning made the maths depend on scroll and
       on which ancestor happened to be positioned. */
    position:fixed;
    z-index:40;
    width:268px;
    padding:6px;
    /* Fourteen ratios do not fit in a popover; a popover that runs off the
       viewport is worse than one that scrolls inside it. */
    max-height:min(66vh, 460px);
    overflow-y:auto;
    overscroll-behavior:contain;
    border-radius:12px;
    background:color-mix(in oklch, var(--surface) 96%, transparent);
    /* Two shadows, because a popover that opens upward lands on the white
       composer: one wide soft cast for depth, one tight contact shadow so the
       bottom edge still reads as an edge over a white surface. */
    box-shadow:0 24px 60px -22px oklch(0 0 0 / .30),
               0 6px 18px -12px oklch(0 0 0 / .22),
               0 0 0 1px color-mix(in oklch, var(--ink) 11%, var(--line));
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    /* The corner it grows from is written by placePop(): a popover must come
       out of the thing that opened it, not out of the middle of itself. */
    transform-origin:var(--pop-ox, left) var(--pop-oy, bottom);
    animation:popIn var(--d-sheet) var(--sp-sheet) both;
  }
  /* 0.955 → 1 with a 2% overshoot. A popover that fades in at full size reads
     as a picture of a popover; one that grows from its trigger reads as a lid. */
  @keyframes popIn{
    from{opacity:0; transform:translateY(5px) scale(.955)}
    to{opacity:1; transform:none}
  }
  .pop[hidden]{display:none}
  /* The model popover keeps its tab bar outside the scroll area: the first
     level must stay in reach even when the list below it is long. */
  .pop.pop-model{display:flex; flex-direction:column; overflow:hidden}
  .pop-model .pop-body{overflow-y:auto; overscroll-behavior:contain; min-height:0; margin:0 -6px; padding:0 6px;
    animation:listIn .3s var(--sp-quick)}
  @keyframes listIn{from{opacity:.35; transform:translateY(3px)} to{opacity:1; transform:none}}

  .pop-label{
    font-size:10px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-3);
    padding:7px 8px 5px;
  }

  .pop-item{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    padding:6px 8px;
    border:0;
    border-radius:7px;
    background:transparent;
    color:var(--ink);
    font:inherit;
    font-size:12px;
    text-align:left;
    cursor:pointer;
    transition:background-color .14s ease;
  }
  .pop-item:hover{background:color-mix(in oklch, var(--ink) 6%, transparent)}
  .pop-item .mono{font-variant-numeric:tabular-nums; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .pop-item .tail{margin-left:auto; font-size:10.5px; color:var(--ink-3); flex:0 0 auto}
  .pop-item .mark{width:13px; flex:0 0 auto; color:var(--primary-ink); opacity:0}
  .pop-item[aria-checked="true"] .mark{opacity:1}

  /* Model names alone do not tell anyone what to pick. Each row carries one
     line of "when should I choose this", the same way the model tells a
     stranger what it is good at. */
  .pop-item.model{
    align-items:flex-start;
    padding:7px 8px;
    gap:8px;
  }
  /* The tick moved behind the price: the avatar owns the leading slot now, and
     a tick that follows the thing it marks needs no reserved space of its own. */
  .pop-item.model .mark{order:3; align-self:center; margin:0 0 0 2px}
  /* Provenance as a well, not a picture: a 20px tinted square reads as an
     author badge at a glance, where a 20px logo would read as noise. */
  .pop-item.model .mby{
    flex:0 0 auto;
    display:grid; place-items:center;
    width:20px; height:20px;
    margin-top:1px;
    border-radius:7px;
    background:color-mix(in oklch, var(--tint, var(--ink-3)) 13%, transparent);
    color:color-mix(in oklch, var(--tint, var(--ink-3)) 84%, var(--ink));
  }
  .pop-item.model .mby svg{width:12px; height:12px}
  .pop-item.model .lines{display:flex; flex-direction:column; gap:2px; min-width:0; flex:1}
  .pop-item.model .which{display:flex; align-items:center; gap:6px; min-width:0}
  /* Absence is meaningful: a row without this tag cannot take a file, which is
     the one thing the list has to answer before the model is chosen. */
  .pop-item.model .cap{
    flex:0 0 auto;
    font-size:10px; font-weight:450;
    color:var(--ink-3);
    letter-spacing:.005em;
  }
  .pop-item.model .desc{
    font-size:10.5px;
    line-height:1.45;
    color:var(--ink-3);
    overflow:hidden;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }
  .pop-item.model .newtag{
    font-size:9px;
    font-weight:650;
    letter-spacing:.03em;
    padding:1px 4px;
    border-radius:4px;
    color:var(--primary-ink);
    background:color-mix(in oklch, var(--primary) 12%, transparent);
    flex:0 0 auto;
  }
  .pop-item.model[aria-checked="true"]{
    background:color-mix(in oklch, var(--primary) 7%, transparent);
  }
  .pop-item.model[aria-checked="true"]:hover{
    background:color-mix(in oklch, var(--primary) 11%, transparent);
  }
  .pop-item.model[aria-checked="true"] .which{font-weight:560}
  .pop-rule{height:1px; background:var(--line-soft); margin:5px 4px}

  /* ───────── annotations ───────── */

  .note{
    position:fixed;
    z-index:60;
    max-width:214px;
    padding:9px 11px;
    border-radius:10px;
    background:color-mix(in oklch, var(--surface) 94%, transparent);
    box-shadow:0 16px 44px -20px oklch(0 0 0 / .4), 0 0 0 1px color-mix(in oklch, var(--primary) 34%, var(--line));
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    font-size:11.5px;
    line-height:1.58;
    color:var(--ink-2);
    pointer-events:none;
  }
  .note b{
    display:block;
    color:var(--ink);
    font-size:11.5px;
    font-weight:600;
    margin-bottom:2px;
  }
  .note.legacy{
    box-shadow:0 16px 44px -20px oklch(0 0 0 / .4), 0 0 0 1px color-mix(in oklch, var(--danger) 38%, var(--line));
  }
  .note.legacy b{color:var(--danger)}

  .ring-mark{
    position:fixed;
    z-index:59;
    border:1.5px dashed color-mix(in oklch, var(--danger) 62%, transparent);
    border-radius:9px;
    pointer-events:none;
  }
  .ring-mark.ok{
    border-color:color-mix(in oklch, var(--primary) 62%, transparent);
  }

  /* ───────── menu ───────── */

  .menu{
    position:absolute;
    z-index:50;
    min-width:146px;
    padding:5px;
    border-radius:10px;
    background:color-mix(in oklch, var(--surface) 96%, transparent);
    box-shadow:0 20px 50px -22px oklch(0 0 0 / .35), 0 0 0 1px var(--line);
    backdrop-filter:blur(24px) saturate(180%);
    transform-origin:top right;
    animation:popIn var(--d-sheet) var(--sp-sheet) both;
  }
  .menu[hidden]{display:none}
  .menu-item{
    display:flex;align-items:center;gap:7px;
    width:100%;padding:6px 8px;
    border:0;border-radius:6px;
    background:transparent;color:var(--ink-2);
    font:inherit;font-size:11.5px;text-align:left;cursor:pointer;
    transition:background-color .14s ease, color .14s ease;
  }
  .menu-item:hover{background:color-mix(in oklch, var(--ink) 6%, transparent); color:var(--ink)}
  .menu-item .mark{margin-left:auto;width:12px;color:var(--primary-ink);opacity:0}
  .menu-item[aria-checked="true"]{color:var(--ink); font-weight:540}
  .menu-item[aria-checked="true"] .mark{opacity:1}

  /* ───────── responsive ───────── */

  @media (max-width:760px){
    :root{--stage-h:min(42vh, 330px)}
    .topbar{height:50px; padding:0 10px; gap:6px}
    /* The group tag is a second selector inside a chip that already answers
       "how much", and at 390 it lands on top of the submit button. */
    .price-chip .grp{display:none}
    .spend{padding:0 6px; font-size:0}
    .spend b{font-size:12px}
    .stage{padding:14px 12px 4px}
    .composer{padding:8px 12px 10px}
    .refs{padding:8px 10px 0; gap:8px}
    .ref, .ref-add{width:40px; height:40px}
    #prompt{min-height:64px; font-size:13px; padding:12px 14px 2px}
    .toolbar{gap:6px; padding:4px 8px 8px}
    .chip{max-width:186px}
    .toolbar .right{gap:6px}
    .hint{font-size:10px}
    .conc{padding:0 6px}
    .conc b{min-width:24px}
    .note{display:none}
    .ring-mark{display:none}
  }

  @media (max-width:430px){
    .chip .grp, .chip .sep{display:none}
    .price-chip .grp{display:none}
    .segment .seg{padding:0 5px; min-width:26px}
    /* Type and model now share the first chip, so the name gets the 40px the
       type chip used to take — enough for seedance-1.0-pro in full, with the
       two video segments still on the same line at 390. */
    .chip{max-width:176px}
    .param-chip{padding-right:4px}
  }

  /* Three separate switches, because they answer three different needs: keep
     the motion and still want opaque panes; want the motion gone and keep the
     glass; want both and need the edges darker. */
  @media (prefers-reduced-transparency: reduce){
    .topbar, .pop, .menu, .tools, .tool-note, .note, .ph-state, .ex-ratio,
    .ex-model, .sug, .art .play, .drop-hint, .ph-float{
      -webkit-backdrop-filter:none !important;
      backdrop-filter:none !important;
    }
    .topbar{background:var(--bg)}
    .pop, .menu, .tools, .tool-note, .note{background:var(--surface)}
  }
  @media (prefers-contrast: more){
    :root{--ink-3:oklch(0.40 0.012 258); --line:oklch(0.80 0.010 258); --line-soft:oklch(0.86 0.008 258)}
    [data-theme="dark"]{--ink-3:oklch(0.80 0.010 260); --line:oklch(0.44 0.014 260)}
    /* 2px, not 1.5: Chrome snaps a 1.5px border down to 1 on a 1x screen, so
       the request for more contrast would arrive as no change at all. */
    .chip, .tile, .seg, .attach, .ref-add, .ex, .sug{border-width:2px}
    :focus-visible{outline-width:2.5px}
  }
  /* The browser snapshots the whole page for a theme swap, so the change can be
     a dissolve instead of a frame of white. Same 420ms as everything else. */
  @media (prefers-reduced-motion:no-preference){
    ::view-transition-old(root), ::view-transition-new(root){
      animation-duration:.42s;
      animation-timing-function:var(--sp-quick);
    }
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important}
    .ring{animation:spin .78s linear infinite !important}
    .art .land, .art::after{display:none}
    .ambient i{transition:none}
  }

  /* ───────── press discipline (last, so it wins) ───────── */

  /* The press collapses in the frame it is received — no easing on the way in —
     and the release springs back. Anything that eases into a press reads as the
     interface deciding whether it is listening. */
  :is(.chip,.price-chip,.seg,.tile,.pick,.tool,.sug,.attach,.ref-add,.icon-btn,
      .ex,.ex-more,.clear,.retry,.submit,.menu-item,.pop-item,.pop-tab,.meta-link){
    -webkit-tap-highlight-color:transparent;
    transition-timing-function:var(--sp-quick);
  }
  :is(.chip,.price-chip,.seg,.tile,.pick,.tool,.sug,.attach,.ref-add,.icon-btn,
      .ex,.ex-more,.clear,.retry,.submit,.menu-item,.pop-item,.pop-tab):active{
    transition-duration:0s;
  }
  .tool:active{transform:scale(.9)}
  .pick:active, .pop-tab:active{transform:scale(.96)}
  .clear:active, .icon-btn:active{transform:scale(.92)}
  .pop-item:active, .menu-item:active{background:color-mix(in oklch, var(--ink) 11%, transparent)}
  .submit:hover:not(:disabled){transform:scale(1.015)}
  .submit:active:not(:disabled){transform:scale(.955)}
</style>
</head>
<body>
<div class="app" id="app">

<script>
(() => {
  'use strict';

  const ICON = {
    model:'<svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.6 21 7.3v9.4L12 21.4 3 16.7V7.3z"/><path d="M3 7.3l9 4.7 9-4.7M12 12v9.4"/></svg>',

    video:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="14" height="14" rx="2.5"/><path d="m16.5 10.5 5-3v9l-5-3z"/></svg>',
    /* The tool marks. Each is the one shape that survives a 15px box: sparkles
       for 变高清 (the mark every "enhance" button already owns), a struck-through
       drop for 去水印, scissors for 抠图, a solid picture inside a dashed canvas

    hd:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9.7 3.6C10.5 8.3 11.9 9.7 16.6 10.5c-4.7.8-6.1 2.2-6.9 6.9-.8-4.7-2.2-6.1-6.9-6.9C7.5 9.7 8.9 8.3 9.7 3.6Z"/><path d="M18.9 15.2l.7 3 3 .7-3 .7-.7 3-.7-3-3-.7 3-.7z"/></svg>',
    water:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11.3 3.4s5.3 5.3 5.3 8.8a5.3 5.3 0 0 1-10.6 0c0-3.5 5.3-8.8 5.3-8.8z"/><path d="M4.6 19.4 19.4 4.6"/></svg>',
    cut:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.7" cy="17.3" r="2.5"/><circle cx="17.3" cy="17.3" r="2.5"/><path d="M8.6 15.4 17.5 3.7M15.4 15.4 6.5 3.7"/></svg>',
    outpaint:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.9" y="3.9" width="16.2" height="16.2" rx="2.6" stroke-dasharray="2.4 2.4"/><rect x="8.7" y="8.7" width="6.6" height="6.6" rx="1.3"/></svg>',
    inpaint:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16.3 4.3 19.7 7.7 8 19.4 3.4 20.6 4.6 16z"/><path d="M13.1 7.5 16.5 10.9"/></svg>'

  /* The enum is the model's contract, not our shortlist: a real image model
     declares a dozen-plus ratios and no two models declare the same set. The
     picker therefore has to read as well at fourteen as it did at three.
     Order is by orientation, because that is the question people actually ask
     ("横的还是竖的"), not "which number is larger". */
  const RATIOS = {
    'auto' : { ar:1,    label:'自动', sec:'auto', auto:true },
    '21:9' : { ar:21/9, label:'21:9', sec:'land' },
    '2:1'  : { ar:2,    label:'2:1',  sec:'land' },
    '16:9' : { ar:16/9, label:'16:9', sec:'land' },
    '3:2'  : { ar:1.5,  label:'3:2',  sec:'land' },
    '4:3'  : { ar:4/3,  label:'4:3',  sec:'land' },
    '5:4'  : { ar:1.25, label:'5:4',  sec:'land' },
    '1:1'  : { ar:1,    label:'1:1',  sec:'sq'   },
    '4:5'  : { ar:0.8,  label:'4:5',  sec:'port' },
    '3:4'  : { ar:0.75, label:'3:4',  sec:'port' },
    '2:3'  : { ar:2/3,  label:'2:3',  sec:'port' },
    '9:16' : { ar:9/16, label:'9:16', sec:'port' },
    '1:2'  : { ar:0.5,  label:'1:2',  sec:'port' },
    '9:21' : { ar:9/21, label:'9:21', sec:'port' }
  };
  const RATIO_SECS = [['land','横屏'],['sq','方形'],['port','竖屏']];

  /* Resolution is an area class, not a width: the pixel dimensions shown for a
     combination are derived from the area and the ratio, which is why 1K is
     1360×768 at 16:9 and 1024×1024 at 1:1. */
  const RES = [
    { id:'768',  area:768*768,   label:'768',  note:'草稿', scale:0.6 },
    { id:'1024', area:1024*1024, label:'1K',   note:'标准', scale:1   },
    { id:'1536', area:1536*1536, label:'1.5K', note:'高清', scale:1.7 },
    { id:'2048', area:2048*2048, label:'2K',   note:'超分', scale:2.4 }
  ];

  /* Two roots, not one. The mode decides which models exist; the model decides
     which parameters exist. Switching either replaces everything to its right,

        <path d="M200 148 l56 32 v64 l-56 32 -56-32 v-64z"/>
        <path d="M144 180 l56 32 56-32M200 212 v64"/>
      </g>
      <g fill="#2dd4bf" fill-opacity=".82">
        <rect x="150" y="286" width="10" height="10" rx="2"/>
        <rect x="172" y="298" width="10" height="10" rx="2" fill-opacity=".5"/>
        <rect x="238" y="132" width="8" height="8" rx="2" fill="#fbbf24" fill-opacity=".85"/>
        <rect x="256" y="146" width="8" height="8" rx="2" fill="#fbbf24" fill-opacity=".45"/>
      </g>
      <circle cx="200" cy="212" r="3.4" fill="#e6fffb"/>
    </svg>`;
  }

  function artOrb(seed){
    const g = 'orb' + seed;
    return `<svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="bg${g}" x1="0" y1="0" x2=".4" y2="1">
          <stop offset="0" stop-color="#f8f2e6"/><stop offset="1" stop-color="#e7dcc9"/>
        </linearGradient>
        <radialGradient id="glass${g}" cx=".36" cy=".3" r=".82">
          <stop offset="0" stop-color="#ffffff" stop-opacity=".96"/>
          <stop offset=".38" stop-color="#dbeafe" stop-opacity=".72"/>
          <stop offset=".72" stop-color="#93c5fd" stop-opacity=".42"/>
          <stop offset="1" stop-color="#1e3a5f" stop-opacity=".34"/>
