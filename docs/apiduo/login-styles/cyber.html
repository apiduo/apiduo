<!DOCTYPE html>
<!--
  apiduo 登录页风格 05 · Cyber Grid（赛博网格）
  仅用于评审，不参与构建。
  判断：视觉冲击最强，适合发布会 / 活动落地页；长期使用会疲劳。
  收着做：网格只在下半屏、霓虹只出现在三处（标题下划线、CTA、状态点），
  正文一律用中性灰紫，否则中文小字会被霓虹糊掉。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Apiduo · 登录 · Cyber</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#06020e;
  --ink:#ece7fb;
  --ink-2:#a49ac2;
  --ink-3:#6f6690;
  --line:rgba(180,150,255,.14);
  --line-2:rgba(180,150,255,.22);
  --magenta:#ff2d95;
  --cyan:#22e0ff;
  --violet:#8b5cf6;
  --danger:#ff5c8a;
  --ok:#3ef2b5;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100svh;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans SC",sans-serif;
  font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px}

/* 背景 */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  background:
    radial-gradient(70% 50% at 50% 108%,rgba(255,45,149,.30),transparent 60%),
    radial-gradient(50% 40% at 82% 8%,rgba(34,224,255,.14),transparent 62%),
    radial-gradient(45% 40% at 12% 12%,rgba(139,92,246,.22),transparent 60%),
    linear-gradient(180deg,#08030f 0%,#06020e 45%,#0a0416 100%)}
.bg__grid{position:absolute;left:-70%;right:-70%;top:78%;bottom:auto;height:100%;
  background-image:
    linear-gradient(rgba(255,45,149,.42) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,45,149,.30) 1px,transparent 1px);
  background-size:76px 76px;
  transform:perspective(1100px) rotateX(58deg);
  transform-origin:50% 0;
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.34) 26%,#000 70%);
  mask-image:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.34) 26%,#000 70%);
  opacity:.62}
.bg__edge{position:absolute;left:0;right:0;top:78%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,45,149,.75) 22%,rgba(255,140,220,.95) 50%,rgba(255,45,149,.75) 78%,transparent);
  box-shadow:0 0 24px 2px rgba(255,45,149,.45)}
.bg__horizon{position:absolute;left:50%;top:78%;transform:translate(-50%,-50%);
  width:120vw;height:120px;background:radial-gradient(ellipse at center,rgba(255,45,149,.30),rgba(255,45,149,0) 68%);
  filter:blur(26px);opacity:.85}
.bg__scan{position:absolute;inset:0;opacity:.35;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px)}
.bg__vig{position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 38%,transparent 46%,rgba(4,1,10,.72) 100%)}
.bg__stars{position:absolute;inset:0;opacity:.5;
  background-image:radial-gradient(1px 1px at 12% 22%,rgba(255,255,255,.5),transparent),
                   radial-gradient(1px 1px at 68% 12%,rgba(255,255,255,.35),transparent),
                   radial-gradient(1px 1px at 84% 38%,rgba(255,255,255,.3),transparent),
                   radial-gradient(1px 1px at 32% 8%,rgba(255,255,255,.28),transparent)}

.topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:flex-end;
  gap:22px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink-3);
  padding-block:22px;padding-inline:max(34px,calc((100vw - 1220px)/2 + 48px))}
.topbar a{transition:color .18s}
.topbar a:hover{color:var(--cyan)}
.topbar__status{display:inline-flex;align-items:center;gap:7px}
.topbar__status i{width:5px;height:5px;border-radius:50%;background:var(--ok);box-shadow:0 0 9px var(--ok)}

.shell{position:relative;z-index:10;min-height:100svh;max-width:1220px;margin:0 auto;padding:104px 48px 56px}
.shell__grid{display:grid;grid-template-columns:minmax(0,1fr) 418px;gap:74px;align-items:center;
  min-height:calc(100svh - 160px)}

.hero{max-width:580px;animation:rise .8s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:40px}
.brand__mark{width:34px;height:34px;flex:none;filter:drop-shadow(0 0 14px rgba(255,45,149,.55))}
.brand__name{font-size:17px;font-weight:600;letter-spacing:.01em}
.brand__tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--ink-3);
  border:1px solid var(--line);border-radius:3px;padding:2px 6px;margin-left:2px}

.eyebrow{display:inline-flex;align-items:center;gap:9px;margin:0 0 20px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:#b39bd6}
.eyebrow i{width:5px;height:5px;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}

h1{margin:0 0 22px;font-size:clamp(34px,3.6vw,52px);line-height:1.12;font-weight:600;
  letter-spacing:-.015em;color:#fff;
  text-shadow:0 0 26px rgba(255,45,149,.28)}
h1 .line2{position:relative;display:inline-block;
  background-image:linear-gradient(96deg,#9fe9ff 0%,#c9a8ff 45%,#ff8fc7 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
h1 .slash{position:absolute;left:0;right:0;bottom:-6px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--magenta),rgba(139,92,246,.6) 55%,transparent);
  box-shadow:0 0 12px rgba(255,45,149,.85)}
.lede{margin:0;font-size:14.5px;line-height:1.85;color:#b4a9cf;letter-spacing:.008em;text-wrap:pretty}

.stats{display:flex;gap:34px;margin-top:34px}
.stat__n{font-family:var(--mono);font-size:20px;color:#f4eeff;letter-spacing:-.02em}
.stat__n em{font-style:normal;color:var(--cyan);font-size:12px;margin-left:2px}
.stat__l{font-size:11px;color:var(--ink-3);letter-spacing:.04em;margin-top:2px}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:32px;font-family:var(--mono);font-size:10.5px;color:#8f84b3}
.tags span{border:1px solid var(--line);border-radius:3px;padding:3px 8px;background:rgba(139,92,246,.05)}

/* 卡片 */
.panel{display:flex;justify-content:flex-end}
.card{position:relative;width:100%;border-radius:4px;padding:1px;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,45,149,.55),rgba(139,92,246,.25) 42%,rgba(34,224,255,.35));
  box-shadow:0 0 60px -18px rgba(255,45,149,.45),0 34px 70px -40px #000;
  animation:rise .9s var(--ease) both;animation-delay:.06s}
.card__in{position:relative;border-radius:3px;background:linear-gradient(180deg,rgba(16,8,28,.96),rgba(8,4,16,.98));
  backdrop-filter:blur(20px)}
.card__in::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 60% at 50% 0%,rgba(255,45,149,.14),transparent 60%)}
.card__body{position:relative;padding:28px 28px 24px}

.hud{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.14em;color:#7a6f9c;margin-bottom:18px;white-space:nowrap}
.hud b{color:var(--cyan);font-weight:400}

.ch h2{margin:0 0 6px;font-size:22px;font-weight:600;letter-spacing:-.02em;color:#fff}
.ch p{margin:0;font-size:12.5px;color:#8f84b3}

.oauth{display:flex;gap:7px;margin-top:22px}
.oauth button{flex:1;height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
  border:1px solid var(--line);border-radius:3px;background:rgba(139,92,246,.06);
  font-size:11.5px;color:#b8aad8;transition:border-color .18s,background .18s,color .18s,box-shadow .2s}
.oauth button:hover{border-color:rgba(34,224,255,.5);background:rgba(34,224,255,.08);color:#dff8ff;
  box-shadow:0 0 20px -8px rgba(34,224,255,.8)}
.oauth svg{width:14px;height:14px;flex:none;opacity:.85}

.divider{display:flex;align-items:center;gap:10px;margin:20px 0 18px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.12em;color:#6f6690;white-space:nowrap}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}

.field{margin-bottom:15px}
.field__head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.field label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:#8f84b3}
.field__link{font-size:10.5px;color:#6f6690;transition:color .18s}
.field__link:hover{color:var(--cyan)}
.input{position:relative}
.input input{width:100%;height:42px;padding:0 13px;border-radius:3px;border:1px solid var(--line);
  background:rgba(6,2,14,.75);font-size:13px;color:#f2ecff;transition:border-color .18s,box-shadow .22s}
.input input::placeholder{color:#5b527a}
.input input:focus{outline:none;border-color:rgba(34,224,255,.6);
  box-shadow:0 0 0 3px rgba(34,224,255,.10),0 0 22px -8px rgba(34,224,255,.9)}
.input--pw input{padding-right:44px}
.eye{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:32px;height:32px;display:grid;place-items:center;
  border-radius:3px;color:#6f6690;transition:color .18s}
.eye:hover{color:var(--cyan)}
.eye svg{width:15px;height:15px}

.turnstile{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;margin:0 0 14px;
  border:1px solid var(--line);border-radius:3px;background:rgba(139,92,246,.04);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:#6f6690;white-space:nowrap}
.turnstile .tick{width:13px;height:13px;display:grid;place-items:center;flex:none;
  border:1px solid rgba(62,242,181,.4);color:var(--ok)}
.turnstile .tick svg{width:8px;height:8px}
.turnstile .state{margin-left:auto;color:rgba(62,242,181,.85)}

.check{display:flex;align-items:flex-start;gap:9px;margin:0 0 16px;cursor:pointer;user-select:none}
.check input{position:absolute;opacity:0;width:0;height:0}
.check .box{width:14px;height:14px;margin-top:2px;flex:none;border:1px solid var(--line-2);border-radius:2px;
  display:grid;place-items:center;transition:background .16s,border-color .16s,box-shadow .2s}
.check .box svg{width:8px;height:8px;opacity:0;color:#08030f}
.check input:checked+.box{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 12px rgba(34,224,255,.6)}
.check input:checked+.box svg{opacity:1}
.check input:focus-visible+.box{outline:2px solid var(--cyan);outline-offset:2px}
.check .txt{font-size:11px;line-height:1.7;color:#8f84b3}
.check .txt a{color:#c3b6e0;border-bottom:1px solid rgba(195,182,224,.3)}
.check .txt a:hover{color:var(--cyan);border-color:var(--cyan)}

.submit{position:relative;width:100%;height:46px;border-radius:3px;overflow:hidden;
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  font-size:14px;font-weight:560;letter-spacing:.08em;color:#fff;
  background:linear-gradient(96deg,#ff2d95 0%,#c02bff 52%,#7b4dff 100%);
  box-shadow:0 0 30px -8px rgba(255,45,149,.85),inset 0 1px 0 rgba(255,255,255,.25);
  transition:transform .18s var(--ease),box-shadow .3s,filter .2s}
.submit::after{content:'';position:absolute;top:0;left:-58%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);
  transform:skewX(-18deg);transition:left .62s var(--ease)}
.submit:hover{filter:brightness(1.08);transform:translateY(-1px);
  box-shadow:0 0 42px -6px rgba(255,45,149,1),inset 0 1px 0 rgba(255,255,255,.3)}
.submit:hover::after{left:118%}
.submit:active{transform:translateY(0) scale(.99)}
.submit svg{width:16px;height:16px}

.foot{margin:16px 0 0;text-align:center;font-size:12px;color:#7a6f9c}
.foot a{color:var(--cyan);margin-left:5px;border-bottom:1px solid rgba(34,224,255,.35)}
.foot a:hover{border-color:var(--cyan)}

/* 四角标记 */
.corner{position:absolute;width:12px;height:12px;border-color:rgba(34,224,255,.65);border-style:solid;border-width:0;pointer-events:none;z-index:3}
.corner.tl{top:9px;left:9px;border-top-width:1px;border-left-width:1px}
.corner.tr{top:9px;right:9px;border-top-width:1px;border-right-width:1px}
.corner.bl{bottom:9px;left:9px;border-bottom-width:1px;border-left-width:1px}
.corner.br{bottom:9px;right:9px;border-bottom-width:1px;border-right-width:1px}

.mobile-head{display:none;flex-direction:column;align-items:center;gap:12px;margin-bottom:24px}
.mobile-head .brand{margin:0}
.mobile-head h1{font-size:24px;text-align:center;margin:0}

@media (max-width:1120px){
  .shell{padding:96px 36px 48px}
  .topbar{padding-inline:36px}
  .shell__grid{grid-template-columns:minmax(0,1fr) 400px;gap:46px}
  .brand{margin-bottom:32px}
}
@media (max-width:920px){
  .shell{padding:88px 24px 56px}
  .shell__grid{grid-template-columns:minmax(0,420px);justify-content:center;min-height:auto;padding-top:8px}
  .hero{display:none}
  .mobile-head{display:flex;width:100%}
  .panel{flex-direction:column;align-items:center;justify-content:center}
  .topbar{padding-block:18px;padding-inline:22px;gap:14px;font-size:10px}
  .topbar__docs{display:none}
  .bg__grid{height:70%;bottom:-24%}
}
@media (max-width:460px){
  .shell{padding:76px 16px 48px}
  .card__body{padding:22px 18px 20px}
  .oauth{gap:5px}
  .oauth button{font-size:10.5px;gap:4px;padding:0 3px}
  .oauth svg{width:13px;height:13px}
  .ch h2{font-size:20px}
  .input input{font-size:16px}
  .input input::placeholder{font-size:13px}
}
@media (max-height:820px) and (min-width:921px){
  .card__body{padding:22px 26px 20px}
  .hud{margin-bottom:14px}
  .oauth{margin-top:16px}
  .divider{margin:16px 0 14px}
  .field{margin-bottom:12px}
  .turnstile{margin-bottom:12px}
  .check{margin-bottom:13px}
  .foot{margin-top:13px}
  .shell{padding-top:78px;padding-bottom:26px}
  .shell__grid{min-height:calc(100svh - 108px)}
  .brand{margin-bottom:24px}
  .stats{margin-top:24px}
  .tags{margin-top:24px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>

<script>
(function(){
  var p = document.getElementById('password');
  var eye = document.getElementById('eye');
  var on = document.getElementById('eyeOn');
  var off = document.getElementById('eyeOff');
  eye.addEventListener('click', function(){
    var show = p.type === 'password';
    p.type = show ? 'text' : 'password';
    on.style.display = show ? 'none' : '';
    off.style.display = show ? '' : 'none';
    eye.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
    p.focus();
  });
  document.querySelector('form').addEventListener('submit', function(e){ e.preventDefault(); });
})();
</script>
